<%+header%>

<style type="text/css">
.lalune-status-card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 16px;
    text-align: center;
}
.lalune-status-card .moon {
    display: inline-block;
    margin-bottom: 12px;
}
.lalune-status-card .status-line {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 12px;
}
.lalune-status-card .status-line.ok { color: #2e7d32; }
.lalune-status-card .status-line.off { color: #c62828; }
.lalune-row { margin: 8px 0; }
.lalune-row select { min-width: 240px; padding: 4px; }
.lalune-btn {
    padding: 6px 16px;
    border-radius: 4px;
    border: 1px solid transparent;
    cursor: pointer;
    font-size: 14px;
    margin: 4px;
}
.lalune-btn-primary { background: #4a6cf7; color: white; }
.lalune-btn-danger  { background: #c62828; color: white; }
.lalune-btn-default { background: #f0f0f0; color: #333; border-color: #ccc; }
.lalune-tun-info {
    font-size: 12px;
    color: #666;
    margin-top: 12px;
}
</style>

<h2 name="content"><%:LaLune — Соединение%></h2>

<div class="lalune-status-card">
    <div class="moon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="90" height="90">
            <circle cx="50" cy="50" r="48" fill="#1a1a3e" stroke="#4a6cf7" stroke-width="2"/>
            <path d="M 60 18 A 28 28 0 1 0 82 58 A 34 34 0 1 1 60 18 Z" fill="#f7e84e" stroke="#d4c42a" stroke-width="1.5"/>
        </svg>
    </div>

    <div class="status-line off" id="lalune-status">Загрузка...</div>

    <div class="lalune-row">
        <label>Конфиг:</label>
        <select id="lalune-config-select">
            <option value="">— нет конфигов —</option>
        </select>
    </div>

    <div class="lalune-row">
        <button class="lalune-btn lalune-btn-primary" onclick="laluneConnect()">Подключить</button>
        <button class="lalune-btn lalune-btn-danger" onclick="laluneDisconnect()">Отключить</button>
    </div>

    <div class="lalune-tun-info" id="lalune-tun-info"></div>
</div>

<script type="text/javascript">
//<![CDATA[
var laluneApiBase = '<%=url("admin/services/lalune/api")%>';

function laluneFetch(path, params, cb) {
    var url = laluneApiBase + '/' + path;
    XHR.get(url + (params ? '?' + params : ''), null, function(xhr) {
        if (cb) cb(xhr);
    });
}

function lalunePost(path, params, cb) {
    var url = laluneApiBase + '/' + path;
    XHR.post(url, params || {}, function(xhr) {
        if (cb) cb(xhr);
    });
}

function laluneRefreshStatus() {
    laluneFetch('status', null, function(xhr) {
        var el = document.getElementById('lalune-status');
        var tun = document.getElementById('lalune-tun-info');
        if (xhr.status !== 200) {
            el.textContent = 'Ошибка чтения статуса';
            el.className = 'status-line off';
            return;
        }
        try {
            var s = JSON.parse(xhr.responseText);
            if (s.connected) {
                el.textContent = 'Подключено';
                el.className = 'status-line ok';
                var extra = '';
                if (s.tunIP) extra += 'TUN: ' + s.tunIP;
                if (s.activeSessions) extra += ' | Сессий: ' + s.activeSessions;
                tun.textContent = extra;
            } else {
                el.textContent = 'Отключено';
                el.className = 'status-line off';
                tun.textContent = s.lastCoreError ? ('Ошибка: ' + s.lastCoreError) : '';
            }
        } catch(e) {
            el.textContent = 'Ошибка парсинга';
            el.className = 'status-line off';
        }
    });
}

function laluneRefreshConfigs() {
    laluneFetch('configs', null, function(xhr) {
        var sel = document.getElementById('lalune-config-select');
        sel.innerHTML = '';
        try {
            var arr = JSON.parse(xhr.responseText);
            if (!arr || arr.length === 0) {
                var opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '— нет конфигов, добавьте на вкладке "Конфиги" —';
                sel.appendChild(opt);
                return;
            }
            arr.forEach(function(c) {
                var opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = (c.name || c.peer) + ' [' + (c.protocol || 'CSQTT') + ']';
                sel.appendChild(opt);
            });
        } catch(e) {
            var opt = document.createElement('option');
            opt.textContent = '— ошибка загрузки —';
            sel.appendChild(opt);
        }
    });
}

function laluneConnect() {
    var sel = document.getElementById('lalune-config-select');
    var id = sel.value;
    if (!id) { alert('Выберите конфиг'); return; }
    lalunePost('connect', { config_id: id }, function() {
        setTimeout(laluneRefreshStatus, 500);
    });
}

function laluneDisconnect() {
    lalunePost('disconnect', {}, function() {
        setTimeout(laluneRefreshStatus, 500);
    });
}

document.addEventListener('DOMContentLoaded', function() {
    laluneRefreshConfigs();
    laluneRefreshStatus();
    setInterval(laluneRefreshStatus, 3000);
});
//]]>
</script>

<%+footer%>
