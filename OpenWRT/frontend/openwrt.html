<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>LaLune OpenWRT</title>
    <link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; font-family: 'Overpass Mono', monospace; }
        html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; inset: 0; }
        body { background: radial-gradient(ellipse at 20% 30%, #1a2a6c, #0a0e2a 60%, #04060f); display: flex; flex-direction: column; color: #ffffff; }
        .stars { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; }
        .app { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; max-width: 820px; margin: 0 auto; width: 100%; height: 100%; padding: 0 16px; min-height: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px 0 0; flex-shrink: 0; }
        .header-title { font-size: 18px; font-weight: 600; color: #f7e84e; }
        .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 0; overflow: hidden; min-height: 0; }
        .moon-container { position: relative; margin-bottom: 20px; flex-shrink: 0; }
        .moon-btn { background: none; border: none; cursor: pointer; padding: 0; display: block; }
        .moon-btn svg { display: block; width: 110px; height: 110px; }
        .status-text { font-size: 16px; color: rgba(255,255,255,0.6); margin-bottom: 16px; flex-shrink: 0; }
        .config-info { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 14px 18px; width: 100%; max-width: 400px; margin-bottom: 16px; flex-shrink: 0; }
        .config-info .label { font-size: 11px; color: rgba(255,255,255,0.35); text-transform: uppercase; }
        .config-info .value { font-size: 14px; color: rgba(255,255,255,0.85); margin-top: 2px; word-break: break-all; }
        .bottom-nav { display: flex; justify-content: space-around; align-items: center; padding: 8px 4px; flex-shrink: 0; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.15); min-height: 52px; max-height: 64px; }
        .nav-btn { background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 600; flex: 1; max-width: 80px; min-width: 56px; white-space: nowrap; overflow: hidden; }
        .nav-btn svg { width: 20px; height: 20px; }
        .nav-btn.active { color: #f7e84e; }
        .logs-container { flex: 1; width: 100%; max-width: 600px; background: rgba(0,0,0,0.35); border-radius: 12px; padding: 10px 14px; font-size: 12px; color: rgba(255,255,255,0.8); overflow-y: auto; min-height: 0; }
        .logs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-shrink: 0; }
        .logs-header h3 { font-size: 16px; }
        .btn-clear { background: none; border: none; color: rgba(255,255,255,0.5); cursor: pointer; font-size: 12px; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); padding: 10px 20px; background: rgba(0,0,0,0.8); border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; z-index: 50; transition: opacity 0.3s; }
        .toast.show { opacity: 1; }
        @media (max-width: 400px) {
            .nav-btn { font-size: 9px; padding: 3px 5px; min-width: 48px; }
            .nav-btn svg { width: 16px; height: 16px; }
            .moon-btn svg { width: 90px; height: 90px; }
            .bottom-nav { min-height: 46px; padding: 6px 2px; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="app" id="app">
        <div class="header">
            <span class="header-title">🌙 LaLune</span>
            <span style="font-size:12px;color:rgba(255,255,255,0.4);">OpenWRT</span>
        </div>
        <div class="content" id="content"></div>
        <div class="bottom-nav">
            <button class="nav-btn active" data-tab="connection" onclick="switchTab('connection')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <span>Подключение</span>
            </button>
            <button class="nav-btn" data-tab="logs" onclick="switchTab('logs')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="9" y1="9" x2="15" y2="9"/>
                    <line x1="9" y1="15" x2="15" y2="15"/>
                    <line x1="9" y1="12" x2="15" y2="12"/>
                </svg>
                <span>Логи</span>
            </button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    {API_SCRIPT}
</body>
</html>
