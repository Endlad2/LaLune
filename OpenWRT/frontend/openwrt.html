<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>LaLune</title>
    <link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; font-family: 'Overpass Mono', monospace; }
        html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; inset: 0; }
        body { background: radial-gradient(ellipse at 20% 30%, #1a2a6c, #0a0e2a 60%, #04060f); display: flex; flex-direction: column; color: #ffffff; }
        .stars { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; }
        .app { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; max-width: 820px; margin: 0 auto; width: 100%; height: 100%; padding: 0 16px; min-height: 0; }
        .header { display: flex; justify-content: flex-end; padding: 12px 4px 0 0; flex-shrink: 0; }
        .btn-plus { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: white; cursor: pointer; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 0; overflow: hidden; min-height: 0; }
        .moon-container { position: relative; margin-bottom: 20px; flex-shrink: 0; }
        .moon-btn { background: none; border: none; cursor: pointer; padding: 0; display: block; }
        .moon-btn svg { display: block; width: 110px; height: 110px; }
        .status-text { font-size: 16px; color: rgba(255,255,255,0.6); margin-bottom: 16px; flex-shrink: 0; }
        .config-selector { width: 100%; max-width: 400px; position: relative; flex-shrink: 0; }
        .config-selector-header { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .config-selector-header span { font-size: 15px; color: rgba(255,255,255,0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .config-dropdown { position: absolute; bottom: calc(100% + 6px); left: 0; right: 0; background: rgba(18, 22, 45, 0.98); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; max-height: 0; overflow: hidden; transition: max-height 0.3s; opacity: 0; pointer-events: none; }
        .config-dropdown.open { max-height: 280px; overflow-y: auto; opacity: 1; pointer-events: auto; }
        .config-item { display: flex; align-items: center; padding: 11px 14px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; min-height: 44px; }
        .config-item .protocol-badge { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #4a6cf7; background: rgba(74,108,247,0.15); padding: 2px 8px; border-radius: 20px; margin-right: 10px; flex-shrink: 0; }
        .config-item .config-name { flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bottom-nav { display: flex; justify-content: space-around; align-items: center; padding: 8px 4px; flex-shrink: 0; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.15); min-height: 52px; max-height: 64px; }
        .nav-btn { background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 600; flex: 1; max-width: 80px; min-width: 56px; white-space: nowrap; overflow: hidden; }
        .nav-btn svg { width: 20px; height: 20px; }
        .nav-btn.active { color: #f7e84e; }
        .logs-container { flex: 1; width: 100%; max-width: 600px; background: rgba(0,0,0,0.35); border-radius: 12px; padding: 10px 14px; font-size: 12px; color: rgba(255,255,255,0.8); overflow-y: auto; min-height: 0; }
        .logs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-shrink: 0; }
        .logs-header h3 { font-size: 16px; }
        .btn-clear { background: none; border: none; color: rgba(255,255,255,0.5); cursor: pointer; font-size: 12px; }
        .settings-scroll { width: 100%; max-width: 500px; overflow-y: auto; flex: 1; min-height: 0; }
        .settings-group { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
        .settings-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .settings-row label { font-size: 13px; color: rgba(255,255,255,0.7); min-width: 90px; flex-shrink: 0; }
        .settings-row input, .settings-row select { flex: 1; padding: 6px 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; font-size: 14px; min-width: 0; }
        .info-title { font-size: 24px; font-weight: 700; color: #f7e84e; margin-bottom: 6px; }
        .info-sub { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 14px; }
        .info-block { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 12px 18px; margin-bottom: 10px; width: 100%; max-width: 380px; }
        .info-block .label { font-size: 11px; color: rgba(255,255,255,0.35); text-transform: uppercase; }
        .info-block .value { font-size: 14px; color: rgba(255,255,255,0.85); margin-top: 2px; word-break: break-all; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-overlay.open { display: flex; }
        .modal { background: #0f1540; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 20px; max-width: 480px; width: 92%; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .modal-close { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; margin-bottom: 4px; }
        .form-group textarea { width: 100%; padding: 8px 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; font-size: 13px; resize: vertical; min-height: 60px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
        .btn-secondary { padding: 8px 18px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: rgba(255,255,255,0.6); font-size: 13px; cursor: pointer; }
        .btn-primary { padding: 8px 22px; background: #4a6cf7; border: none; border-radius: 8px; color: white; font-size: 13px; cursor: pointer; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); padding: 10px 20px; background: rgba(0,0,0,0.8); border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; z-index: 50; transition: opacity 0.3s; }
        .toast.show { opacity: 1; }
        @media (max-width: 400px) {
            .nav-btn { font-size: 9px; padding: 3px 5px; min-width: 48px; }
            .nav-btn svg { width: 16px; height: 16px; }
            .moon-btn svg { width: 90px; height: 90px; }
            .bottom-nav { min-height: 46px; padding: 6px 2px; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="app" id="app">
        <div class="header">
            <button class="btn-plus" onclick="showAddModal()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </button>
        </div>
        <div class="content" id="content"></div>
        <div class="bottom-nav">
            <button class="nav-btn active" data-tab="connection" onclick="switchTab('connection')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <span>Подключение</span>
            </button>
            <button class="nav-btn" data-tab="settings" onclick="switchTab('settings')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                <span>Настройки</span>
            </button>
            <button class="nav-btn" data-tab="info" onclick="switchTab('info')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="16" x2="12" y2="12"/>
                    <line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
                <span>Информация</span>
            </button>
            <button class="nav-btn" data-tab="logs" onclick="switchTab('logs')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="9" y1="9" x2="15" y2="9"/>
                    <line x1="9" y1="15" x2="15" y2="15"/>
                    <line x1="9" y1="12" x2="15" y2="12"/>
                </svg>
                <span>Логи</span>
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Добавить конфиг</h2>
                <button class="modal-close" onclick="closeAddModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>Ссылка подключения</label>
                <textarea id="configInput" rows="3" placeholder="csqtt://connect?v=2&host=..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeAddModal()">Отмена</button>
                <button class="btn-primary" onclick="saveConfig()">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
</body>
</html>
