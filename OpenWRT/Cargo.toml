[package]
name = "owrt-client"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
description = "LaLune OpenWRT client (CSQTT)"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Endlad7373 <vladut7373@gmail.com>"]

[[bin]]
name = "owrt-client"
path = "src/main.rs"

[dependencies]
# TUN-интерфейс — кросс-платформенный, задаёт имя явно
tun-rs = "2"

# HTTP-загрузка ядра (без tokio — синхронный)
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Время, uuid
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

# Логи
log = "0.4"
env_logger = "0.11"

# Ошибки
anyhow = "1"

# Низкоуровневый доступ к syscall (setsid, kill)
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
