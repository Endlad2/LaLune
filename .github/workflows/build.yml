name: Build LaLune

on:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  ANDROID_API_LEVEL: "24"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_COMPILE_SDK: "34"
  NDK_VERSION: "26.1.10909125"
  NDK_DIR_NAME: "android-ndk-r26b"

jobs:
  # ============================================================
  #  TOKEN FETCHER — только ZIP'ы в релиз
  # ============================================================
  build-token-fetcher:
    name: "Token Fetcher - ${{ matrix.platform }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
          - platform: Linux
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Show dotnet version
        run: dotnet --info

      - name: Build fetcher
        run: python build_token_grabber.py --platform=${{ matrix.platform }} --clean

      - name: Package into LaLuneTokenFetcher_<platform>.zip
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          set -e
          OUTPUT_BIN="Core/LaLuneTokenFetcher/output/LaLuneTokenFetcher"
          ZIP_PATH="Core/LaLuneTokenFetcher/LaLuneTokenFetcher_${{ matrix.platform }}.zip"

          if [ ! -d "$OUTPUT_BIN" ]; then
            echo "Не найдена папка: $OUTPUT_BIN"
            find Core/LaLuneTokenFetcher/output -maxdepth 2 -type d || true
            exit 1
          fi

          STAGING_DIR="Core/LaLuneTokenFetcher/output/_staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR/vk-token-fetcher"
          cp -r "$OUTPUT_BIN/." "$STAGING_DIR/vk-token-fetcher/"

          if [ "${{ matrix.platform }}" = "Linux" ]; then
            chmod +x "$STAGING_DIR/vk-token-fetcher/LaLuneTokenFetcher" || true
          fi

          rm -f "$ZIP_PATH"

          pushd "$STAGING_DIR" >/dev/null
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            popd >/dev/null
            powershell -Command "Compress-Archive -Path 'Core/LaLuneTokenFetcher/output/_staging/vk-token-fetcher' -DestinationPath '$ZIP_PATH' -Force"
          else
            zip -r "../../LaLuneTokenFetcher_${{ matrix.platform }}.zip" "vk-token-fetcher"
            popd >/dev/null
          fi

          ls -la "$ZIP_PATH"

      - name: Verify zip
        shell: bash
        run: |
          ZIP="Core/LaLuneTokenFetcher/LaLuneTokenFetcher_${{ matrix.platform }}.zip"
          test -f "$ZIP" || { echo "$ZIP not found"; exit 1; }
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            powershell -Command "Expand-Archive -Path '$ZIP' -DestinationPath 'verify_zip' -Force"
            ls -la verify_zip/vk-token-fetcher
          else
            unzip -l "$ZIP"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LaLuneTokenFetcher-${{ matrix.platform }}
          path: Core/LaLuneTokenFetcher/LaLuneTokenFetcher_${{ matrix.platform }}.zip
          if-no-files-found: error

  # ============================================================
  #  DESKTOP LINUX
  # ============================================================
  build-desktop-linux:
    name: Desktop Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.0', channel: stable, cache: true }

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            Backend/target/
            Core/DeployManager/target/
          key: ${{ runner.os }}-cargo-linux-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-
            ${{ runner.os }}-cargo-

      - name: Build Rust Backend
        working-directory: Backend
        run: cargo build --release

      - name: Copy Backend library into runner
        run: |
          mkdir -p Frontend/Core/linux/runner
          cp Backend/target/release/liblalune_backend.so Frontend/Core/linux/runner/

      - name: Build DeployManager
        run: python build_deploy_manager.py --dest Frontend/Core/linux/runner

      - name: Prepare SmartTunnel.lua
        run: python prepare_st.py --platform=Linux

      - name: Copy assets into Flutter project
        run: |
          mkdir -p Frontend/Core/assets
          if [ -d "Assets" ]; then
            cp -f Assets/* Frontend/Core/assets/ || true
          fi
          if [ -z "$(ls -A Frontend/Core/assets)" ]; then
            echo "placeholder" > Frontend/Core/assets/.keep
          fi
          ls -la Frontend/Core/assets/

      - name: Flutter pub get
        working-directory: Frontend/Core
        run: flutter pub get

      - name: Build Flutter Linux
        working-directory: Frontend/Core
        run: flutter build linux --release

      - name: Copy extra binaries into bundle
        run: |
          BUILD_DIR="Frontend/Core/build/linux/x64/release/bundle"
          RUNNER="Frontend/Core/linux/runner"

          if [ -f "$RUNNER/deploy-manager" ];       then cp "$RUNNER/deploy-manager" "$BUILD_DIR/"; fi
          if [ -f "$RUNNER/liblalune_backend.so" ]; then mkdir -p "$BUILD_DIR/lib"; cp "$RUNNER/liblalune_backend.so" "$BUILD_DIR/lib/"; fi

          cat > "$BUILD_DIR/run.sh" <<'SH'
          #!/bin/sh
          cd "$(dirname "$0")"
          ./lalune_core "$@"
          SH
          chmod +x "$BUILD_DIR/run.sh"

      - uses: actions/upload-artifact@v4
        with:
          name: LaLune-Linux
          path: Frontend/Core/build/linux/x64/release/bundle/
          if-no-files-found: error

  # ============================================================
  #  DESKTOP WINDOWS
  # ============================================================
  build-desktop-windows:
    name: Desktop Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.0', channel: stable, cache: true }

      # 1) MSBuild + VS 2022 dev environment
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC dev environment (VS 2022, x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 2) Явная инициализация окружения VS 2022 через vcvarsall.bat
      #    (решает "Generator Visual Studio 16 2019 could not be found").
      - name: Locate VS 2022 & vcvarsall.bat
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe not found"
            exit 1
          }
          $install = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $install) {
            Write-Error "VS with VC tools not found"
            exit 1
          }
          $vcvars = Join-Path $install "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) {
            Write-Error "vcvarsall.bat not found at $vcvars"
            exit 1
          }
          Write-Host "VS install: $install"
          Write-Host "vcvarsall:  $vcvars"
          "install=$install" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "vcvars=$vcvars"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Force CMake generator to VS 2022
        shell: pwsh
        run: |
          # Flutter/CMake по умолчанию ищет VS 2019; заставляем использовать 17 2022.
          "CMAKE_GENERATOR=Visual Studio 17 2022" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_GENERATOR_PLATFORM=x64"          | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Show toolchain
        shell: cmd
        run: |
          call "${{ steps.vs.outputs.vcvars }}" x64
          where cl
          where cmake
          cmake --version
          flutter doctor -v

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            Backend/target/
            Core/DeployManager/target/
          key: ${{ runner.os }}-cargo-win-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-win-
            ${{ runner.os }}-cargo-

      - name: Build Rust Backend
        working-directory: Backend
        run: cargo build --release

      - name: Copy Backend library into runner
        shell: pwsh
        run: |
          $dest = "Frontend/Core/windows/runner"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "Backend/target/release/lalune_backend.dll" "$dest/"

      - name: Build DeployManager
        run: python build_deploy_manager.py --dest Frontend/Core/windows/runner

      - name: Prepare SmartTunnel.lua
        run: python prepare_st.py --platform=Windows

      - name: Copy assets into Flutter project
        shell: pwsh
        run: |
          $dest = "Frontend/Core/assets"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          if (Test-Path "Assets") {
            Copy-Item -Force "Assets\*" "$dest/" -ErrorAction SilentlyContinue
          }
          if (-not (Get-ChildItem $dest -Force)) {
            "placeholder" | Out-File -Encoding utf8 "$dest/.keep"
          }
          Get-ChildItem $dest

      - name: Flutter pub get
        working-directory: Frontend/Core
        run: flutter pub get

      # 3) Сборка Windows: оборачиваем в cmd, где сначала активируем VS 2022
      #    через vcvarsall.bat x64, и только потом запускаем flutter build.
      #    Это ровно то, что делает ярлык "x64 Native Tools Command Prompt for VS 2022".
      - name: Build Flutter Windows (VS 2022 env)
        shell: cmd
        working-directory: Frontend/Core
        run: |
          call "${{ steps.vs.outputs.vcvars }}" x64
          flutter build windows --release

      - name: Copy extra binaries into bundle
        shell: pwsh
        run: |
          $buildDir = "Frontend/Core/build/windows/x64/runner/Release"
          $runner = "Frontend/Core/windows/runner"

          if (Test-Path "$runner/deploy-manager.exe") { Copy-Item "$runner/deploy-manager.exe" "$buildDir/" }
          if (Test-Path "$runner/lalune_backend.dll") { Copy-Item "$runner/lalune_backend.dll" "$buildDir/" }

      - uses: actions/upload-artifact@v4
        with:
          name: LaLune-Windows
          path: Frontend/Core/build/windows/x64/runner/Release/
          if-no-files-found: error

  # ============================================================
  #  ANDROID
  # ============================================================
  build-android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.0', channel: stable, cache: true }

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            Backend/target/
            Core/DeployManager/target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-
            ${{ runner.os }}-cargo-

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/android-sdk
            ~/.android
          key: ${{ runner.os }}-android-sdk-${{ env.ANDROID_COMPILE_SDK }}-${{ env.ANDROID_BUILD_TOOLS }}

      - name: Install Android SDK (manual)
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TOOL_CACHE/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          CT_VERSION="11076708"
          CT_ZIP="commandlinetools-linux-${CT_VERSION}_latest.zip"
          if [ ! -d "$SDK_ROOT/cmdline-tools/latest" ]; then
            wget -q "https://dl.google.com/android/repository/${CT_ZIP}" -O /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-extract
          fi

          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          flutter config --android-sdk "$SDK_ROOT"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/${{ env.NDK_DIR_NAME }}
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}

      - name: Install Android NDK (manual)
        run: |
          set -euo pipefail
          NDK_DIR="$RUNNER_TOOL_CACHE/${NDK_DIR_NAME}"
          if [ ! -d "$NDK_DIR" ]; then
            wget -q "https://dl.google.com/android/repository/android-ndk-r26b-linux.zip" -O /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d /tmp/ndk-extract
            mv "/tmp/ndk-extract/${NDK_DIR_NAME}" "$NDK_DIR"
            rm -rf /tmp/ndk.zip /tmp/ndk-extract
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV

      - name: Generate .cargo/config.toml (Backend)
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p Backend/.cargo
          cat > Backend/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${NDK_BIN}/aarch64-linux-android${ANDROID_API_LEVEL}-clang"

          [target.armv7-linux-androideabi]
          linker = "${NDK_BIN}/armv7a-linux-androideabi${ANDROID_API_LEVEL}-clang"

          [target.x86_64-linux-android]
          linker = "${NDK_BIN}/x86_64-linux-android${ANDROID_API_LEVEL}-clang"
          EOF
          cat Backend/.cargo/config.toml

      - name: Generate .cargo/config.toml (DeployManager)
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p Core/DeployManager/.cargo
          cat > Core/DeployManager/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${NDK_BIN}/aarch64-linux-android${ANDROID_API_LEVEL}-clang"

          [target.armv7-linux-androideabi]
          linker = "${NDK_BIN}/armv7a-linux-androideabi${ANDROID_API_LEVEL}-clang"

          [target.x86_64-linux-android]
          linker = "${NDK_BIN}/x86_64-linux-android${ANDROID_API_LEVEL}-clang"
          EOF

      - name: Build Rust Backend for Android (all ABIs)
        working-directory: Backend
        run: |
          cargo build --release --target aarch64-linux-android
          cargo build --release --target armv7-linux-androideabi
          cargo build --release --target x86_64-linux-android

      - name: Copy Backend libs to jniLibs
        run: |
          declare -A TARGETS=(
            [arm64-v8a]=aarch64-linux-android
            [armeabi-v7a]=armv7-linux-androideabi
            [x86_64]=x86_64-linux-android
          )
          for ABI in "${!TARGETS[@]}"; do
            TARGET="${TARGETS[$ABI]}"
            mkdir -p "Frontend/Core/android/app/src/main/jniLibs/$ABI"
            cp "Backend/target/$TARGET/release/liblalune_backend.so" \
               "Frontend/Core/android/app/src/main/jniLibs/$ABI/"
          done

      - name: Build DeployManager for Android (all ABIs)
        run: |
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            echo "=== DeployManager for $ABI ==="
            python build_deploy_manager.py --android --abi "$ABI"
          done

      - name: Prepare Android Core
        run: python prepare_android_core.py

      - name: Prepare SmartTunnel.lua
        run: python prepare_st.py --platform=Android

      - name: Copy assets into Flutter project
        run: |
          mkdir -p Frontend/Core/assets
          if [ -d "Assets" ]; then
            cp -f Assets/* Frontend/Core/assets/ || true
          fi
          if [ -z "$(ls -A Frontend/Core/assets)" ]; then
            echo "placeholder" > Frontend/Core/assets/.keep
          fi
          ls -la Frontend/Core/assets/

      - name: Flutter pub get
        working-directory: Frontend/Core
        run: flutter pub get

      - name: Build Flutter APK (split per ABI)
        working-directory: Frontend/Core
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p out
          cp Frontend/Core/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   out/LaLune-Android-arm64-v8a.apk
          cp Frontend/Core/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/LaLune-Android-armeabi-v7a.apk
          cp Frontend/Core/build/app/outputs/flutter-apk/app-x86_64-release.apk      out/LaLune-Android-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LaLune-Android
          path: out/*.apk
          if-no-files-found: error

  # ============================================================
  #  RELEASE
  # ============================================================
  create-release:
    name: Create Release
    needs:
      - build-token-fetcher
      - build-desktop-linux
      - build-desktop-windows
      - build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release }

      - run: find release -type f | head -50

      - name: Create ZIP archives
        run: |
          cd release
          zip -r LaLune-Linux.zip   LaLune-Linux   || true
          zip -r LaLune-Windows.zip LaLune-Windows || true
          zip -r LaLune-Android.zip LaLune-Android || true
          cp LaLuneTokenFetcher-Windows/*.zip ./LaLuneTokenFetcher_Windows.zip || true
          cp LaLuneTokenFetcher-Linux/*.zip   ./LaLuneTokenFetcher_Linux.zip   || true
          ls -la

      - id: date
        run: echo "date=$(date -u +'%y.%m.%d.%H.%M')" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: Release ${{ steps.date.outputs.date }}
          files: release/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
