name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  APP_NAME: la-lune-launcher
  WORKSPACE_DIR: Launcher
  OPENWRT_DIR: OpenWRT

jobs:
  build-launcher:
    name: Build Launcher for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      actions: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: la-lune-launcher
            asset_name: la-lune-launcher-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: la-lune-launcher.exe
            asset_name: la-lune-launcher-windows-x86_64.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: ${{ matrix.target }}
        override: true
        profile: minimal

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ env.WORKSPACE_DIR }}/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build release binary
      working-directory: ${{ env.WORKSPACE_DIR }}
      run: cargo build --release --target ${{ matrix.target }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ env.WORKSPACE_DIR }}/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        if-no-files-found: error

  build-openwrt:
    name: Build OpenWRT for ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            asset_name: lalune-openwrt-aarch64
            cross_cc: aarch64-linux-gnu-gcc
            apt_packages: gcc-aarch64-linux-gnu musl-tools
          - target: armv7-unknown-linux-musleabihf
            asset_name: lalune-openwrt-armv7
            cross_cc: arm-linux-gnueabihf-gcc
            apt_packages: gcc-arm-linux-gnueabihf musl-tools

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install cross-compilation tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.apt_packages }}

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        target: ${{ matrix.target }}
        override: true
        profile: minimal

    - name: Cache cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ${{ env.OPENWRT_DIR }}/target
        key: ${{ runner.os }}-openwrt-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-${{ matrix.target }}-

    - name: Build release binary
      working-directory: ${{ env.OPENWRT_DIR }}
      env:
        CC_aarch64_unknown_linux_musl: ${{ matrix.cross_cc }}
        CC_armv7_unknown_linux_musleabihf: ${{ matrix.cross_cc }}
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: rust-lld
      run: cargo build --release --target ${{ matrix.target }}

    - name: Rename binary
      working-directory: ${{ env.OPENWRT_DIR }}
      run: |
        BINARY="target/${{ matrix.target }}/release/lalune-openwrt"
        if [ -f "$BINARY" ]; then
          cp "$BINARY" "${{ matrix.asset_name }}"
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ env.OPENWRT_DIR }}/${{ matrix.asset_name }}
        if-no-files-found: error

  create-release:
    name: Create Release
    needs: [build-launcher, build-openwrt]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate version from date
      id: version
      run: |
        VERSION=$(date +'%y.%m.%d.%H.%M')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: List artifacts
      run: |
        find artifacts -type f -exec ls -la {} \;

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: "LaLune v${{ steps.version.outputs.version }}"
        tag_name: "v${{ steps.version.outputs.version }}"
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          artifacts/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
