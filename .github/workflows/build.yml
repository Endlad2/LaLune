name: Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  ANDROID_API_LEVEL: "24"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_COMPILE_SDK: "34"

jobs:
  # ==========================================================
  #  Determine version tag (YY.MM.DD.HH.MM)
  # ==========================================================
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute version tag
        id: tag
        run: |
          TAG=$(date -u +'%y.%m.%d.%H.%M')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Computed tag: $TAG"

  # ==========================================================
  #  WINDOWS
  # ==========================================================
  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            Backend/target/
            Core/DeployManager/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ---------- Rust Backend (TUN) ----------
      - name: Build Rust Backend
        working-directory: Backend
        run: cargo build --release

      - name: Copy Backend library
        shell: pwsh
        run: |
          $dest = "Frontend/Core/windows/runner"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "Backend/target/release/lalune_backend.dll" "$dest/"

      # ---------- DeployManager ----------
      - name: Build DeployManager
        run: python build_deploy_manager.py --dest Frontend/Core/windows/runner

      # ---------- Token Fetcher ----------
      - name: Build Token Fetcher
        run: python build_token_grabber.py --platform=Windows --clean

      - name: Copy Token Fetcher
        shell: pwsh
        run: |
          $dest = "Frontend/Core/windows/runner/LaLuneTokenFetcher"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force "Core/LaLuneTokenFetcher/output/LaLuneTokenFetcher/*" "$dest/"

      # ---------- SmartTunnel ----------
      - name: Prepare SmartTunnel
        run: python prepare_st.py --platform=Windows

      # ---------- Flutter ----------
      - name: Flutter pub get
        working-directory: Frontend/Core
        run: flutter pub get

      - name: Build Flutter Windows
        working-directory: Frontend/Core
        run: flutter build windows --release

      # ---------- Package ----------
      - name: Copy extra binaries into bundle
        shell: pwsh
        run: |
          $buildDir = "Frontend/Core/build/windows/x64/runner/Release"
          $runner = "Frontend/Core/windows/runner"

          if (Test-Path "$runner/deploy-manager.exe") {
            Copy-Item "$runner/deploy-manager.exe" "$buildDir/"
          }
          if (Test-Path "$runner/lalune_backend.dll") {
            Copy-Item "$runner/lalune_backend.dll" "$buildDir/"
          }
          if (Test-Path "$runner/LaLuneTokenFetcher") {
            Copy-Item -Recurse "$runner/LaLuneTokenFetcher" "$buildDir/"
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          $buildDir = "Frontend/Core/build/windows/x64/runner/Release"
          Compress-Archive -Path "$buildDir/*" -DestinationPath "LaLune-Windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Windows-x64
          path: LaLune-Windows-x64.zip
          retention-days: 30

  # ==========================================================
  #  LINUX
  # ==========================================================
  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            Backend/target/
            Core/DeployManager/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ---------- Rust Backend (TUN) ----------
      - name: Build Rust Backend
        working-directory: Backend
        run: cargo build --release

      - name: Copy Backend library
        run: |
          mkdir -p Frontend/Core/linux/runner
          cp Backend/target/release/liblalune_backend.so Frontend/Core/linux/runner/

      # ---------- DeployManager ----------
      - name: Build DeployManager
        run: python build_deploy_manager.py --dest Frontend/Core/linux/runner

      # ---------- Token Fetcher ----------
      - name: Build Token Fetcher
        run: python build_token_grabber.py --platform=Linux --clean

      - name: Copy Token Fetcher
        run: |
          mkdir -p Frontend/Core/linux/runner/LaLuneTokenFetcher
          cp -r Core/LaLuneTokenFetcher/output/LaLuneTokenFetcher/* Frontend/Core/linux/runner/LaLuneTokenFetcher/

      # ---------- SmartTunnel ----------
      - name: Prepare SmartTunnel
        run: python prepare_st.py --platform=Linux

      # ---------- Flutter ----------
      - name: Flutter pub get
        working-directory: Frontend/Core
        run: flutter pub get

      - name: Build Flutter Linux
        working-directory: Frontend/Core
        run: flutter build linux --release

      # ---------- Package ----------
      - name: Copy extra binaries into bundle
        run: |
          BUILD_DIR="Frontend/Core/build/linux/x64/release/bundle"
          RUNNER="Frontend/Core/linux/runner"

          if [ -f "$RUNNER/deploy-manager" ]; then
            cp "$RUNNER/deploy-manager" "$BUILD_DIR/"
          fi
          if [ -d "$RUNNER/LaLuneTokenFetcher" ]; then
            cp -r "$RUNNER/LaLuneTokenFetcher" "$BUILD_DIR/"
          fi
          if [ -f "$RUNNER/liblalune_backend.so" ]; then
            mkdir -p "$BUILD_DIR/lib"
            cp "$RUNNER/liblalune_backend.so" "$BUILD_DIR/lib/"
          fi

      - name: Create tarball
        run: |
          BUILD_DIR="Frontend/Core/build/linux/x64/release/bundle"
          tar -czvf LaLune-Linux-x64.tar.gz -C "$BUILD_DIR" .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Linux-x64
          path: LaLune-Linux-x64.tar.gz
          retention-days: 30

  # ==========================================================
  #  ANDROID (manual SDK/NDK install)
  # ==========================================================
  android:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            Backend/target/
            Core/DeployManager/target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-
            ${{ runner.os }}-cargo-

      # ---------- Manual Android SDK install ----------
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/android-sdk
            ~/.android
          key: ${{ runner.os }}-android-sdk-${{ env.ANDROID_COMPILE_SDK }}-${{ env.ANDROID_BUILD_TOOLS }}

      - name: Install Android SDK (manual)
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TOOL_CACHE/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"

          CT_VERSION="11076708"
          CT_ZIP="commandlinetools-linux-${CT_VERSION}_latest.zip"
          if [ ! -d "$SDK_ROOT/cmdline-tools/latest" ]; then
            wget -q "https://dl.google.com/android/repository/${CT_ZIP}" -O /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-extract
          fi

          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

          flutter config --android-sdk "$SDK_ROOT"

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

      # ---------- Manual Android NDK install ----------
      - name: Install Android NDK (manual)
        run: |
          set -euo pipefail

          NDK_DIR="$RUNNER_TOOL_CACHE/android-ndk-r26b"

          if [ ! -d "$NDK_DIR" ]; then
            wget -q "https://dl.google.com/android/repository/android-ndk-r26b-linux.zip" -O /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d /tmp/ndk-extract
            mv /tmp/ndk-extract/android-ndk-r26b "$NDK_DIR"
            rm -rf /tmp/ndk.zip /tmp/ndk-extract
          fi

          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV

      - name: Verify SDK/NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls -la "$ANDROID_HOME"
          ls -la "$ANDROID_NDK_HOME" | head

      # ---------- Rust Backend (TUN) for all ABIs ----------
      - name: Build Rust Backend for Android (all ABIs)
        working-directory: Backend
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CC_armv7_linux_androideabi="$NDK_BIN/armv7a-linux-androideabi${ANDROID_API_LEVEL}-clang"
          export AR_armv7_linux_androideabi="$NDK_BIN/llvm-ar"
          export CC_x86_64_linux_android="$NDK_BIN/x86_64-linux-android${ANDROID_API_LEVEL}-clang"
          export AR_x86_64_linux_android="$NDK_BIN/llvm-ar"

          cargo build --release --target aarch64-linux-android
          cargo build --release --target armv7-linux-androideabi
          cargo build --release --target x86_64-linux-android

      - name: Copy Backend libs to jniLibs
        run: |
          declare -A TARGETS=(
            [arm64-v8a]=aarch64-linux-android
            [armeabi-v7a]=armv7-linux-androideabi
            [x86_64]=x86_64-linux-android
          )
          for ABI in "${!TARGETS[@]}"; do
            TARGET="${TARGETS[$ABI]}"
            mkdir -p "Frontend/Core/android/app/src/main/jniLibs/$ABI"
            cp "Backend/target/$TARGET/release/liblalune_backend.so" \
               "Frontend/Core/android/app/src/main/jniLibs/$ABI/"
          done

      # ---------- DeployManager for all ABIs ----------
      - name: Build DeployManager for Android (all ABIs)
        run: |
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            echo "=== Building DeployManager for $ABI ==="
            python build_deploy_manager.py --android --abi "$ABI"
          done

      # ---------- Prepare Android Core Java ----------
      - name: Prepare Android Core
        run: python prepare_android_core.py

      # ---------- SmartTunnel ----------
      - name: Prepare SmartTunnel
        run: python prepare_st.py --platform=Android

      # ---------- Flutter ----------
      - name: Flutter pub get
        working-directory: Frontend/Core
        run: flutter pub get

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v
        continue-on-error: true

      - name: Build Flutter APK (split per ABI)
        working-directory: Frontend/Core
        run: flutter build apk --release --split-per-abi

      # ---------- Package ----------
      - name: Collect APKs
        run: |
          mkdir -p out
          cp Frontend/Core/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/LaLune-Android-arm64-v8a.apk
          cp Frontend/Core/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/LaLune-Android-armeabi-v7a.apk
          cp Frontend/Core/build/app/outputs/flutter-apk/app-x86_64-release.apk out/LaLune-Android-x86_64.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Android
          path: out/*.apk
          retention-days: 30

  # ==========================================================
  #  RELEASE (only from build.yml, tag = YY.MM.DD.HH.MM)
  # ==========================================================
  release:
    needs: [version, windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List collected files
        run: find artifacts -type f

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: LaLune ${{ needs.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
