name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  OPENWRT_DIR: OpenWRT
  DESKTOP_DIR: Desktop

jobs:
  build-desktop-windows:
    name: Build Desktop (Windows x86_64)
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Setup Wails
      run: |
        go install github.com/wailsapp/wails/v2/cmd/wails@latest

    - name: Build Desktop
      working-directory: ${{ env.DESKTOP_DIR }}
      run: |
        go mod tidy
        wails build -clean

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LaLune-Desktop-Windows
        path: ${{ env.DESKTOP_DIR }}/build/bin/LaLune.exe
        if-no-files-found: error

  build-desktop-linux:
    name: Build Desktop (Linux x86_64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Setup Wails
      run: |
        go install github.com/wailsapp/wails/v2/cmd/wails@latest

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

    - name: Build Desktop
      working-directory: ${{ env.DESKTOP_DIR }}
      run: |
        go mod tidy
        wails build -clean

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LaLune-Desktop-Linux
        path: ${{ env.DESKTOP_DIR }}/build/bin/LaLune
        if-no-files-found: error

  build-openwrt:
    name: Build OpenWRT for ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            asset_name: lalune-openwrt-aarch64
            cross_cc: aarch64-linux-gnu-gcc
            apt_packages: gcc-aarch64-linux-gnu musl-tools
            goos: linux
            goarch: arm64
          - target: armv7-unknown-linux-musleabihf
            asset_name: lalune-openwrt-armv7
            cross_cc: arm-linux-gnueabihf-gcc
            apt_packages: gcc-arm-linux-gnueabihf musl-tools
            goos: linux
            goarch: arm
          - target: x86_64-unknown-linux-musl
            asset_name: lalune-openwrt-x86_64
            cross_cc: x86_64-linux-gnu-gcc
            apt_packages: gcc-x86-64-linux-gnu musl-tools
            goos: linux
            goarch: amd64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install cross-compilation tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.apt_packages }}

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build OpenWRT
      working-directory: ${{ env.OPENWRT_DIR }}
      env:
        CGO_ENABLED: 0
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        if [ "${{ matrix.goarch }}" = "arm" ]; then
          GOARM=7 go build -ldflags="-s -w" -o ${{ matrix.asset_name }} .
        else
          go build -ldflags="-s -w" -o ${{ matrix.asset_name }} .
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ env.OPENWRT_DIR }}/${{ matrix.asset_name }}
        if-no-files-found: error

  create-release:
    name: Create Release
    needs: [build-desktop-windows, build-desktop-linux, build-openwrt]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate version from date
      id: version
      run: |
        VERSION=$(date +'%y.%m.%d.%H.%M')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: List artifacts
      run: |
        find artifacts -type f -exec ls -la {} \;

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: "LaLune v${{ steps.version.outputs.version }}"
        tag_name: "v${{ steps.version.outputs.version }}"
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          artifacts/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}