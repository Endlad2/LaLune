name: Build LaLune

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'
  GO_VERSION: '1.22.12'
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  PYTHONIOENCODING: 'utf-8'
  PYTHONUTF8: '1'
  # VS 2022 BuildTools — ставим вручную через winget,
  # чтобы не зависеть от предустановленного VS 18 на раннере.
  VS_INSTALLER_PATH: 'C:\Program Files (x86)\Microsoft Visual Studio\Installer'
  CMAKE_GENERATOR: 'Visual Studio 17 2022'

jobs:
  # ============================================================
  #  Desktop Windows (Flutter + Go c-shared)
  # ============================================================
  build-windows:
    name: Desktop Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: Desktop/Libs/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ----------------------------------------------------------
      #  Устанавливаем VS 2022 BuildTools вручную через winget.
      #  ilammy/msvc-dev-cmd@v1 не используем: на текущих раннерах
      #  он цепляется за предустановленный VS 18 (2026 Insider),
      #  из-за чего Flutter не может найти генератор VS 2022.
      # ----------------------------------------------------------
      - name: Install Visual Studio 2022 BuildTools (winget)
        shell: pwsh
        run: |
          winget install Microsoft.VisualStudio.2022.BuildTools `
            --accept-package-agreements `
            --accept-source-agreements `
            --override "--quiet --wait --add Microsoft.VisualStudio.Workload.VCTools --includeRecommended"
          Write-Host "winget exit code: $LASTEXITCODE"

      # ----------------------------------------------------------
      #  Находим vcvarsall.bat через vswhere.
      # ----------------------------------------------------------
      - name: Locate vcvarsall.bat
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe not found at $vswhere"
            exit 1
          }

          $installPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          Write-Host "VS install path: $installPath"

          if (-not $installPath) {
            Write-Error "Visual Studio with C++ toolchain not found"
            exit 1
          }

          $vcvars = Join-Path $installPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) {
            Write-Error "vcvarsall.bat not found at $vcvars"
            exit 1
          }

          Write-Host "vcvarsall.bat: $vcvars"
          "VCVARSALL_PATH=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # ----------------------------------------------------------
      #  Запускаем vcvarsall.bat x64, вытаскиваем env в GITHUB_ENV
      #  и печатаем версию cl.exe (MSVC).
      # ----------------------------------------------------------
      - name: Run vcvarsall.bat and print MSVC version
        shell: pwsh
        run: |
          $vcvars = $env:VCVARSALL_PATH
          if (-not $vcvars -or -not (Test-Path $vcvars)) {
            Write-Error "VCVARSALL_PATH not set or file missing: $vcvars"
            exit 1
          }

          Write-Host "=== Calling vcvarsall.bat x64 ==="
          $envDump = cmd /c "call `"$vcvars`" x64 >nul 2>&1 && set"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "vcvarsall.bat failed with exit code $LASTEXITCODE"
            exit 1
          }

          # Пишем все переменные окружения в GITHUB_ENV, чтобы
          # следующие шаги видели INCLUDE, LIB, PATH и т.д.
          foreach ($line in $envDump) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $matches[1]
              $value = $matches[2]
              # PATH перезаписываем, остальные — добавляем.
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

          Write-Host ""
          Write-Host "=== MSVC version ==="
          $clVersion = cmd /c "call `"$vcvars`" x64 >nul 2>&1 && cl 2>&1 | findstr /C:`"Version`""
          $clVersion | ForEach-Object { Write-Host $_ }

          if (-not $clVersion) {
            Write-Error "cl.exe version not detected — MSVC toolchain broken"
            exit 1
          }

          Write-Host ""
          Write-Host "=== VCToolsVersion ==="
          Write-Host "VCToolsVersion=$env:VCToolsVersion"
          Write-Host "VSINSTALLDIR=$env:VSINSTALLDIR"

      # ----------------------------------------------------------
      #  Кладём scripts/ ПЕРЕД системным cmake в PATH.
      #  Flutter жёстко передаёт -G "Visual Studio 16 2019",
      #  враппер подменит на CMAKE_GENERATOR (VS 17 2022).
      # ----------------------------------------------------------
      - name: Prepend scripts/ to PATH (cmake wrapper)
        shell: pwsh
        run: |
          $scripts = (Resolve-Path "scripts").Path
          Write-Host "Adding to PATH: $scripts"
          "$scripts" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Verify toolchain (cl, cmake, generator)
        shell: pwsh
        run: |
          Write-Host "--- which cl ---"
          Get-Command cl | Format-List *
          Write-Host "--- which cmake ---"
          Get-Command cmake | Format-List *
          Write-Host "--- CMAKE_GENERATOR ---"
          Write-Host $env:CMAKE_GENERATOR
          Write-Host "--- PATH (first 8) ---"
          $env:PATH -split ';' | Select-Object -First 8

      - name: Prepare frontend (pub get + assets)
        run: python build_frontend.py --platform Windows

      - name: Clean stale Windows build cache
        shell: pwsh
        run: |
          if (Test-Path "Frontend\Core\build\windows") {
            Remove-Item -Recurse -Force "Frontend\Core\build\windows"
          }

      - name: Build desktop (Go + Flutter)
        run: python build_desktop.py --platform Windows

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Windows
          path: Frontend/Core/build/windows/x64/runner/Release/
          if-no-files-found: error

  # ============================================================
  #  Desktop Linux (Flutter + Go c-shared)
  # ============================================================
  build-linux:
    name: Desktop Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libstdc++-12-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: Desktop/Libs/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare frontend
        run: python3 build_frontend.py --platform Linux

      - name: Build desktop
        run: python3 build_desktop.py --platform Linux

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Linux
          path: Frontend/Core/build/linux/x64/release/bundle/
          if-no-files-found: error

  # ============================================================
  #  Android APK
  # ============================================================
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK manually
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="/usr/local/lib/android/sdk"
          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/Android/Sdk"
          fi

          SDKMGR=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMGR="$candidate"
              break
            fi
          done

          if [ -z "$SDKMGR" ]; then
            echo "::error::sdkmanager not found in $SDK_ROOT"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMGR"
          echo "SDK root: $SDK_ROOT"

          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true

          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;25.1.8937393" \
            >/dev/null 2>&1 || true

          if [ ! -d "$SDK_ROOT/platforms/android-${ANDROID_COMPILE_SDK}" ]; then
            echo "::error::platforms;android-${ANDROID_COMPILE_SDK} не установился"
            exit 1
          fi
          if [ ! -d "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}" ]; then
            echo "::error::build-tools;${ANDROID_BUILD_TOOLS} не установился"
            exit 1
          fi
          if [ ! -d "$SDK_ROOT/ndk/25.1.8937393" ]; then
            echo "::error::ndk;25.1.8937393 не установился"
            exit 1
          fi

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "$SDK_ROOT/platform-tools"
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          } >> "$GITHUB_PATH"

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          } >> "$GITHUB_ENV"

          echo "--- Installed SDK packages ---"
          ls -la "$SDK_ROOT"
          ls -la "$SDK_ROOT/platforms" || true
          ls -la "$SDK_ROOT/build-tools" || true
          ls -la "$SDK_ROOT/ndk" || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      - name: Clean stale Kotlin caches
        run: |
          rm -rf ~/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin || true

      - name: Prepare frontend (pub get + assets)
        run: python3 build_frontend.py --platform Android

      - name: Prepare Android Core (Java sources)
        run: python3 prepare_android_core.py

      - name: Verify no .kts duplicates
        run: |
          if [ -f Frontend/Core/android/settings.gradle.kts ]; then
            echo "::error::settings.gradle.kts exists — удалите его"
            exit 1
          fi
          if [ -f Frontend/Core/android/app/build.gradle.kts ]; then
            echo "::error::app/build.gradle.kts exists — удалите его"
            exit 1
          fi
          if [ -f Frontend/Core/android/build.gradle.kts ]; then
            echo "::error::build.gradle.kts exists — удалите его"
            exit 1
          fi

      - name: Verify Java sources are in place
        run: |
          JAVA_DIR="Frontend/Core/android/app/src/main/java/com/lalune/app"
          if [ ! -f "$JAVA_DIR/LaLuneTokenFetcherAndroid.java" ]; then
            echo "::error::LaLuneTokenFetcherAndroid.java не найден в $JAVA_DIR"
            ls -la "$JAVA_DIR" || true
            exit 1
          fi
          echo "Java sources OK:"
          ls -la "$JAVA_DIR"

      - name: Build APK
        working-directory: Frontend/Core
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Android
          path: Frontend/Core/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ============================================================
  #  Token Fetcher (Windows + Linux)
  # ============================================================
  build-token-fetcher:
    name: Token Fetcher
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-22.04
            platform: Linux
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: 'utf-8'
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Linux helper deps
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build token grabber
        run: python build_token_grabber.py --platform=${{ matrix.platform }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LaLuneTokenFetcher-${{ matrix.platform }}
          path: Core/LaLuneTokenFetcher/output/LaLuneTokenFetcher/
          if-no-files-found: error
