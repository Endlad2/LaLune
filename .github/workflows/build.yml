name: Build LaLune

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

# contents: write нужен для softprops/action-gh-release,
# иначе он ловит 403 "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build-desktop-linux:
    name: Desktop Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config \
            gcc \
            build-essential

      - name: Build Desktop Linux
        run: |
          python3 build_desktop.py --platform Linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Linux
          path: |
            Desktop/Linux/build/bin/*
          if-no-files-found: error

  build-desktop-windows:
    name: Desktop Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Desktop Windows
        run: |
          python build_desktop.py --platform Windows

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Windows
          path: |
            Desktop/Windows/build/bin/*
          if-no-files-found: error

  build-android:
    name: Android APK (universal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Системный Gradle (без wrapper). Форкеры ставят gradle сами —
      # это описано в Mobile/Android/README.md.
      - name: Install Gradle (system)
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          gradle --version

      # 1) Готовим фронтенд: app.html + android.js в assets/
      - name: Prepare Android frontend (app.html + android.js)
        run: |
          python prepare_android_html.py

      # 2) Скачиваем бинарники ядра во все три ABI-папки jniLibs/
      #    Это ДОЛЖНО быть до gradle assembleDebug — gradle пакует jniLibs
      #    в APK на этапе mergeNativeLibs, и после сборки туда уже не подложишь.
      - name: Download core binaries (universal: arm64-v8a + armeabi-v7a + x86_64)
        run: |
          mkdir -p Mobile/Android/app/src/main/jniLibs/arm64-v8a
          mkdir -p Mobile/Android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p Mobile/Android/app/src/main/jniLibs/x86_64

          echo "Downloading ARM64..."
          curl -L --fail --retry 3 --retry-delay 2 -o Mobile/Android/app/src/main/jniLibs/arm64-v8a/libclient-android-arm64-v8a.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-arm64-v8a.so

          echo "Downloading ARMv7..."
          curl -L --fail --retry 3 --retry-delay 2 -o Mobile/Android/app/src/main/jniLibs/armeabi-v7a/libclient-android-armeabi-v7a.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-armeabi-v7a.so

          echo "Downloading x86_64..."
          curl -L --fail --retry 3 --retry-delay 2 -o Mobile/Android/app/src/main/jniLibs/x86_64/libclient-android-x86_64.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-x86_64.so

          ls -la Mobile/Android/app/src/main/jniLibs/arm64-v8a/
          ls -la Mobile/Android/app/src/main/jniLibs/armeabi-v7a/
          ls -la Mobile/Android/app/src/main/jniLibs/x86_64/

      - name: Verify assets + jniLibs
        run: |
          echo "--- assets ---"
          ls -la Mobile/Android/app/src/main/assets/
          echo "--- jniLibs ---"
          find Mobile/Android/app/src/main/jniLibs -type f -exec ls -la {} \;

      # 3) Собираем universal APK через системный gradle
      - name: Build Android APK (universal)
        working-directory: Mobile/Android
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        id: find_apk
        run: |
          APK=$(find Mobile/Android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK не найден, дерево сборки:"
            find Mobile/Android/app/build -name "*.apk" -type f 2>/dev/null || true
            find Mobile/Android/app/build/outputs 2>/dev/null || true
            exit 1
          fi
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Android
          path: ${{ steps.find_apk.outputs.apk }}
          if-no-files-found: error

  build-openwrt-armv7:
    name: OpenWRT ARMv7
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build OpenWRT ARMv7
        run: |
          cd OpenWRT
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -ldflags="-s -w" -o csqtt-client-armv7 main.go
          ls -la csqtt-client-armv7

      - name: Upload ARMv7 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-OpenWRT-armv7
          path: OpenWRT/csqtt-client-armv7
          if-no-files-found: error

  build-openwrt-arm64:
    name: OpenWRT ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build OpenWRT ARM64
        run: |
          cd OpenWRT
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o csqtt-client-arm64 main.go
          ls -la csqtt-client-arm64

      - name: Upload ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-OpenWRT-arm64
          path: OpenWRT/csqtt-client-arm64
          if-no-files-found: error

  create-release:
    name: Create Release
    needs:
      - build-desktop-linux
      - build-desktop-windows
      - build-android
      - build-openwrt-armv7
      - build-openwrt-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/

      - name: Show downloaded structure
        run: find release -type f | head -50

      - name: Create ZIP archives
        run: |
          cd release
          zip -r LaLune-Linux.zip LaLune-Linux/ || true
          zip -r LaLune-Windows.zip LaLune-Windows/ || true
          zip -r LaLune-Android.zip LaLune-Android/ || true
          zip -r LaLune-OpenWRT-armv7.zip LaLune-OpenWRT-armv7/ || true
          zip -r LaLune-OpenWRT-arm64.zip LaLune-OpenWRT-arm64/ || true
          ls -la

      - name: Get current date
        id: date
        run: echo "date=$(date +'%y.%m.%d.%H.%M')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: Release ${{ steps.date.outputs.date }}
          files: |
            release/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
