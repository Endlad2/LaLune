name: Build All Platforms

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ============================================
  # ANDROID BUILD
  # ============================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Download core binaries
        run: |
          mkdir -p Mobile/Android/app/src/main/jniLibs/arm64-v8a
          mkdir -p Mobile/Android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p Mobile/Android/app/src/main/jniLibs/x86_64

          echo "Downloading ARM64..."
          curl -L --fail --retry 3 --retry-delay 2 -o Mobile/Android/app/src/main/jniLibs/arm64-v8a/libclient-android-arm64-v8a.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-arm64-v8a.so

          echo "Downloading ARMv7..."
          curl -L --fail --retry 3 --retry-delay 2 -o Mobile/Android/app/src/main/jniLibs/armeabi-v7a/libclient-android-armeabi-v7a.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-armeabi-v7a.so

          echo "Downloading x86_64..."
          curl -L --fail --retry 3 --retry-delay 2 -o Mobile/Android/app/src/main/jniLibs/x86_64/libclient-android-x86_64.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-x86_64.so

          ls -la Mobile/Android/app/src/main/jniLibs/arm64-v8a/
          ls -la Mobile/Android/app/src/main/jniLibs/armeabi-v7a/
          ls -la Mobile/Android/app/src/main/jniLibs/x86_64/

      - name: Build APK
        run: |
          cd Mobile/Android
          gradle assembleRelease --no-daemon

      - name: Find and Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd Mobile/Android
          
          echo "=== Searching for APK files ==="
          find . -type f -name "*.apk" -exec ls -la {} \;
          
          APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found anywhere in Mobile/Android"
            exit 1
          fi
          
          echo "Found APK: $APK_PATH"
          
          # Декодируем keystore
          echo "$KEYSTORE_BASE64" | base64 -d > ../../release-key.jks
          ls -la ../../release-key.jks
          
          # Подписываем
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks ../../release-key.jks \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out app/build/outputs/apk/release/LaLune-Android.apk \
            "$APK_PATH"
          
          rm -f ../../release-key.jks
          echo "Signed with release key"
          ls -la app/build/outputs/apk/release/LaLune-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Android
          path: Mobile/Android/app/build/outputs/apk/release/LaLune-Android.apk
          retention-days: 30

  # ============================================
  # DESKTOP WINDOWS
  # ============================================
  build-desktop-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
        shell: bash

      - name: Build Windows Desktop
        run: |
          if [ -f "LaLune/build_desktop.py" ]; then
            cd LaLune
          fi
          python build_desktop.py --platform Windows
        shell: bash

      - name: Upload Windows Desktop
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Windows
          path: |
            Desktop/Windows/build/bin/LaLune.exe
            LaLune/Desktop/Windows/build/bin/LaLune.exe
          retention-days: 30
          if-no-files-found: error

  # ============================================
  # DESKTOP LINUX
  # ============================================
  build-desktop-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Linux Desktop
        run: |
          if [ -f "LaLune/build_desktop.py" ]; then
            cd LaLune
          fi
          python build_desktop.py --platform Linux

      - name: Upload Linux Desktop
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Linux
          path: |
            Desktop/Linux/build/bin/LaLune
            LaLune/Desktop/Linux/build/bin/LaLune
          retention-days: 30
          if-no-files-found: error

  # ============================================
  # OPENWRT
  # ============================================
  build-openwrt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            goarch: arm64
            goarm: ""
          - arch: armv7
            goarch: arm
            goarm: "7"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build OpenWRT
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          if [ -d "LaLune/OpenWRT" ]; then
            cd LaLune/OpenWRT
          else
            cd OpenWRT
          fi
          go build -ldflags="-s -w" -o LaLune-OpenWRT-${{ matrix.arch }} main.go

      - name: Upload OpenWRT
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-OpenWRT-${{ matrix.arch }}
          path: |
            OpenWRT/LaLune-OpenWRT-${{ matrix.arch }}
            LaLune/OpenWRT/LaLune-OpenWRT-${{ matrix.arch }}
          retention-days: 30
          if-no-files-found: error

  # ============================================
  # RELEASE
  # ============================================
  release:
    needs: [build-android, build-desktop-windows, build-desktop-linux, build-openwrt]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: |
          find artifacts -type f -exec ls -la {} \;

      - name: Prepare release files
        run: |
          mkdir -p release
          
          find artifacts -name "LaLune-Android.apk" -exec cp {} release/ \; 2>/dev/null || true
          find artifacts -name "LaLune.exe" -exec cp {} release/LaLune-Windows.exe \; 2>/dev/null || true
          find artifacts -name "LaLune" -not -name "*.exe" -exec cp {} release/LaLune-Linux \; 2>/dev/null || true
          chmod +x release/LaLune-Linux 2>/dev/null || true
          find artifacts -name "LaLune-OpenWRT-arm64" -exec cp {} release/ \; 2>/dev/null || true
          find artifacts -name "LaLune-OpenWRT-armv7" -exec cp {} release/ \; 2>/dev/null || true
          
          echo "Release files:"
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: LaLune v${{ github.run_number }}
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
