# .github/workflows/build.yml
name: Build La Lune Server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: 386
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            wintun_arch: amd64
          - goos: windows
            goarch: arm64
            wintun_arch: arm64
          - goos: windows
            goarch: 386
            wintun_arch: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Download wintun.dll (Windows only)
        if: matrix.goos == 'windows'
        run: |
          curl -L -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          unzip -j wintun.zip "*/${{ matrix.wintun_arch }}/*.dll" -d api/cmd/server/
          ls -la api/cmd/server/wintun.dll

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '6' }}
        run: |
          cd api
          go mod tidy
          BINARY="la-lune-server"
          if [ "$GOOS" = "windows" ]; then
            BINARY="${BINARY}.exe"
          fi
          go build -ldflags="-s -w" -o "${BINARY}" ./cmd/server/
          PLATFORM_DIR="${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ -n "${{ matrix.goarm }}" ]; then
            PLATFORM_DIR="${PLATFORM_DIR}v${{ matrix.goarm }}"
          fi
          mkdir -p ../dist/${PLATFORM_DIR}
          cp ${BINARY} ../dist/${PLATFORM_DIR}/
          if [ "$GOOS" = "windows" ]; then
            cp cmd/server/wintun.dll ../dist/${PLATFORM_DIR}/ 2>/dev/null || true
          fi
          cp -r web ../dist/${PLATFORM_DIR}/ 2>/dev/null || true
          cd ../dist
          zip -r ../${PLATFORM_DIR}.zip ${PLATFORM_DIR}/
          cd ..

      - name: Upload platform zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: la-lune-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: ${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create api-bin.zip
        run: |
          mkdir -p api-bin
          find artifacts -type f -name "*.zip" -exec cp {} api-bin/ \;
          echo "Files in api-bin:"
          ls -la api-bin/
          cd api-bin
          zip -r ../api-bin.zip .
          cd ..

      - name: Generate release tag
        id: tag
        run: |
          TAG=$(date -u +"%Y.%m.%d.%H.%M")
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: api-bin.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get download URL
        id: get_url
        run: |
          OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo "url=https://github.com/${OWNER}/${REPO}/releases/download/${{ steps.tag.outputs.tag }}/api-bin.zip" >> $GITHUB_OUTPUT

      - name: Update LATEST-API.md
        run: |
          echo "${{ steps.get_url.outputs.url }}" > LATEST-API.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LATEST-API.md
          git commit -m "Update LATEST-API.md to ${{ steps.tag.outputs.tag }}" || exit 0
          git push
