name: Build LaLune

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============================================================
  #  Windows: backend + frontend + installer
  # ============================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Windows
        run: python build.py --ci --target windows --no-clean

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Windows
          path: Output/*.zip

  # ============================================================
  #  Linux: backend + frontend
  # ============================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsqlite3-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Linux
        run: python build.py --ci --target linux --no-clean

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Linux
          path: Output/*.zip

  # ============================================================
  #  OpenWRT backend (armsr/armv8, musl) через OpenWRT SDK
  # ============================================================
  build-desktop-openwrt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zstd sha256sum

      - name: Build OpenWRT backend
        working-directory: Backend/OpenWRT
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload OpenWRT backend
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-OpenWRT-Backend
          path: Backend/OpenWRT/output/lalune-openwrt-backend

  # ============================================================
  #  Release: прикрепляем артефакты к GitHub Release (только по тегу)
  # ============================================================
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-desktop-openwrt]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
