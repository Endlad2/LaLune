name: Build LaLune

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.5'
  GO_VERSION: '1.22.12'
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  PYTHONIOENCODING: 'utf-8'
  PYTHONUTF8: '1'

jobs:
  # ============================================================
  #  Desktop Windows (Flutter + Go c-shared)
  # ============================================================
  build-windows:
    name: Desktop Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: Desktop/Libs/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Detect Visual Studio and set CMAKE_GENERATOR
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere.exe not found"
            exit 1
          }
          $ver = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationVersion
          Write-Host "VS installationVersion: $ver"
          if (-not $ver) { Write-Error "VS not found"; exit 1 }
          $major = ($ver -split '\.')[0]
          switch ($major) {
            '16' { $gen = 'Visual Studio 16 2019' }
            '17' { $gen = 'Visual Studio 17 2022' }
            '18' { $gen = 'Visual Studio 18 2026' }
            default { $gen = 'Visual Studio 17 2022' }
          }
          Write-Host "CMake generator: $gen"
          "CMAKE_GENERATOR=$gen" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepend scripts/ to PATH (cmake wrapper)
        shell: pwsh
        run: |
          $scripts = (Resolve-Path "scripts").Path
          "$scripts" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # КРИТИЧНО: go:embed SmartTunnel.lua в Desktop/Libs/smarttunnel.go
      # ищет файл рядом с .go. Без этого шага go build падает с
      # "pattern SmartTunnel.lua: no matching files found".
      - name: Prepare SmartTunnel.lua
        run: python prepare_st.py --platform=all

      - name: Prepare frontend (pub get + assets)
        run: python build_frontend.py --platform Windows

      - name: Clean stale Windows build cache
        shell: pwsh
        run: |
          if (Test-Path "Frontend\Core\build\windows") {
            Remove-Item -Recurse -Force "Frontend\Core\build\windows"
          }

      - name: Build desktop (Go + Flutter)
        run: python build_desktop.py --platform Windows

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Windows
          path: Frontend/Core/build/windows/x64/runner/Release/
          if-no-files-found: error

  # ============================================================
  #  Desktop Linux (Flutter + Go c-shared)
  # ============================================================
  build-linux:
    name: Desktop Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libstdc++-12-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: Desktop/Libs/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare SmartTunnel.lua
        run: python3 prepare_st.py --platform=all

      - name: Prepare frontend
        run: python3 build_frontend.py --platform Linux

      - name: Build desktop
        run: python3 build_desktop.py --platform Linux

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Linux
          path: Frontend/Core/build/linux/x64/release/bundle/
          if-no-files-found: error

  # ============================================================
  #  Android APK
  # ============================================================
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK manually
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          if [ ! -d "$SDK_ROOT" ]; then SDK_ROOT="$HOME/Android/Sdk"; fi
          SDKMGR=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMGR="$candidate"; break
            fi
          done
          if [ -z "$SDKMGR" ]; then echo "::error::sdkmanager not found"; exit 1; fi
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;25.1.8937393" \
            >/dev/null 2>&1 || true
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "$SDK_ROOT/platform-tools"
            echo "$SDK_ROOT/cmdline-tools/latest/bin"
            echo "$SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}"
          } >> "$GITHUB_PATH"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          } >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Clean stale Kotlin caches
        run: rm -rf ~/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin || true

      - name: Download core binaries
        run: |
          set -euo pipefail
          JNI_ROOT="Frontend/Core/android/app/src/main/jniLibs"
          mkdir -p "$JNI_ROOT/arm64-v8a" "$JNI_ROOT/armeabi-v7a" "$JNI_ROOT/x86_64"
          BASE="https://github.com/Endlad2/csqtt-core/releases/latest/download"
          curl -L --fail --retry 3 -o "$JNI_ROOT/arm64-v8a/libclient-android-arm64-v8a.so"   "$BASE/libclient-android-arm64-v8a.so"
          curl -L --fail --retry 3 -o "$JNI_ROOT/armeabi-v7a/libclient-android-armeabi-v7a.so" "$BASE/libclient-android-armeabi-v7a.so"
          curl -L --fail --retry 3 -o "$JNI_ROOT/x86_64/libclient-android-x86_64.so"        "$BASE/libclient-android-x86_64.so"

      - name: Prepare frontend (pub get + assets)
        run: python3 build_frontend.py --platform Android

      - name: Prepare Android Core (Java sources)
        run: python3 prepare_android_core.py

      - name: Verify no .kts duplicates
        run: |
          for f in \
            Frontend/Core/android/settings.gradle.kts \
            Frontend/Core/android/build.gradle.kts \
            Frontend/Core/android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              echo "::error::$f exists — удалите его"; exit 1
            fi
          done

      - name: Verify no duplicate styles
        run: |
          if [ -f "Frontend/Core/android/app/src/main/res/values/themes.xml" ]; then
            echo "::error::themes.xml exists — удалите его, он дублирует styles.xml"; exit 1
          fi

      - name: Build universal APK
        working-directory: Frontend/Core
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Android-universal
          path: Frontend/Core/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ============================================================
  #  Token Fetcher (Windows + Linux)
  # ============================================================
  build-token-fetcher:
    name: Token Fetcher
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-22.04
            platform: Linux
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: 'utf-8'
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Linux helper deps
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build token grabber
        run: python build_token_grabber.py --platform=${{ matrix.platform }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LaLuneTokenFetcher-${{ matrix.platform }}
          path: Core/LaLuneTokenFetcher/output/LaLuneTokenFetcher/
          if-no-files-found: error
