name: Build LaLune

on:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "stable"

jobs:

  # ============================================================
  #  Desktop Linux
  # ============================================================
  build-desktop-linux:
    name: Desktop Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libstdc++-12-dev

      - name: Build (CI mode)
        run: python build.py --ci --target linux

      - uses: actions/upload-artifact@v4
        with:
          name: Output-Linux
          path: Output/*.zip
          if-no-files-found: error

  # ============================================================
  #  Desktop Windows
  #
  #  ПРОБЛЕМА: LNK1327 при mt.exe из Windows SDK 10.0.26100.
  #  Flutter 3.24 зовёт mt.exe с "-outputresource:file;#" (без
  #  номера ресурса), а mt.exe из 26100 требует явный номер.
  #
  #  VS2022, cl.exe, link.exe, rc.exe — работают (иначе Flutter
  #  упал бы раньше). Падает ТОЛЬКО mt.exe.
  #
  #  РЕШЕНИЕ: подменяем mt.exe/rc.exe/rcdll.dll в папке 26100 на
  #  версии из ДРУГОГО SDK, который уже есть в образе. В
  #  windows-latest есть:
  #    10.0.17134.0   (Windows 10 1803)
  #    10.0.20348.0   (Windows Server 2022) ← используем этот
  #    10.0.26100.0   (наш проблемный)
  #
  #  Если 20348 вдруг нет — берём 17134.
  # ============================================================
  build-desktop-windows:
    name: Desktop Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ── VS2022 Community (Native Desktop C++) ───────────────
      - name: Install VS2022 Community (Native Desktop C++)
        shell: pwsh
        run: |
          choco install visualstudio2022community -y --no-progress `
            --package-parameters "--quiet --wait --norestart --nocache --add Microsoft.VisualStudio.Workload.NativeDesktop --includeRecommended"

      # ── Подменяем mt.exe / rc.exe в SDK 26100 на версии из
      #    другого установленного SDK (20348 → fallback 17134).
      - name: Replace mt.exe/rc.exe in SDK 26100
        shell: pwsh
        run: |
          $sdkBinRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $target = Join-Path $sdkBinRoot "10.0.26100.0\x64"

          if (-not (Test-Path $target)) {
            Write-Error "Target SDK bin not found: $target"
            Get-ChildItem $sdkBinRoot -Directory | Select-Object -ExpandProperty Name
            exit 1
          }

          # Ищем "старый" SDK — 20348, потом 17134.
          $candidates = @("10.0.20348.0", "10.0.17134.0")
          $source = $null
          foreach ($ver in $candidates) {
            $p = Join-Path $sdkBinRoot "$ver\x64"
            if (Test-Path (Join-Path $p "mt.exe")) {
              $source = $p
              Write-Host "Using source SDK: $ver"
              break
            }
          }

          if (-not $source) {
            Write-Error "No usable older SDK found in $sdkBinRoot"
            Get-ChildItem $sdkBinRoot -Directory | Select-Object -ExpandProperty Name
            exit 1
          }

          Write-Host "Source: $source"
          Write-Host "Target: $target"

          foreach ($f in @("mt.exe", "rc.exe", "rcdll.dll")) {
            $src = Join-Path $source $f
            $dst = Join-Path $target $f
            if (Test-Path $src) {
              Write-Host "Copying $f : $src → $dst"
              Copy-Item -Path $src -Destination $dst -Force
            } else {
              Write-Warning "$f not found in $source"
            }
          }

          Write-Host "=== After replacement ==="
          Get-Item "$target\mt.exe" | Select-Object Name, Length, LastWriteTime
          Get-Item "$target\rc.exe" | Select-Object Name, Length, LastWriteTime

      # ── Проверка: mt.exe работает ────────────────────────────
      - name: Verify mt.exe works
        shell: pwsh
        run: |
          $mt = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\mt.exe"
          Write-Host "Path: $mt"
          $out = & $mt 2>&1 | Out-String
          if ($out -notmatch "Manifest Tool") {
            Write-Error "mt.exe did not print usage: $out"
            exit 1
          }
          Write-Host "OK: mt.exe responds"

      # ── Скрываем VS2026 (необязательно) ──────────────────────
      - name: Hide VS2026 from vswhere (optional)
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($p in @(
            "C:\Program Files\Microsoft Visual Studio\18",
            "C:\Program Files (x86)\Microsoft Visual Studio\18"
          )) {
            if (Test-Path $p) {
              Rename-Item -Path $p -NewName "18.hidden" -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Verify vswhere
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "--- latest ---"
          & $vswhere -latest -products * -property installationPath

      # ── Активация MSVC ───────────────────────────────────────
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show MSVC paths
        shell: pwsh
        run: |
          Write-Host "VCToolsInstallDir: $env:VCToolsInstallDir"
          Write-Host "WindowsSdkDir: $env:WindowsSdkDir"
          Write-Host "WindowsSDKVersion: $env:WindowsSDKVersion"
          where.exe cl.exe
          where.exe mt.exe
          where.exe link.exe

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      # ── Сборка ────────────────────────────────────────────────
      - name: Build (CI mode)
        shell: cmd
        run: python build.py --ci --target windows

      - uses: actions/upload-artifact@v4
        with:
          name: Output-Windows
          path: Output/*.zip
          if-no-files-found: error

  # ============================================================
  #  Android APK
  # ============================================================
  build-android:
    name: Android APK (universal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use preinstalled Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install Android NDK 27
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" >/dev/null 2>&1 || true
          ls -la "$ANDROID_HOME/ndk/" || true

      - name: Copy Android backend
        run: |
          DST="Frontend/android/app/src/main/kotlin/com/lalune/lalune"
          mkdir -p "$DST"
          cp Backend/Android/*.kt "$DST/"
          ls -la "$DST"

      - name: Copy assets
        run: |
          rm -rf Frontend/assets
          cp -r Assets Frontend/assets

      - name: Download core binaries (jniLibs)
        run: |
          mkdir -p Frontend/android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64}
          curl -L --fail --retry 3 -o Frontend/android/app/src/main/jniLibs/arm64-v8a/libclient-android-arm64-v8a.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-arm64-v8a.so
          curl -L --fail --retry 3 -o Frontend/android/app/src/main/jniLibs/armeabi-v7a/libclient-android-armeabi-v7a.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-armeabi-v7a.so
          curl -L --fail --retry 3 -o Frontend/android/app/src/main/jniLibs/x86_64/libclient-android-x86_64.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-x86_64.so

      - name: Copy SmartTunnel.lua
        run: |
          mkdir -p Frontend/android/app/src/main/assets
          cp Core/SmartTunnel.lua Frontend/android/app/src/main/assets/SmartTunnel.lua

      - name: Flutter pub get
        working-directory: Frontend
        run: flutter pub get

      - name: Build Android APK (debug)
        working-directory: Frontend
        run: flutter build apk --debug

      - name: Locate & rename APK
        id: find_apk
        run: |
          APK=$(find Frontend/build/app/outputs/flutter-apk -name "app-debug.apk" -type f | head -n 1)
          [ -z "$APK" ] && exit 1
          mkdir -p Output
          cp "$APK" Output/LaLune-Android.apk
          ls -la Output/LaLune-Android.apk
          echo "apk=Output/LaLune-Android.apk" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: Output-Android
          path: Output/LaLune-Android.apk
          if-no-files-found: error

  # ============================================================
  #  LaLuneTokenFetcher
  # ============================================================
  build-token-fetcher:
    name: "Token Fetcher - ${{ matrix.platform }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
          - platform: Linux
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show dotnet version
        run: dotnet --info

      - name: Sanity check
        shell: bash
        run: ls -la Core/LaLuneTokenFetcher

      - name: Build fetcher
        run: python build_token_grabber.py --platform ${{ matrix.platform }}

      - name: Package into LaLuneTokenFetcher_<OS>.zip
        shell: bash
        run: |
          set -e
          OUTPUT_BIN="Core/LaLuneTokenFetcher/output/LaLuneTokenFetcher"
          ZIP_PATH="Core/LaLuneTokenFetcher/LaLuneTokenFetcher_${{ matrix.platform }}.zip"

          if [ ! -d "$OUTPUT_BIN" ]; then
            find Core/LaLuneTokenFetcher/output -maxdepth 2 -type d || true
            exit 1
          fi

          STAGING_DIR="Core/LaLuneTokenFetcher/output/_staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR/vk-token-fetcher"
          cp -r "$OUTPUT_BIN/." "$STAGING_DIR/vk-token-fetcher/"

          if [ "${{ matrix.platform }}" = "Linux" ]; then
            chmod +x "$STAGING_DIR/vk-token-fetcher/LaLuneTokenFetcher" || true
          fi

          rm -f "$ZIP_PATH"

          pushd "$STAGING_DIR" >/dev/null
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            popd >/dev/null
            powershell -Command "Compress-Archive -Path 'Core/LaLuneTokenFetcher/output/_staging/vk-token-fetcher' -DestinationPath '$ZIP_PATH' -Force"
          else
            zip -r "../../LaLuneTokenFetcher_${{ matrix.platform }}.zip" "vk-token-fetcher"
            popd >/dev/null
          fi

          ls -la "$ZIP_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: LaLuneTokenFetcher-${{ matrix.platform }}
          path: Core/LaLuneTokenFetcher/LaLuneTokenFetcher_${{ matrix.platform }}.zip
          if-no-files-found: error

  # ============================================================
  #  Release
  # ============================================================
  create-release:
    name: Create Release
    needs:
      - build-desktop-linux
      - build-desktop-windows
      - build-android
      - build-token-fetcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten artifacts into release/
        run: |
          set -e
          cd release
          find . -name 'LaLune-Windows.zip' -exec cp {} ./ \;
          find . -name 'Backend-Windows.zip' -exec cp {} ./ \;
          find . -name 'Installer-Windows.zip' -exec cp {} ./ \;
          find . -name 'LaLune-Linux.zip'   -exec cp {} ./ \;
          find . -name 'Backend-Linux.zip'  -exec cp {} ./ \;
          find . -name 'LaLune-Android.apk' -exec cp {} ./ \;
          find . -name 'LaLuneTokenFetcher_Windows.zip' -exec cp {} ./ \;
          find . -name 'LaLuneTokenFetcher_Linux.zip'   -exec cp {} ./ \;
          ls -la

      - id: date
        run: echo "date=$(date +'%y.%m.%d.%H.%M')" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: Release ${{ steps.date.outputs.date }}
          files: |
            release/LaLune-Windows.zip
            release/Backend-Windows.zip
            release/Installer-Windows.zip
            release/LaLune-Linux.zip
            release/Backend-Linux.zip
            release/LaLune-Android.apk
            release/LaLuneTokenFetcher_Windows.zip
            release/LaLuneTokenFetcher_Linux.zip
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
