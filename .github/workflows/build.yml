name: Build LaLune

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ══════════════════════════════════════════════════════════════
  #  Desktop Linux
  # ══════════════════════════════════════════════════════════════
  build-desktop-linux:
    name: Desktop Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter: enable web
        run: flutter config --enable-web

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config \
            gcc \
            build-essential

      - name: Setup Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Build Dart frontend
        run: python3 build_frontend.py --platform Linux

      - name: Build Desktop Linux
        run: python3 build_desktop.py --platform Linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Linux
          path: Desktop/Linux/build/bin/*
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════
  #  Desktop Windows
  # ══════════════════════════════════════════════════════════════
  build-desktop-windows:
    name: Desktop Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter: enable web
        run: flutter config --enable-web

      - name: Setup Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Dart frontend
        run: python build_frontend.py --platform Windows

      - name: Build Desktop Windows
        run: python build_desktop.py --platform Windows

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Windows
          path: Desktop/Windows/build/bin/*
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════
  #  Android (universal APK: arm64-v8a + armeabi-v7a + x86_64)
  # ══════════════════════════════════════════════════════════════
  build-android:
    name: Android APK (universal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter: enable web
        run: flutter config --enable-web

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 1) Собираем Dart → Frontend/output/ с api.js из Api/android.js
      - name: Build Dart frontend for Android
        run: python build_frontend.py --platform Android

      # 2) Копируем собранный фронт в Android assets
      - name: Copy frontend to Android assets
        run: |
          ASSETS_DIR="Mobile/Android/app/src/main/assets"
          rm -rf "$ASSETS_DIR"
          mkdir -p "$ASSETS_DIR"
          cp -r Frontend/output/. "$ASSETS_DIR/"
          echo "=== assets ==="
          ls -la "$ASSETS_DIR"
          echo "=== assets/assets (images) ==="
          ls -la "$ASSETS_DIR/assets" || true
          echo "=== assets/assets/assets (Flutter) ==="
          ls -la "$ASSETS_DIR/assets/assets" || true

      # 3) Скачиваем .so ядра во все три ABI
      - name: Download core binaries (universal)
        run: |
          mkdir -p Mobile/Android/app/src/main/jniLibs/arm64-v8a
          mkdir -p Mobile/Android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p Mobile/Android/app/src/main/jniLibs/x86_64

          curl -L --fail --retry 3 --retry-delay 2 -o \
            Mobile/Android/app/src/main/jniLibs/arm64-v8a/libclient-android-arm64-v8a.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-arm64-v8a.so
          curl -L --fail --retry 3 --retry-delay 2 -o \
            Mobile/Android/app/src/main/jniLibs/armeabi-v7a/libclient-android-armeabi-v7a.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-armeabi-v7a.so
          curl -L --fail --retry 3 --retry-delay 2 -o \
            Mobile/Android/app/src/main/jniLibs/x86_64/libclient-android-x86_64.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-x86_64.so

          find Mobile/Android/app/src/main/jniLibs -type f -exec ls -la {} \;

      # 4) Сборка APK
      - name: Build Android APK
        working-directory: Mobile/Android
        run: gradle assembleDebug --stacktrace --no-daemon

      # 5) Находим .apk
      - name: Locate APK
        id: find_apk
        run: |
          APK=$(find Mobile/Android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found. Tree:"
            find Mobile/Android/app/build -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "Found: $APK"

      # 6) Загрузка артефакта
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Android
          path: ${{ steps.find_apk.outputs.apk }}
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════
  #  OpenWRT (RouteRich, arm64)
  # ══════════════════════════════════════════════════════════════
  build-openwrt:
    name: OpenWRT RouteRich (arm64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build owrt-client
        working-directory: OpenWRT
        run: |
          cross build --release --target aarch64-unknown-linux-musl
          ls -la target/aarch64-unknown-linux-musl/release/

      - name: Prepare release package
        working-directory: OpenWRT
        run: |
          BIN="target/aarch64-unknown-linux-musl/release/owrt-client"
          OUT="/tmp/owrt-client"
          mkdir -p "$OUT"
          cp "$BIN" "$OUT/owrt-client"
          cp README.md "$OUT/README.md"
          printf '%s\n' \
            '# Скопируй в файл `config` (без .example) рядом с бинарником.' \
            'csqtt://connect?v=2&host=31.77.148.203&peer=46000&password=ЗАМЕНИ&hashes=hash1+hash2+hash3' \
            > "$OUT/config.example"
          ls -la "$OUT"

      - name: Upload OpenWRT Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-OpenWRT-RouteRich
          path: /tmp/owrt-client/
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════
  #  Release
  # ══════════════════════════════════════════════════════════════
  create-release:
    name: Create Release
    needs:
      - build-desktop-linux
      - build-desktop-windows
      - build-android
      - build-openwrt
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Show structure
        run: find release -type f | head -50

      - name: Create ZIP archives
        run: |
          cd release
          zip -r LaLune-Linux.zip        LaLune-Linux        || true
          zip -r LaLune-Windows.zip      LaLune-Windows      || true
          zip -r LaLune-Android.zip      LaLune-Android      || true
          zip -r LaLune-OpenWRT.zip      LaLune-OpenWRT-RouteRich || true

      - name: Get current date
        id: date
        run: echo "date=$(date +'%y.%m.%d.%H.%M')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: Release ${{ steps.date.outputs.date }}
          files: release/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
