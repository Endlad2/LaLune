name: Build LaLune

on:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "stable"

jobs:

  # ============================================================
  #  Desktop Linux
  # ============================================================
  build-desktop-linux:
    name: Desktop Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libstdc++-12-dev

      - name: Build (CI mode)
        run: python build.py --ci --target linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Output-Linux
          path: Output/*.zip
          if-no-files-found: error

  # ============================================================
  #  Desktop Windows
  # ============================================================
  build-desktop-windows:
    name: Desktop Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ────────────────────────────────────────────────────────
      #  Windows: готовим VS2022 + MSVC
      #
      #  windows-latest образ содержит VS2026 Enterprise, которая
      #  Flutter 3.24 ещё НЕ поддерживает. Flutter её находит,
      #  но затем падает с "could not find VS 2019" (некорректно
      #  определяет версию CMake-генератора).
      #
      #  Решение: ставим VS2022 Community и ВРЕМЕННО переименовываем
      #  папку VS2026, чтобы vswhere возвращал только VS2022.
      # ────────────────────────────────────────────────────────

      - name: Install VS2022 Community (Native Desktop C++)
        shell: pwsh
        run: |
          choco install visualstudio2022community -y --no-progress `
            --package-parameters "--quiet --wait --norestart --nocache --add Microsoft.VisualStudio.Workload.NativeDesktop --includeRecommended"

      - name: Hide VS2026 from vswhere
        shell: pwsh
        run: |
          # VS2026 Enterprise живёт в C:\Program Files\Microsoft Visual Studio\18
          # Переименовываем в .hidden, чтобы vswhere её не нашёл.
          $vs18 = "C:\Program Files\Microsoft Visual Studio\18"
          if (Test-Path $vs18) {
            Write-Host "Renaming $vs18 → $vs18.hidden"
            Rename-Item -Path $vs18 -NewName "18.hidden" -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "VS2026 (18) not found — nothing to hide"
          }
          # Также проверим альтернативный путь
          $vs18x86 = "C:\Program Files (x86)\Microsoft Visual Studio\18"
          if (Test-Path $vs18x86) {
            Rename-Item -Path $vs18x86 -NewName "18.hidden" -Force -ErrorAction SilentlyContinue
          }

      - name: Verify vswhere now finds VS2022
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -all -products * -property installationPath
          Write-Host "---"
          & $vswhere -latest -products * -property installationPath

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show MSVC paths
        shell: pwsh
        run: |
          Write-Host "VCToolsInstallDir: $env:VCToolsInstallDir"
          where.exe cl.exe
          where.exe mt.exe
          Write-Host "---"
          flutter doctor -v

      - name: Build (CI mode)
        shell: cmd
        run: python build.py --ci --target windows

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Output-Windows
          path: Output/*.zip
          if-no-files-found: error

  # ============================================================
  #  Android APK
  # ============================================================
  build-android:
    name: Android APK (universal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Use preinstalled Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install Android NDK 27
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" >/dev/null 2>&1 || true
          ls -la "$ANDROID_HOME/ndk/" || true

      - name: Copy Android backend
        run: |
          DST="Frontend/android/app/src/main/kotlin/com/lalune/backend"
          mkdir -p "$DST"
          cp Backend/Android/*.kt "$DST/"
          ls -la "$DST"

      - name: Copy assets
        run: |
          rm -rf Frontend/assets
          cp -r Assets Frontend/assets

      - name: Download core binaries (jniLibs)
        run: |
          mkdir -p Frontend/android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64}
          curl -L --fail --retry 3 -o Frontend/android/app/src/main/jniLibs/arm64-v8a/libclient-android-arm64-v8a.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-arm64-v8a.so
          curl -L --fail --retry 3 -o Frontend/android/app/src/main/jniLibs/armeabi-v7a/libclient-android-armeabi-v7a.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-armeabi-v7a.so
          curl -L --fail --retry 3 -o Frontend/android/app/src/main/jniLibs/x86_64/libclient-android-x86_64.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-x86_64.so

      - name: Copy SmartTunnel.lua
        run: |
          mkdir -p Frontend/android/app/src/main/assets
          cp Core/SmartTunnel.lua Frontend/android/app/src/main/assets/SmartTunnel.lua

      - name: Flutter pub get
        working-directory: Frontend
        run: flutter pub get

      - name: Build Android APK (debug)
        working-directory: Frontend
        run: flutter build apk --debug

      - name: Locate & rename APK
        id: find_apk
        run: |
          APK=$(find Frontend/build/app/outputs/flutter-apk -name "app-debug.apk" -type f | head -n 1)
          [ -z "$APK" ] && exit 1
          mkdir -p Output
          cp "$APK" Output/LaLune-Android.apk
          ls -la Output/LaLune-Android.apk
          echo "apk=Output/LaLune-Android.apk" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: Output-Android
          path: Output/LaLune-Android.apk
          if-no-files-found: error

  # ============================================================
  #  LaLuneTokenFetcher (без изменений)
  # ============================================================
  build-token-fetcher:
    name: "Token Fetcher - ${{ matrix.platform }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
          - platform: Linux
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show dotnet version
        run: dotnet --info

      - name: Sanity check
        shell: bash
        run: ls -la Core/LaLuneTokenFetcher

      - name: Build fetcher
        run: python build_token_grabber.py --platform ${{ matrix.platform }}

      - name: Package into LaLuneTokenFetcher_<OS>.zip
        shell: bash
        run: |
          set -e
          OUTPUT_BIN="Core/LaLuneTokenFetcher/output/LaLuneTokenFetcher"
          ZIP_PATH="Core/LaLuneTokenFetcher/LaLuneTokenFetcher_${{ matrix.platform }}.zip"

          if [ ! -d "$OUTPUT_BIN" ]; then
            echo "Не найдена папка с результатом сборки: $OUTPUT_BIN"
            find Core/LaLuneTokenFetcher/output -maxdepth 2 -type d || true
            exit 1
          fi

          STAGING_DIR="Core/LaLuneTokenFetcher/output/_staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR/vk-token-fetcher"
          cp -r "$OUTPUT_BIN/." "$STAGING_DIR/vk-token-fetcher/"

          if [ "${{ matrix.platform }}" = "Linux" ]; then
            chmod +x "$STAGING_DIR/vk-token-fetcher/LaLuneTokenFetcher" || true
          fi

          rm -f "$ZIP_PATH"

          pushd "$STAGING_DIR" >/dev/null
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            popd >/dev/null
            powershell -Command "Compress-Archive -Path 'Core/LaLuneTokenFetcher/output/_staging/vk-token-fetcher' -DestinationPath '$ZIP_PATH' -Force"
          else
            zip -r "../../LaLuneTokenFetcher_${{ matrix.platform }}.zip" "vk-token-fetcher"
            popd >/dev/null
          fi

          echo "=== $ZIP_PATH ==="
          ls -la "$ZIP_PATH"

      - name: Verify zip
        shell: bash
        run: |
          ZIP="Core/LaLuneTokenFetcher/LaLuneTokenFetcher_${{ matrix.platform }}.zip"
          test -f "$ZIP" || { echo "$ZIP not found"; exit 1; }

          if [ "${{ matrix.platform }}" = "Windows" ]; then
            powershell -Command "Expand-Archive -Path '$ZIP' -DestinationPath 'verify_zip' -Force"
            ls -la verify_zip/vk-token-fetcher
          else
            unzip -l "$ZIP"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LaLuneTokenFetcher-${{ matrix.platform }}
          path: Core/LaLuneTokenFetcher/LaLuneTokenFetcher_${{ matrix.platform }}.zip
          if-no-files-found: error

  # ============================================================
  #  Release
  # ============================================================
  create-release:
    name: Create Release
    needs:
      - build-desktop-linux
      - build-desktop-windows
      - build-android
      - build-token-fetcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Show artifacts
        run: find release -type f | head -50

      - name: Flatten artifacts into release/
        run: |
          set -e
          cd release

          find . -name 'LaLune-Windows.zip' -exec cp {} ./ \;
          find . -name 'Backend-Windows.zip' -exec cp {} ./ \;
          find . -name 'Installer-Windows.zip' -exec cp {} ./ \;
          find . -name 'LaLune-Linux.zip'   -exec cp {} ./ \;
          find . -name 'Backend-Linux.zip'  -exec cp {} ./ \;

          find . -name 'LaLune-Android.apk' -exec cp {} ./ \;

          find . -name 'LaLuneTokenFetcher_Windows.zip' -exec cp {} ./ \;
          find . -name 'LaLuneTokenFetcher_Linux.zip'   -exec cp {} ./ \;

          echo "=== release/ contents ==="
          ls -la

      - id: date
        run: echo "date=$(date +'%y.%m.%d.%H.%M')" >> $GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.date.outputs.date }}
          name: Release ${{ steps.date.outputs.date }}
          files: |
            release/LaLune-Windows.zip
            release/Backend-Windows.zip
            release/Installer-Windows.zip
            release/LaLune-Linux.zip
            release/Backend-Linux.zip
            release/LaLune-Android.apk
            release/LaLuneTokenFetcher_Windows.zip
            release/LaLuneTokenFetcher_Linux.zip
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
