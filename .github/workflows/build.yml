name: Build LaLune (native UI)

# Native Flutter UI + Rust Backend (Backend/).
# Desktop workflow: builds the Rust TUN library and the Flutter app for Linux + Windows.
# Replaces the legacy Wails/web build that targeted the removed Desktop/ layout.

on:
  push:
    branches:
      - main
      - release
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FLUTTER_CHANNEL: stable

jobs:
  linux-desktop:
    name: Linux desktop (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libtun-dev || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Backend/Cargo.lock', 'Backend/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Rust Backend (release)
        working-directory: Backend
        run: cargo build --release

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter pub get
        working-directory: Frontend/Core
        run: flutter pub get

      - name: Flutter build Linux
        working-directory: Frontend/Core
        run: flutter build linux --release

      - name: Embed Rust backend into bundle
        run: |
          set -eux
          BUNDLE_DIR=$(find Frontend/Core/build/linux -type d -name 'bundle' | head -n1)
          mkdir -p "$BUNDLE_DIR/lib"
          cp Backend/target/release/liblalune_backend.so "$BUNDLE_DIR/lib/" || \
          cp Backend/target/release/liblalune_backend.so "$BUNDLE_DIR/" || true
          ls -la "$BUNDLE_DIR" || true

      - name: Package Linux artifact
        run: |
          set -eux
          BUNDLE_DIR=$(find Frontend/Core/build/linux -type d -name 'bundle' | head -n1)
          mkdir -p /tmp/pkg
          cp -r "$BUNDLE_DIR" /tmp/pkg/LaLune
          tar -C /tmp/pkg -czf LaLune-Linux-x86_64.tar.gz LaLune
          ls -la LaLune-Linux-x86_64.tar.gz

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Linux-x86_64
          path: LaLune-Linux-x86_64.tar.gz
          if-no-files-found: error

  windows-desktop:
    name: Windows desktop (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Backend/Cargo.lock', 'Backend/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build Rust Backend (release)
        working-directory: Backend
        run: cargo build --release

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        working-directory: Frontend/Core
        run: flutter pub get

      - name: Flutter build Windows
        working-directory: Frontend/Core
        run: flutter build windows --release

      - name: Embed Rust backend into bundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path Frontend/Core/build/windows -Recurse -Filter 'lalune_core.exe' | Select-Object -First 1
          if ($bundle) {
            $dir = $bundle.Directory.FullName
            Copy-Item Backend/target/release/lalune_backend.dll "$dir\" -Force
            Get-ChildItem $dir | Format-Table
          }

      - name: Package Windows artifact
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path Frontend/Core/build/windows -Recurse -Filter 'lalune_core.exe' | Select-Object -First 1
          $dir = $bundle.Directory.FullName
          Compress-Archive -Path "$dir\*" -DestinationPath LaLune-Windows-x86_64.zip -Force
          Get-Item LaLune-Windows-x86_64.zip | Format-List

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Windows-x86_64
          path: LaLune-Windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux-desktop, windows-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LaLune-Linux-x86_64/LaLune-Linux-x86_64.tar.gz
            dist/LaLune-Windows-x86_64/LaLune-Windows-x86_64.zip
          generate_release_notes: true