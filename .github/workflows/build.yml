name: Build LaLune

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      stable_version:
        description: 'Stable release version, e.g. 0.9 (without commit hash)'
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"
  FLUTTER_VERSION: "3.29.0"
  RUST_VERSION: "stable"

jobs:

  # ============================================================
  #  Desktop Linux
  # ============================================================
  build-desktop-linux:
    name: Desktop Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libstdc++-12-dev
      - name: Install Pillow (для make_icons.py)
        run: python -m pip install --upgrade pip Pillow

      - name: Generate icons
        run: python make_icons.py

      - name: Build (CI mode)
        run: python build.py --ci --target linux

      - uses: actions/upload-artifact@v4
        with:
          name: Output-Linux
          path: Output/*.zip
          if-no-files-found: error

  # ============================================================
  #  Desktop Windows
  # ============================================================
  build-desktop-windows:
    name: Desktop Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install VS2022 Community (Native Desktop C++)
        shell: pwsh
        run: |
          choco install visualstudio2022community -y --no-progress `
            --package-parameters "--quiet --wait --norestart --nocache --add Microsoft.VisualStudio.Workload.NativeDesktop --includeRecommended"
      - name: Hide VS2026 from vswhere (optional)
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($p in @(
            "C:\Program Files\Microsoft Visual Studio\18",
            "C:\Program Files (x86)\Microsoft Visual Studio\18"
          )) {
            if (Test-Path $p) {
              Rename-Item -Path $p -NewName "18.hidden" -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Verify vswhere
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "--- latest ---"
          & $vswhere -latest -products * -property installationPath
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show MSVC paths
        shell: pwsh
        run: |
          Write-Host "VCToolsInstallDir: $env:VCToolsInstallDir"
          Write-Host "WindowsSdkDir: $env:WindowsSdkDir"
          Write-Host "WindowsSDKVersion: $env:WindowsSDKVersion"
          where.exe cl.exe
          where.exe link.exe
      - name: Install Pillow (для make_icons.py)
        run: python -m pip install --upgrade pip Pillow

      - name: Generate icons (PNG→ICO + foreground)
        run: python make_icons.py

      - name: Flutter doctor (diagnostics)
        run: flutter doctor -v

      - name: Build (CI mode)
        shell: cmd
        run: python build.py --ci --target windows

      - uses: actions/upload-artifact@v4
        with:
          name: Output-Windows
          path: Output/*.zip
          if-no-files-found: error

  # ============================================================
  #  OpenWRT backend (armsr/armv8, musl) via OpenWRT SDK
  # ============================================================
  build-desktop-openwrt:
    name: OpenWRT Backend (armsr/armv8)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-unknown-linux-musl

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl zstd
      - name: Build OpenWRT backend
        working-directory: Backend/OpenWRT
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Verify binary
        run: |
          ls -la Backend/OpenWRT/output/
          file Backend/OpenWRT/output/lalune-openwrt-backend || true
      - uses: actions/upload-artifact@v4
        with:
          name: Output-OpenWRT
          path: Backend/OpenWRT/output/lalune-openwrt-backend
          if-no-files-found: error

  # ============================================================
  #  Android APK
  # ============================================================
  build-android:
    name: Android APK (universal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Use preinstalled Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
      - name: Install Android NDK 27
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" >/dev/null 2>&1 || true
          ls -la "$ANDROID_HOME/ndk/" || true

      # ============================================================
      #  csqtt-link: собрать как бинарник для Android (все ABI)
      #  и положить в jniLibs/<abi>/libcsqtt-link.so
      # ============================================================
      - name: Build csqtt-link for Android (all ABIs)
        working-directory: Core/csqtt-link
        run: |
          set -euo pipefail
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          export TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"

          # ---- arm64-v8a ----
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          cargo build --release --target aarch64-linux-android
          mkdir -p ../../Frontend/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/csqtt-link \
             ../../Frontend/android/app/src/main/jniLibs/arm64-v8a/libcsqtt-link.so

          # ---- armeabi-v7a ----
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$TOOLCHAIN/bin/armv7a-linux-androideabi24-clang"
          export CC_armv7_linux_androideabi="$TOOLCHAIN/bin/armv7a-linux-androideabi24-clang"
          export AR_armv7_linux_androideabi="$TOOLCHAIN/bin/llvm-ar"
          cargo build --release --target armv7-linux-androideabi
          mkdir -p ../../Frontend/android/app/src/main/jniLibs/armeabi-v7a
          cp target/armv7-linux-androideabi/release/csqtt-link \
             ../../Frontend/android/app/src/main/jniLibs/armeabi-v7a/libcsqtt-link.so

          # ---- x86_64 ----
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$TOOLCHAIN/bin/x86_64-linux-android24-clang"
          export CC_x86_64_linux_android="$TOOLCHAIN/bin/x86_64-linux-android24-clang"
          export AR_x86_64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          cargo build --release --target x86_64-linux-android
          mkdir -p ../../Frontend/android/app/src/main/jniLibs/x86_64
          cp target/x86_64-linux-android/release/csqtt-link \
             ../../Frontend/android/app/src/main/jniLibs/x86_64/libcsqtt-link.so

          echo "=== jniLibs after csqtt-link build ==="
          ls -la ../../Frontend/android/app/src/main/jniLibs/*/libcsqtt-link.so

      - name: Copy Android backend
        run: |
          DST="Frontend/android/app/src/main/kotlin/com/lalune/lalune"
          mkdir -p "$DST"
          cp Backend/Android/*.kt "$DST/"
          ls -la "$DST"
      - name: Copy assets
        run: |
          rm -rf Frontend/assets
          cp -r Assets Frontend/assets
      - name: Download core binaries (jniLibs)
        run: |
          mkdir -p Frontend/android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64}
          curl -L --fail --retry 3 -o Frontend/android/app/src/main/jniLibs/arm64-v8a/libclient-android-arm64-v8a.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-arm64-v8a.so
          curl -L --fail --retry 3 -o Frontend/android/app/src/main/jniLibs/armeabi-v7a/libclient-android-armeabi-v7a.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-armeabi-v7a.so
          curl -L --fail --retry 3 -o Frontend/android/app/src/main/jniLibs/x86_64/libclient-android-x86_64.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-x86_64.so

          # CSQTT 2.1.9: pinned release, kept under distinct names so it
          # coexists with the current core in the same APK.
          curl -L --fail --retry 3 -o Frontend/android/app/src/main/jniLibs/arm64-v8a/libcsqtt219.so \
            https://github.com/Endlad2/csqtt-core/releases/download/2026.09.17.17.36/libclient-android-arm64-v8a.so
          curl -L --fail --retry 3 -o Frontend/android/app/src/main/jniLibs/armeabi-v7a/libcsqtt219.so \
            https://github.com/Endlad2/csqtt-core/releases/download/2026.09.17.17.36/libclient-android-armeabi-v7a.so
          curl -L --fail --retry 3 -o Frontend/android/app/src/main/jniLibs/x86_64/libcsqtt219.so \
            https://github.com/Endlad2/csqtt-core/releases/download/2026.09.17.17.36/libclient-android-x86_64.so
      - name: Download PaperFlux cores (jniLibs)
        run: |
          TMP_PF=$(mktemp -d)
          curl -L --fail --retry 3 -o "$TMP_PF/paperflux-android.zip" \
            https://github.com/Endlad2/PaperFlux-core/releases/latest/download/paperflux-android.zip
          unzip -o "$TMP_PF/paperflux-android.zip" -d "$TMP_PF/extracted"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p "Frontend/android/app/src/main/jniLibs/$abi"
            SRC="$TMP_PF/extracted/$abi/libopenflux.so"
            if [ -f "$SRC" ]; then
              cp "$SRC" "Frontend/android/app/src/main/jniLibs/$abi/libopenflux.so"
            fi
          done
          rm -rf "$TMP_PF"
      - name: Copy Lua scripts to assets
        run: |
          mkdir -p Frontend/android/app/src/main/assets
          cp Core/SmartTunnel.lua   Frontend/android/app/src/main/assets/SmartTunnel.lua
          cp Core/csqtt_decode.lua  Frontend/android/app/src/main/assets/csqtt_decode.lua
      - name: Install Pillow (для make_icons.py)
        run: python -m pip install --upgrade pip Pillow

      - name: Generate icons (foreground + ico)
        run: python make_icons.py

      - name: Flutter pub get
        working-directory: Frontend
        run: flutter pub get

      - name: Generate launcher icons (mipmap + AppIcon)
        working-directory: Frontend
        run: flutter pub run flutter_launcher_icons

      - name: Build Android APK (debug)
        working-directory: Frontend
        run: flutter build apk --debug

      - name: Verify csqtt-link in APK
        run: |
          set -euo pipefail
          APK=$(find Frontend/build/app/outputs/flutter-apk -name "app-debug.apk" -type f | head -n 1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -E 'libcsqtt-link|libclient-android|libopenflux' || true

      - name: Locate & rename APK
        id: find_apk
        run: |
          APK=$(find Frontend/build/app/outputs/flutter-apk -name "app-debug.apk" -type f | head -n 1)
          [ -z "$APK" ] && exit 1
          mkdir -p Output
          cp "$APK" Output/LaLune-Android.apk
          ls -la Output/LaLune-Android.apk
          echo "apk=Output/LaLune-Android.apk" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: Output-Android
          path: Output/LaLune-Android.apk
          if-no-files-found: error

  # ============================================================
  #  LaLuneTokenFetcher
  # ============================================================
  build-token-fetcher:
    name: "Token Fetcher - ${{ matrix.platform }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
          - platform: Linux
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Show dotnet version
        run: dotnet --info

      - name: Sanity check
        shell: bash
        run: ls -la Core/LaLuneTokenFetcher

      - name: Build fetcher
        run: python build_token_grabber.py --platform ${{ matrix.platform }}

      - name: Package into LaLuneTokenFetcher_<OS>.zip
        shell: bash
        run: |
          set -e
          OUTPUT_BIN="Core/LaLuneTokenFetcher/output/LaLuneTokenFetcher"
          ZIP_PATH="Core/LaLuneTokenFetcher/LaLuneTokenFetcher_${{ matrix.platform }}.zip"
          if [ ! -d "$OUTPUT_BIN" ]; then
            find Core/LaLuneTokenFetcher/output -maxdepth 2 -type d || true
            exit 1
          fi
          STAGING_DIR="Core/LaLuneTokenFetcher/output/_staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR/vk-token-fetcher"
          cp -r "$OUTPUT_BIN/." "$STAGING_DIR/vk-token-fetcher/"
          if [ "${{ matrix.platform }}" = "Linux" ]; then
            chmod +x "$STAGING_DIR/vk-token-fetcher/LaLuneTokenFetcher" || true
          fi
          rm -f "$ZIP_PATH"
          pushd "$STAGING_DIR" >/dev/null
          if [ "${{ matrix.platform }}" = "Windows" ]; then
            popd >/dev/null
            powershell -Command "Compress-Archive -Path 'Core/LaLuneTokenFetcher/output/_staging/vk-token-fetcher' -DestinationPath '$ZIP_PATH' -Force"
          else
            zip -r "../../LaLuneTokenFetcher_${{ matrix.platform }}.zip" "vk-token-fetcher"
            popd >/dev/null
          fi
          ls -la "$ZIP_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: LaLuneTokenFetcher-${{ matrix.platform }}
          path: Core/LaLuneTokenFetcher/LaLuneTokenFetcher_${{ matrix.platform }}.zip
          if-no-files-found: error

  # ============================================================
  #  Release
  # ============================================================
  create-release:
    name: Create Release
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - build-desktop-linux
      - build-desktop-windows
      - build-desktop-openwrt
      - build-android
      - build-token-fetcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Download each named artifact to a deterministic path. Do not flatten with
      # find/cp: that can silently select a stale duplicate with the same filename.
      - uses: actions/download-artifact@v4
        with:
          name: Output-Windows
          path: release/windows

      - uses: actions/download-artifact@v4
        with:
          name: Output-Linux
          path: release/linux

      - uses: actions/download-artifact@v4
        with:
          name: Output-Android
          path: release/android

      - uses: actions/download-artifact@v4
        with:
          name: Output-OpenWRT
          path: release/openwrt

      - uses: actions/download-artifact@v4
        with:
          name: LaLuneTokenFetcher-Windows
          path: release/token-fetcher-windows

      - uses: actions/download-artifact@v4
        with:
          name: LaLuneTokenFetcher-Linux
          path: release/token-fetcher-linux

      - name: Assemble and verify release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/assets
          cp release/windows/LaLune-Windows.zip release/assets/
          cp release/windows/Backend-Windows.zip release/assets/
          cp release/windows/Installer-Windows.zip release/assets/
          cp release/linux/LaLune-Linux.zip release/assets/
          cp release/linux/Backend-Linux.zip release/assets/
          cp release/openwrt/lalune-openwrt-backend release/assets/
          cp release/android/LaLune-Android.apk release/assets/
          cp release/token-fetcher-windows/LaLuneTokenFetcher_Windows.zip release/assets/
          cp release/token-fetcher-linux/LaLuneTokenFetcher_Linux.zip release/assets/

          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          root = Path("release/assets")
          installer_zip = root / "Installer-Windows.zip"
          with zipfile.ZipFile(installer_zip) as archive:
              names = archive.namelist()
              exe_names = [n for n in names if n.lower().endswith("lalune-installer.exe")]
              if len(exe_names) != 1:
                  raise SystemExit(f"Expected exactly one installer EXE in {installer_zip}, found: {exe_names}")
              data = archive.read(exe_names[0])
              marker = b"csqtt-219.exe"
              if marker not in data:
                  raise SystemExit("Installer EXE does not embed csqtt-219.exe; refusing to publish stale/broken installer")
              print(f"Verified installer: {exe_names[0]}, {len(data)} bytes, sha256={hashlib.sha256(data).hexdigest()}")
          for path in sorted(root.iterdir()):
              print(f"{path.name}: {path.stat().st_size} bytes, sha256={hashlib.sha256(path.read_bytes()).hexdigest()}")
          PY
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.stable_version }}"
            if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
              echo "Stable version must look like 0.9 or 0.9.1, without a commit hash." >&2
              exit 1
            fi
            PRERELEASE=false
          else
            STABLE="$(tr -d '\r\n' < STABLE)"
            if [[ ! "$STABLE" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
              echo "STABLE must contain a version such as 0.9." >&2
              exit 1
            fi
            SHORT_SHA="$(git rev-parse --short=7 HEAD)"
            VERSION="${STABLE}-${SHORT_SHA}"
            PRERELEASE=true
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION (prerelease=$PRERELEASE)"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LaLune ${{ steps.version.outputs.tag }}
          files: |
            release/assets/LaLune-Windows.zip
            release/assets/Backend-Windows.zip
            release/assets/Installer-Windows.zip
            release/assets/LaLune-Linux.zip
            release/assets/Backend-Linux.zip
            release/assets/lalune-openwrt-backend
            release/assets/LaLune-Android.apk
            release/assets/LaLuneTokenFetcher_Windows.zip
            release/assets/LaLuneTokenFetcher_Linux.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update STABLE after manual release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.stable_version }}"
          BRANCH="$GITHUB_REF_NAME"
          CONTENT="$(printf '%s\n' "$VERSION" | base64 -w 0)"
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/STABLE?ref=$BRANCH" --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/contents/STABLE" \
            -X PUT \
            -f message="chore: update STABLE to $VERSION [skip ci]" \
            -f content="$CONTENT" \
            -f sha="$SHA" \
            -f branch="$BRANCH" >/dev/null
          echo "STABLE updated to $VERSION on $BRANCH"
