#
# Сборка LaLune-owrt_aarch64 для OpenWRT.
#
# Использует официальный OpenWRT SDK:
#   openwrt-sdk-25.12.5-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst
#
# Артефакт: LaLune-owrt_aarch64 (в релизе — именно так).

name: Build OpenWRT

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go (для сборки бинарника)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Скачивание OpenWRT SDK
        run: |
          set -e
          SDK_URL="https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/openwrt-sdk-25.12.5-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          echo "Downloading $SDK_URL"
          curl -fsSL -o sdk.tar.zst "$SDK_URL"
          mkdir -p sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          ls -la sdk/
          ls -la sdk/staging_dir/toolchain-aarch64_cortex-a53_gcc-14.3.0_musl/bin/ | head -20

      - name: Сборка бинарника через SDK-тулчейн
        run: |
          set -e
          SDK="$GITHUB_WORKSPACE/sdk"
          TOOLCHAIN="$SDK/staging_dir/toolchain-aarch64_cortex-a53_gcc-14.3.0_musl"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export STAGING_DIR="$SDK/staging_dir"
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=arm64
          export GOARM=8
          export CC=aarch64-openwrt-linux-gcc
          export CXX=aarch64-openwrt-linux-g++
          export AR=aarch64-openwrt-linux-ar
          export LD=aarch64-openwrt-linux-ld

          cd OpenWRT
          go mod tidy
          go build -ldflags="-s -w" -o ../LaLune-owrt_aarch64 .
          cd ..

          file LaLune-owrt_aarch64
          ls -la LaLune-owrt_aarch64

      - name: Сборка фронтенда для OpenWRT
        run: |
          set -e
          # Установка Flutter (или можно использовать предварительно собранный output)
          if [ -d "Frontend/output" ] && [ -f "Frontend/output/index.html" ]; then
            echo "Использую готовый Frontend/output"
          else
            echo "Flutter не установлен — пропускаю сборку фронта"
          fi

      - name: Упаковка артефакта
        run: |
          set -e
          mkdir -p dist
          cp LaLune-owrt_aarch64 dist/
          cp OpenWRT/lalune-owrt-install.sh dist/
          chmod +x dist/lalune-owrt-install.sh
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-OpenWRT-aarch64
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LaLune-owrt_aarch64
            dist/lalune-owrt-install.sh
