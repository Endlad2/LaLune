name: Build OpenWRT

on:
  push:
    branches:
      - main
      - release
    paths:
      - 'OpenWRT/**'
      - '.github/workflows/build-openwrt.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "RouteRich 24.10.8 r29233-443ec4032a RR-3.12.1"
            short_name: "RouteRich"
            rust_target: "aarch64-unknown-linux-musl"

    name: "Build - ${{ matrix.name }}"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity check
        run: |
          echo "--- OpenWRT ---"
          ls -la "$GITHUB_WORKSPACE/OpenWRT"
          echo "--- src ---"
          ls -la "$GITHUB_WORKSPACE/OpenWRT/src"
          echo "--- Cargo.toml ---"
          cat "$GITHUB_WORKSPACE/OpenWRT/Cargo.toml"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build owrt-client
        working-directory: OpenWRT
        run: |
          cross build --release --target ${{ matrix.rust_target }}
          ls -la target/${{ matrix.rust_target }}/release/

      - name: Verify binary
        working-directory: OpenWRT
        run: |
          BIN="target/${{ matrix.rust_target }}/release/owrt-client"
          file "$BIN"
          ls -la "$BIN"
          # Проверяем, что это статический ELF под ARM64
          file "$BIN" | grep -q "ARM aarch64" || {
            echo "Binary is not ARM64!"
            exit 1
          }

      - name: Prepare release package
        working-directory: OpenWRT
        run: |
          BIN="target/${{ matrix.rust_target }}/release/owrt-client"
          OUT="/tmp/owrt-client-${{ matrix.short_name }}"
          mkdir -p "$OUT"
          cp "$BIN" "$OUT/owrt-client"
          cp README.md "$OUT/README.md"

          cat > "$OUT/config.example" <<'EOF'
# Скопируй в `config` (без .example) рядом с бинарником.
# Замени на свою csqtt:// ссылку.
csqtt://connect?v=2&host=31.77.148.203&peer=46000&password=ЗАМЕНИ&hashes=hash1+hash2+hash3
EOF

          ls -la "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-OpenWRT-${{ matrix.short_name }}
          path: /tmp/owrt-client-${{ matrix.short_name }}/
          if-no-files-found: error
