name: Build OpenWRT

on:
  push:
    branches:
      - main
      - release
    paths:
      - 'OpenWRT/**'
      - '.github/workflows/build-openwrt.yml'
  workflow_dispatch:

# Только артефакты, никаких релизов.
# permissions не нужны, кроме дефолтных read для checkout.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ─────────────────────────────────────────────────────────
          # RouteRich — кастомная сборка на базе OpenWRT 24.10.
          # DISTRIB_ID='RouteRich'
          # DISTRIB_DESCRIPTION='RouteRich 24.10.8 r29233-443ec4032a RR-3.12.1'
          # DISTRIB_TARGET='mediatek/filogic'
          # DISTRIB_ARCH='aarch64_cortex-a53'
          # ─────────────────────────────────────────────────────────
          - name: "RouteRich 24.10.8 r29233-443ec4032a RR-3.12.1"
            short_name: "RouteRich"
            target: "mediatek/filogic"
            openwrt_version: "24.10.8"
            sdk_arch: "aarch64_cortex-a53"

    name: "Build - ${{ matrix.name }}"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools \
            python3-dev rsync subversion swig time xsltproc zlib1g-dev unzip wget

      - name: Download OpenWRT SDK
        run: |
          SDK_BASE="https://downloads.openwrt.org/releases/${{ matrix.openwrt_version }}/targets/${{ matrix.target }}"
          SDK_FILE="openwrt-sdk-${{ matrix.openwrt_version }}-${{ matrix.target }}-*_gcc-*_musl.Linux-x86_64.tar.zst"
          echo "Looking for SDK in ${SDK_BASE}"

          # Скачиваем index страницы и выдёргиваем имя файла SDK
          wget -q -O /tmp/sdk-index.html "${SDK_BASE}/" || {
            echo "Cannot fetch ${SDK_BASE}/"
            exit 1
          }

          SDK_URL=$(grep -oE 'openwrt-sdk-[^"]+Linux-x86_64\.tar\.zst' /tmp/sdk-index.html | head -n 1)
          if [ -z "$SDK_URL" ]; then
            echo "SDK archive not found in ${SDK_BASE}/"
            grep -oE 'openwrt-sdk-[^"]+' /tmp/sdk-index.html | head
            exit 1
          fi

          echo "Downloading ${SDK_BASE}/${SDK_URL}"
          wget -q "${SDK_BASE}/${SDK_URL}" -O /tmp/sdk.tar.zst

          mkdir -p /opt/sdk
          tar --use-compress-program=unzstd -xf /tmp/sdk.tar.zst -C /opt/sdk
          SDK_DIR=$(find /opt/sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
          echo "SDK extracted to $SDK_DIR"

      - name: Place LaLune packages into SDK
        run: |
          cd "$SDK_DIR"

          mkdir -p package/lalune package/luci-app-lalune

          # ── lalune (Go-демон) ──
          # Makefile и files/ — в корне пакета, .go — в src/
          cp OpenWRT/lalune/Makefile            package/lalune/Makefile
          mkdir -p package/lalune/files
          cp -r OpenWRT/lalune/files/*          package/lalune/files/
          mkdir -p package/lalune/src
          cp OpenWRT/lalune/*.go                package/lalune/src/ 2>/dev/null || true
          cp OpenWRT/lalune/go.mod              package/lalune/src/ 2>/dev/null || true

          # Проверим что получилось
          echo "--- package/lalune ---"
          find package/lalune -type f
          echo "--- package/luci-app-lalune ---"
          cp -r OpenWRT/luci-app-lalune/*       package/luci-app-lalune/
          find package/luci-app-lalune -type f

      - name: Update and install feeds
        run: |
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build
        run: |
          cd "$SDK_DIR"

          # Включаем оба пакета
          make defconfig

          # Прописываем пакеты как модули в .config
          echo "CONFIG_PACKAGE_lalune=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-lalune=m" >> .config

          make defconfig

          # Проверка, что пакеты видны
          grep -E 'CONFIG_PACKAGE_(lalune|luci-app-lalune)' .config || {
            echo "Packages not found in .config!"
            exit 1
          }

      - name: Build lalune
        run: |
          cd "$SDK_DIR"
          make package/lalune/compile V=s -j$(nproc) 2>&1 | tail -200

      - name: Build luci-app-lalune
        run: |
          cd "$SDK_DIR"
          make package/luci-app-lalune/compile V=s -j$(nproc) 2>&1 | tail -200

      - name: Collect .ipk files
        run: |
          cd "$SDK_DIR"
          mkdir -p /tmp/out
          find bin/ -name 'lalune_*.ipk' -exec cp {} /tmp/out/ \;
          find bin/ -name 'luci-app-lalune_*.ipk' -exec cp {} /tmp/out/ \;
          ls -la /tmp/out/

      - name: Upload OpenWRT artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-OpenWRT-${{ matrix.short_name }}
          path: /tmp/out/*.ipk
          if-no-files-found: error
