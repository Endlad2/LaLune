name: Build OpenWRT

on:
  push:
    branches:
      - main
      - release
    paths:
      - 'OpenWRT/**'
      - '.github/workflows/build-openwrt.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "RouteRich 24.10.8 r29233-443ec4032a RR-3.12.1"
            short_name: "RouteRich"
            target: "mediatek/filogic"
            openwrt_version: "24.10.8"

    name: "Build - ${{ matrix.name }}"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity check — исходники LaLune на месте
        run: |
          echo "--- ls $GITHUB_WORKSPACE/OpenWRT/lalune ---"
          ls -la "$GITHUB_WORKSPACE/OpenWRT/lalune"

          echo "--- go.mod ---"
          cat "$GITHUB_WORKSPACE/OpenWRT/lalune/go.mod" || { echo "go.mod missing!"; exit 1; }

          echo "--- go.sum ---"
          cat "$GITHUB_WORKSPACE/OpenWRT/lalune/go.sum" || {
            echo "go.sum MISSING in repo! Сгенерируй его командой 'cd OpenWRT/lalune && go mod tidy' и закоммить."
            exit 1
          }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools \
            python3-dev rsync subversion swig time xsltproc zlib1g-dev unzip wget zstd

      - name: Download OpenWRT SDK
        run: |
          SDK_BASE="https://downloads.openwrt.org/releases/${{ matrix.openwrt_version }}/targets/${{ matrix.target }}"
          echo "Looking for SDK in ${SDK_BASE}"

          wget -q -O /tmp/sdk-index.html "${SDK_BASE}/" || {
            echo "Cannot fetch ${SDK_BASE}/"
            exit 1
          }

          SDK_FILE=$(grep -oE 'openwrt-sdk-[^"]+Linux-x86_64\.tar\.zst' /tmp/sdk-index.html | head -n 1)
          if [ -z "$SDK_FILE" ]; then
            echo "SDK archive not found in ${SDK_BASE}/"
            grep -oE 'openwrt-sdk-[^"]+' /tmp/sdk-index.html | head
            exit 1
          fi

          echo "Downloading ${SDK_BASE}/${SDK_FILE}"
          wget -q "${SDK_BASE}/${SDK_FILE}" -O /tmp/sdk.tar.zst

          mkdir -p /opt/sdk
          tar --use-compress-program=unzstd -xf /tmp/sdk.tar.zst -C /opt/sdk
          SDK_DIR=$(find /opt/sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
          echo "SDK extracted to $SDK_DIR"

      - name: Place LaLune packages into SDK
        run: |
          SRC="$GITHUB_WORKSPACE/OpenWRT"
          DST="$SDK_DIR/package"

          # ── lalune (Go-демон) ──
          mkdir -p "$DST/lalune/files"
          mkdir -p "$DST/lalune/src"

          cp "$SRC/lalune/Makefile" "$DST/lalune/Makefile"
          cp -r "$SRC/lalune/files/." "$DST/lalune/files/"

          # Go-исходники: go.mod + go.sum + все .go
          cp "$SRC/lalune/"*.go   "$DST/lalune/src/"
          cp "$SRC/lalune/go.mod" "$DST/lalune/src/"
          cp "$SRC/lalune/go.sum" "$DST/lalune/src/"

          # ── luci-app-lalune ──
          mkdir -p "$DST/luci-app-lalune"
          cp -r "$SRC/luci-app-lalune/." "$DST/luci-app-lalune/"

          echo "--- package/lalune ---"
          find "$DST/lalune" -type f | sort
          echo "--- package/luci-app-lalune ---"
          find "$DST/luci-app-lalune" -type f | sort

      - name: Update and install feeds
        run: |
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build
        run: |
          cd "$SDK_DIR"

          make defconfig

          echo "CONFIG_PACKAGE_lalune=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-lalune=m" >> .config

          make defconfig

          grep -E 'CONFIG_PACKAGE_(lalune|luci-app-lalune)' .config || {
            echo "Packages not found in .config!"
            exit 1
          }

      - name: Build lalune
        run: |
          cd "$SDK_DIR"
          make package/lalune/compile V=s -j$(nproc) 2>&1 | tail -300

      - name: Build luci-app-lalune
        run: |
          cd "$SDK_DIR"
          make package/luci-app-lalune/compile V=s -j$(nproc) 2>&1 | tail -300

      - name: Collect .ipk files
        run: |
          cd "$SDK_DIR"
          mkdir -p /tmp/out
          find bin/ -name 'lalune_*.ipk' -exec cp {} /tmp/out/ \; || true
          find bin/ -name 'luci-app-lalune_*.ipk' -exec cp {} /tmp/out/ \; || true

          if [ -z "$(ls -A /tmp/out)" ]; then
            echo "No .ipk files produced!"
            exit 1
          fi
          ls -la /tmp/out/

      - name: Upload OpenWRT artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-OpenWRT-${{ matrix.short_name }}
          path: /tmp/out/*.ipk
          if-no-files-found: error
