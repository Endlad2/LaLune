name: Build OpenWRT ARM64

on:
  push:
    branches: [main, release]
    paths:
      - 'Backend/OpenWRT/**'
      - 'Backend/linux_core.rs'
      - 'Backend/linux_tun.rs'
      - 'Core/csqtt-link/**'
      - '.github/workflows/build-openwrt.yml'
  workflow_dispatch:

jobs:
  build-arm64:
    name: OpenWRT ARM64 + bundled cores
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Install build/runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl zstd zip unzip cmake jq qemu-user binutils
      - name: Build backend and all three cores
        working-directory: Backend/OpenWRT
        run: bash build.sh
      - name: Smoke test
        working-directory: Backend/OpenWRT
        run: |
          set -euo pipefail
          unzip -t output/lalune-openwrt-cores-aarch64.zip
          test_home=$(mktemp -d)
          qemu-aarch64 -E HOME="$test_home" output/lalune-openwrt-backend >"$test_home/backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true; wait "$backend_pid" || true; cat "$test_home/backend.log"; rm -rf "$test_home"' EXIT
          for attempt in {1..30}; do
            if curl -fsS -o "$test_home/ping.json" http://127.0.0.1:1062/ping; then break; fi
            kill -0 "$backend_pid"
            sleep 1
          done
          jq -e '.ok and .arch == "aarch64" and .platform == "openwrt"' "$test_home/ping.json"
          curl -fsS http://127.0.0.1:1062/core/protocols | jq -e \
            'all(.[]; .bundled == true) and (map(.id) | sort == ["CSQTT", "CSQTT 2.1.9", "CSQTTR"])'
      - uses: actions/upload-artifact@v4
        with:
          name: LaLune-OpenWRT-ARM64
          path: |
            Backend/OpenWRT/output/lalune-openwrt-backend
            Backend/OpenWRT/output/lalune-openwrt-cores-aarch64.zip
          if-no-files-found: error
          compression-level: 0
