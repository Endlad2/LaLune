name: Build iOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ios:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            Backend/target/
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ios-
            ${{ runner.os }}-cargo-

      # ---------- Rust Backend (TUN) for iOS ----------
      - name: Build Rust Backend for iOS (device arm64)
        working-directory: Backend
        run: cargo build --release --target aarch64-apple-ios

      - name: Build Rust Backend for iOS (sim arm64)
        working-directory: Backend
        run: cargo build --release --target aarch64-apple-ios-sim

      - name: Build Rust Backend for iOS (sim x86_64)
        working-directory: Backend
        run: cargo build --release --target x86_64-apple-ios

      - name: Create universal simulator static lib
        run: |
          mkdir -p /tmp/ios-sim
          lipo -create \
            Backend/target/aarch64-apple-ios-sim/release/liblalune_backend.a \
            Backend/target/x86_64-apple-ios/release/liblalune_backend.a \
            -output /tmp/ios-sim/liblalune_backend.a

      - name: Assemble iOS backend lib
        run: |
          mkdir -p Frontend/Core/ios/Backend
          cp Backend/target/aarch64-apple-ios/release/liblalune_backend.a \
             Frontend/Core/ios/Backend/liblalune_backend_device.a
          cp /tmp/ios-sim/liblalune_backend.a \
             Frontend/Core/ios/Backend/liblalune_backend_sim.a

      # ---------- SmartTunnel ----------
      - name: Prepare SmartTunnel
        run: python3 prepare_st.py --platform=Android || true

      # ---------- Flutter iOS ----------
      - name: Flutter pub get
        working-directory: Frontend/Core
        run: flutter pub get

      - name: Flutter build iOS (no codesign)
        working-directory: Frontend/Core
        run: flutter build ios --release --no-codesign

      # ---------- Package unsigned IPA ----------
      - name: Create unsigned IPA
        run: |
          cd Frontend/Core/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r LaLune-iOS-unsigned.ipa Payload
          mv LaLune-iOS-unsigned.ipa "$GITHUB_WORKSPACE/"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-iOS-unsigned
          path: LaLune-iOS-unsigned.ipa
          retention-days: 30
