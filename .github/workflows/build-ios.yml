name: Build LaLune (iOS, native UI)

# Native Flutter iOS app + Rust Backend (Backend/) compiled as a static library for iOS.
# Replaces the legacy build that targeted the removed Mobile/IOS layout and the web UI.

on:
  push:
    branches:
      - main
      - release
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FLUTTER_CHANNEL: stable
  IOS_TARGET: aarch64-apple-ios
  IOS_SIM_TARGET: aarch64-apple-ios-sim

jobs:
  ios:
    name: iOS app (device + simulator)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Backend/target
          key: ${{ runner.os }}-cargo-ios-${{ hashFiles('Backend/Cargo.lock', 'Backend/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-ios-

      - name: Build Rust Backend (iOS device)
        working-directory: Backend
        run: |
          set -eux
          cargo build --release --target ${{ env.IOS_TARGET }}
          ls -la target/${{ env.IOS_TARGET }}/release/*.a

      - name: Build Rust Backend (iOS simulator)
        working-directory: Backend
        run: |
          set -eux
          cargo build --release --target ${{ env.IOS_SIM_TARGET }} || \
            cargo build --release --target x86_64-apple-ios
          ls -la target/*/release/*.a || true

      - name: Create universal static library
        working-directory: Backend
        run: |
          set -eux
          mkdir -p build/ios
          DEV=target/${{ env.IOS_TARGET }}/release/liblalune_backend.a
          SIM=target/${{ env.IOS_SIM_TARGET }}/release/liblalune_backend.a
          if [ -f "$SIM" ] && [ -f "$DEV" ]; then
            lipo -create "$DEV" "$SIM" -output build/ios/liblalune_backend.a
          elif [ -f "$DEV" ]; then
            cp "$DEV" build/ios/liblalune_backend.a
          fi
          ls -la build/ios

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter pub get
        working-directory: Frontend/Core
        run: flutter pub get

      - name: Flutter build iOS (no codesign)
        working-directory: Frontend/Core
        run: flutter build ios --release --no-codesign

      - name: Embed Rust backend into iOS bundle
        run: |
          set -eux
          RUNNER=$(find Frontend/Core/build/ios -maxdepth 3 -type d -name 'Runner.app' | head -n1)
          echo "Runner.app: $RUNNER"
          if [ -n "$RUNNER" ]; then
            mkdir -p "$RUNNER/Frameworks"
            cp Backend/build/ios/liblalune_backend.a "$RUNNER/Frameworks/" || true
            ls -la "$RUNNER" || true
          fi

      - name: Package iOS artifact
        run: |
          set -eux
          mkdir -p /tmp/pkg
          RUNNER=$(find Frontend/Core/build/ios -maxdepth 3 -type d -name 'Runner.app' | head -n1)
          cp -r "$RUNNER" /tmp/pkg/Runner.app
          cp Backend/build/ios/liblalune_backend.a /tmp/pkg/liblalune_backend.a || true
          (cd /tmp/pkg && zip -r LaLune-iOS.zip .)

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-iOS
          path: /tmp/pkg/LaLune-iOS.zip
          if-no-files-found: error