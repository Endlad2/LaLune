# .github/workflows/build-ios.yml
#
# Сборка LaLune под iOS.
#
# Порядок шагов важен:
#   1. Xcode и инструменты
#   2. Flutter web-фронтенд (build_frontend.py --platform IOS)
#   3. libcsqtt_ios_core.a  →  Mobile/IOS/Core/
#   4. xcodegen generate
#   5. xcodebuild archive (unsigned)
#   6. упаковка Payload/ → LaLune.ipa
#   7. артефакт (+ релиз на теге v*)
#
# libcsqtt_ios_core.a качается ДО xcodegen generate — если xcodegen
# начнёт проверять существование зависимости, файл уже на месте.
# Но по факту линковка идёт через OTHER_LDFLAGS + LIBRARY_SEARCH_PATHS,
# так что генератору файл не нужен, нужен только линкеру на шаге 5.

name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  # Фиксируем Xcode: macos-14 содержит Xcode 15.4 и 16.x.
  # objectVersion=56 в project.yml совместим с обоими, но лучше
  # не зависеть от того, какой именно подхватится по умолчанию.
  XCODE_APP: /Applications/Xcode_15.4.app
  CSQTT_IOS_CORE_URL: https://github.com/Endlad2/csqtt-core/releases/latest/download/libcsqtt_ios_core.a

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Инструменты ──────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Select Xcode
        run: |
          set -e
          if [ ! -d "$XCODE_APP" ]; then
            echo "::warning::$XCODE_APP not found, available Xcodes:"
            ls -1 /Applications | grep -i '^Xcode' || true
            echo "::warning::falling back to default xcode-select"
          else
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version
          xcode-select -p

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      # ── Фронтенд ─────────────────────────────────────────────
      - name: Build Flutter web frontend (iOS)
        run: python build_frontend.py --platform IOS

      - name: Verify frontend artifacts
        run: |
          set -e
          for f in index.html app.html api.js flutter_bootstrap.js; do
            if [ ! -f "Frontend/output/$f" ]; then
              echo "::error::missing Frontend/output/$f"
              ls -la Frontend/output/ || true
              exit 1
            fi
          done
          echo "Frontend/output contents:"
          ls -la Frontend/output/

      # ── Нативное ядро ────────────────────────────────────────
      - name: Download CSQTT iOS core
        working-directory: Mobile/IOS/Core
        run: |
          set -e
          echo "Downloading: $CSQTT_IOS_CORE_URL"
          curl -fL --retry 3 --retry-delay 2 \
            -o libcsqtt_ios_core.a "$CSQTT_IOS_CORE_URL"
          ls -la libcsqtt_ios_core.a
          file libcsqtt_ios_core.a || true
          lipo -info libcsqtt_ios_core.a || true

      # ── Xcode-проект ─────────────────────────────────────────
      - name: Generate Xcode project
        working-directory: Mobile/IOS
        run: |
          set -e
          xcodegen generate
          # Убеждаемся, что сгенерирован именно старый формат pbxproj.
          grep -q 'objectVersion = 56' LaLune.xcodeproj/project.pbxproj \
            || { echo "::error::unexpected objectVersion in project.pbxproj"; \
                 grep -m1 objectVersion LaLune.xcodeproj/project.pbxproj || true; \
                 exit 1; }

      # ── Архив ────────────────────────────────────────────────
      - name: Archive (unsigned)
        working-directory: Mobile/IOS
        run: |
          set -e
          xcodebuild archive \
            -project LaLune.xcodeproj \
            -scheme LaLune \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LaLune.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      # ── Упаковка IPA ─────────────────────────────────────────
      - name: Package unsigned IPA
        working-directory: Mobile/IOS
        run: |
          set -e
          APP="build/LaLune.xcarchive/Products/Applications/LaLune.app"

          if [ ! -d "$APP" ]; then
            echo "::error::app bundle not found: $APP"
            find build -maxdepth 6 -type d || true
            exit 1
          fi

          # Страховка: postBuildScripts из project.yml должен был
          # положить фронтенд в корень бандла.
          for f in app.html api.js flutter_bootstrap.js; do
            if [ ! -f "$APP/$f" ]; then
              echo "::error::$f not embedded into the app bundle"
              ls -la "$APP" || true
              exit 1
            fi
          done

          rm -rf build/Payload build/LaLune.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/LaLune.app

          ( cd build && zip -qry LaLune.ipa Payload )

          ls -la build/LaLune.ipa

      # ── Артефакты ────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-iOS-unsigned
          path: Mobile/IOS/build/LaLune.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Mobile/IOS/build/LaLune.ipa
          fail_on_unmatched_files: true
