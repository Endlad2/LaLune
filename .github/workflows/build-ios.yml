# .github/workflows/build-ios.yml
#
# Сборка LaLune под iOS (Flutter native + Swift backend).
#
# Порядок шагов:
#   1. Xcode и инструменты
#   2. Backend/iOS/*.swift  →  Frontend/ios/Runner/
#   3. libcsqtt_ios_core.a  →  Mobile/IOS/Core/  (через build.py? нет — вручную)
#   4. xcodegen generate
#   5. xcodebuild archive (unsigned)
#   6. упаковка Payload/ → LaLune.ipa
#   7. артефакт

name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  XCODE_APP: /Applications/Xcode_15.4.app
  CSQTT_IOS_CORE_URL: https://github.com/Endlad2/csqtt-core/releases/latest/download/libcsqtt_ios_core.a

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Инструменты ─────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select Xcode
        run: |
          set -e
          if [ ! -d "$XCODE_APP" ]; then
            echo "::warning::$XCODE_APP not found, available Xcodes:"
            ls -1 /Applications | grep -i '^Xcode' || true
            echo "::warning::falling back to default xcode-select"
          else
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version
          xcode-select -p

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      # ── Копируем Swift-бэкенд в iOS runner ──────────────────
      # В новой архитектуре бэкенд — Backend/iOS/*.swift.
      # Кладём их в Frontend/ios/Runner/ (основной target),
      # а PacketTunnelProvider — в отдельный target (создаём в Xcode).
      - name: Copy iOS backend sources
        run: |
          set -e
          mkdir -p Frontend/ios/Runner
          cp Backend/iOS/Backend.swift        Frontend/ios/Runner/
          cp Backend/iOS/HttpServer.swift     Frontend/ios/Runner/
          cp Backend/iOS/CoreManager.swift    Frontend/ios/Runner/
          cp Backend/iOS/VkWebViewController.swift Frontend/ios/Runner/

          # PacketTunnelProvider — в отдельный target (создаётся ниже).
          mkdir -p Frontend/ios/Tunnel
          cp Backend/iOS/PacketTunnelProvider.swift Frontend/ios/Tunnel/

          echo "Runner sources:"
          ls -la Frontend/ios/Runner/
          echo "Tunnel sources:"
          ls -la Frontend/ios/Tunnel/

      # ── Копируем Assets → Frontend/assets ───────────────────
      - name: Copy assets
        run: |
          set -e
          rm -rf Frontend/assets
          cp -r Assets Frontend/assets

      # ── Flutter pub get ─────────────────────────────────────
      - name: Flutter pub get
        working-directory: Frontend
        run: flutter pub get

      # ── Нативное ядро CSQTT ─────────────────────────────────
      - name: Download CSQTT iOS core
        working-directory: Frontend/ios/Core
        run: |
          set -e
          mkdir -p .
          echo "Downloading: $CSQTT_IOS_CORE_URL"
          curl -fL --retry 3 --retry-delay 2 \
            -o libcsqtt_ios_core.a "$CSQTT_IOS_CORE_URL"
          ls -la libcsqtt_ios_core.a
          file libcsqtt_ios_core.a || true
          lipo -info libcsqtt_ios_core.a || true

      # ── Генерация Xcode-проекта ─────────────────────────────
      # project.yml в Frontend/ios/ должен быть — его создаёт
      # flutter create, но там по умолчанию нет Tunnel extension.
      # Наш Frontend/ios/project.yml (или xcodeproj/project.pbxproj)
      # должен включать оба target'а.
      - name: Generate Xcode project
        working-directory: Frontend/ios
        run: |
          set -e
          if [ ! -f project.yml ]; then
            echo "::error::Frontend/ios/project.yml not found"
            echo "Add project.yml with Runner + Tunnel targets."
            exit 1
          fi

          xcodegen generate

          PBX=Runner.xcodeproj/project.pbxproj
          if [ ! -f "$PBX" ]; then
            echo "::error::$PBX not found after xcodegen"
            find . -name project.pbxproj || true
            exit 1
          fi

          echo "objectVersion after xcodegen:"
          grep -m1 'objectVersion' "$PBX" || true

          # XcodeGen может записать 77 (формат Xcode 16), который Xcode 15.4
          # не читает. Патчим на 56 (формат Xcode 14).
          if grep -q 'objectVersion = 77;' "$PBX"; then
            echo "note: downgrading objectVersion 77 -> 56"
            sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' "$PBX"
          fi

          FINAL=$(grep -m1 'objectVersion' "$PBX" || true)
          echo "objectVersion final: $FINAL"
          echo "$FINAL" | grep -q '56' \
            || { echo "::error::objectVersion is not 56 — Xcode 15.4 won't open"; exit 1; }

      # ── Архив (unsigned) ────────────────────────────────────
      - name: Archive (unsigned)
        working-directory: Frontend/ios
        run: |
          set -e
          xcodebuild archive \
            -project Runner.xcodeproj \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LaLune.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      # ── Упаковка IPA ────────────────────────────────────────
      - name: Package unsigned IPA
        working-directory: Frontend/ios
        run: |
          set -e
          APP="build/LaLune.xcarchive/Products/Applications/Runner.app"
          if [ ! -d "$APP" ]; then
            # Имя бандла — из PRODUCT_NAME. Может быть LaLune.app.
            APP="build/LaLune.xcarchive/Products/Applications/LaLune.app"
          fi

          if [ ! -d "$APP" ]; then
            echo "::error::app bundle not found"
            find build -maxdepth 6 -type d || true
            exit 1
          fi

          rm -rf build/Payload build/LaLune.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/LaLune.app

          ( cd build && zip -qry LaLune.ipa Payload )

          ls -la build/LaLune.ipa

      # ── Артефакты ───────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-iOS-unsigned
          path: Frontend/ios/build/LaLune.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Frontend/ios/build/LaLune.ipa
          fail_on_unmatched_files: true
