name: iOS сборка

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:
    inputs:
      build_config:
        description: 'Тип сборки'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build-ios:
    name: Сборка iOS приложения
    runs-on: macos-latest
    
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      - name: Установка XcodeGen
        run: |
          brew install xcodegen
          
      - name: Генерация Xcode проекта
        run: |
          cd Mobile/IOS
          xcodegen generate
          
      - name: Сборка .app бандла
        run: |
          cd Mobile/IOS
          
          CONFIG="${{ github.event.inputs.build_config || 'Release' }}"
          
          xcodebuild \
            -project LaLune.xcodeproj \
            -scheme LaLune \
            -configuration $CONFIG \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Создание неподписанного .ipa
        run: |
          cd Mobile/IOS
          
          mkdir -p build/Payload
          
          cp -R "build/Release-iphoneos/LaLune.app" "build/Payload/"
          
          cd build
          zip -r LaLune.ipa Payload/

      - name: Загрузка .ipa артефакта
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-iOS-${{ github.sha }}
          path: Mobile/IOS/build/LaLune.ipa
          if-no-files-found: error
