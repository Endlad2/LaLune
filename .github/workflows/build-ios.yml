# .github/workflows/build-ios.yml
#
# Сборка LaLune под iOS.
#
# Что делает:
#   1. Ставит Python и Flutter.
#   2. Собирает Flutter web-фронтенд под IOS
#      (python build_frontend.py --platform IOS) — получаем
#      Frontend/output/{app.html,index.html,api.js,flutter_bootstrap.js,assets/...}.
#   3. Качает libcsqtt_ios_core.a из релизов csqtt-core.
#   4. Генерирует Xcode-проект через xcodegen (Mobile/IOS/project.yml).
#   5. Делает unsigned-архив (CODE_SIGNING_ALLOWED=NO).
#   6. Упаковывает IPA вручную (Payload/ → zip) — годится для
#      AltStore / Scarlet / Sideloadly.
#   7. Заливает артефакт; на теге v* прикрепляет IPA к GitHub Release.

name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  CSQTT_IOS_CORE_URL: https://github.com/Endlad2/csqtt-core/releases/latest/download/libcsqtt_ios_core.a

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Инструменты ──────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Xcode version
        run: xcodebuild -version

      # ── Фронтенд ─────────────────────────────────────────────
      - name: Build Flutter web frontend (iOS)
        run: python build_frontend.py --platform IOS

      - name: Verify frontend artifacts
        run: |
          set -e
          for f in index.html app.html api.js flutter_bootstrap.js; do
            if [ ! -f "Frontend/output/$f" ]; then
              echo "::error::missing Frontend/output/$f"
              ls -la Frontend/output/ || true
              exit 1
            fi
          done
          echo "Frontend/output contents:"
          ls -la Frontend/output/

      # ── Нативное ядро ────────────────────────────────────────
      - name: Download CSQTT iOS core
        working-directory: Mobile/IOS/Core
        run: |
          set -e
          echo "Downloading: $CSQTT_IOS_CORE_URL"
          curl -fL --retry 3 --retry-delay 2 \
            -o libcsqtt_ios_core.a "$CSQTT_IOS_CORE_URL"
          ls -la libcsqtt_ios_core.a
          file libcsqtt_ios_core.a || true
          lipo -info libcsqtt_ios_core.a || true

      # ── Xcode-проект ─────────────────────────────────────────
      - name: Generate Xcode project
        working-directory: Mobile/IOS
        run: xcodegen generate

      # ── Архив ────────────────────────────────────────────────
      - name: Archive (unsigned)
        working-directory: Mobile/IOS
        run: |
          set -e
          xcodebuild archive \
            -project LaLune.xcodeproj \
            -scheme LaLune \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LaLune.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      # ── Упаковка IPA ─────────────────────────────────────────
      - name: Package unsigned IPA
        working-directory: Mobile/IOS
        run: |
          set -e
          APP="build/LaLune.xcarchive/Products/Applications/LaLune.app"

          if [ ! -d "$APP" ]; then
            echo "::error::app bundle not found: $APP"
            find build -maxdepth 6 -type d || true
            exit 1
          fi

          # Страховка: postBuildScripts из project.yml должен был
          # положить фронтенд в корень бандла.
          for f in app.html api.js flutter_bootstrap.js; do
            if [ ! -f "$APP/$f" ]; then
              echo "::error::$f not embedded into the app bundle"
              ls -la "$APP" || true
              exit 1
            fi
          done

          rm -rf build/Payload build/LaLune.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/LaLune.app

          ( cd build && zip -qry LaLune.ipa Payload )

          ls -la build/LaLune.ipa

      # ── Артефакты ────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-iOS-unsigned
          path: Mobile/IOS/build/LaLune.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Mobile/IOS/build/LaLune.ipa
          fail_on_unmatched_files: true
