name: iOS сборка

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:
    inputs:
      build_config:
        description: 'Тип сборки'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build-ios:
    name: Сборка iOS приложения
    runs-on: macos-latest
    
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      - name: Установка XcodeGen
        run: |
          brew install xcodegen

      - name: Получение latest версии ядра
        id: get_version
        run: |
          LATEST=$(curl -sL https://raw.githubusercontent.com/Endlad2/csqtt-core/refs/heads/main/LATEST)
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest core version: $LATEST"

      - name: Скачивание ядра CSQTT
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          mkdir -p Mobile/IOS/Core
          curl -fL -o Mobile/IOS/Core/libcsqtt_ios_core.a \
            "https://github.com/Endlad2/csqtt-core/releases/download/${VERSION}/libcsqtt_ios_core.a"
          ls -la Mobile/IOS/Core/
      - name: Проверка функций в .a
  	run: |
    	  nm -gU Mobile/IOS/Core/libcsqtt_ios_core.a | grep -i csqtt
    	  lipo -info Mobile/IOS/Core/libcsqtt_ios_core.a

      - name: Подготовка HTML для iOS
        run: |
          cp Frontend/app.html Frontend/app-ios.html
          sed -i '' 's|<script src="{QTWEBCHANNEL_SCRIPT}"></script>||g' Frontend/app-ios.html
          sed -i '' 's|<script src="{API_SCRIPT}"></script>||g' Frontend/app-ios.html
          sed -i '' 's|</body>|<script src="ios.js"></script></body>|' Frontend/app-ios.html

      - name: Генерация Xcode проекта
        run: |
          cd Mobile/IOS
          xcodegen generate
          
      - name: Сборка .app бандла
        run: |
          cd Mobile/IOS
          
          CONFIG="${{ github.event.inputs.build_config || 'Release' }}"
          
          xcodebuild \
            -project LaLune.xcodeproj \
            -scheme LaLune \
            -configuration $CONFIG \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Создание неподписанного .ipa
        run: |
          cd Mobile/IOS
          
          CONFIG="${{ github.event.inputs.build_config || 'Release' }}"
          
          mkdir -p build/Payload
          
          cp -R "build/$CONFIG-iphoneos/LaLune.app" "build/Payload/"
          
          cd build
          zip -r LaLune.ipa Payload/

      - name: Загрузка .ipa артефакта
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-iOS-${{ github.sha }}
          path: Mobile/IOS/build/LaLune.ipa
          if-no-files-found: error
