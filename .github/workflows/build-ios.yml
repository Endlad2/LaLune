# .github/workflows/build-ios.yml
#
# Сборка LaLune под iOS (Flutter native + Swift backend + CSQTT + PaperFlux).

name: Build iOS

on:
  workflow_dispatch:
    inputs:
      stable_version:
        description: 'Release version (empty uses STABLE-shortsha)'
        required: false
        type: string
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.29.0"
  XCODE_APP: /Applications/Xcode_15.4.app
  CSQTT_IOS_CORE_URL: https://github.com/Endlad2/csqtt-core/releases/latest/download/libcsqtt_ios_core.a
  CSQTTR_IOS_CORE_URL: https://github.com/Endlad2/csqttr-core/releases/latest/download/libcsqttr_ios_core.a
  PAPERFLUX_IOS_ZIP_URL: https://github.com/Endlad2/PaperFlux-core/releases/latest/download/paperflux-ios.zip

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.stable_version }}" ]]; then
            VERSION="${{ inputs.stable_version }}"
          else
            STABLE="$(tr -d '\\r\\n' < STABLE)"
            VERSION="${STABLE}-$(git rev-parse --short=7 HEAD)"
          fi
          echo "LALUNE_VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 - "$VERSION" <<'PY'
          from pathlib import Path
          import sys
          path = Path('Backend/iOS/Backend.swift')
          source = path.read_text(encoding='utf-8')
          import re
          updated, count = re.subn(r'private let VERSION = "[^"]*"', f'private let VERSION = "{sys.argv[1]}"', source, count=1)
          if count != 1:
              raise SystemExit('Could not stamp iOS backend version')
          path.write_text(updated, encoding='utf-8')
          PY
          echo "Building iOS version: $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select Xcode
        run: |
          set -e
          if [ ! -d "$XCODE_APP" ]; then
            echo "::warning::$XCODE_APP not found"
            ls -1 /Applications | grep -i '^Xcode' || true
          else
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Copy iOS backend sources
        run: |
          set -e
          mkdir -p Frontend/ios/Runner Frontend/ios/Tunnel

          cp Backend/iOS/Backend.swift              Frontend/ios/Runner/
          cp Backend/iOS/HttpServer.swift           Frontend/ios/Runner/
          cp Backend/iOS/CoreManager.swift          Frontend/ios/Runner/
          cp Backend/iOS/VkWebViewController.swift  Frontend/ios/Runner/
          cp Backend/iOS/Socks5Server.swift         Frontend/ios/Runner/

          cp Backend/iOS/PacketTunnelProvider.swift Frontend/ios/Tunnel/

          if [ ! -f Frontend/ios/Runner/Socks5Server.swift ]; then
            echo "::error::Socks5Server.swift missing"
            exit 1
          fi

      - name: Copy assets
        run: |
          rm -rf Frontend/assets
          cp -r Assets Frontend/assets

      - name: Flutter pub get
        working-directory: Frontend
        run: flutter pub get

      - name: Build Flutter iOS frameworks
        working-directory: Frontend
        run: |
          set -e
          flutter build ios-framework --output=ios/Flutter --release
          ls -la ios/Flutter/Release/

      - name: Download CSQTT iOS core
        run: |
          set -e
          mkdir -p Frontend/ios/Core
          cd Frontend/ios/Core
          curl -fL --retry 3 --retry-delay 2 -o libcsqtt_ios_core.a "$CSQTT_IOS_CORE_URL"
          ls -la libcsqtt_ios_core.a

      - name: Set up Rust for CSQTTR fallback build
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Download CSQTTR iOS core
        run: |
          set -e
          mkdir -p Frontend/ios/Core
          if curl -fL --retry 2 --retry-delay 2 -o Frontend/ios/Core/libcsqttr_ios_core.a "$CSQTTR_IOS_CORE_URL"; then
            echo "Downloaded published CSQTTR iOS core"
          else
            echo "::warning::No CSQTTR release asset yet; building from the linked core PR branch"
            rm -f Frontend/ios/Core/libcsqttr_ios_core.a
            git clone --depth 1 --branch feat/csqttr-ci-ios-latest https://github.com/Endlad2/csqttr-core.git /tmp/csqttr-core
            cargo build --manifest-path /tmp/csqttr-core/ios-core/Cargo.toml --release --target x86_64-apple-ios
            cargo build --manifest-path /tmp/csqttr-core/ios-core/Cargo.toml --release --target aarch64-apple-ios
            lipo -create \
              /tmp/csqttr-core/ios-core/target/x86_64-apple-ios/release/libcsqttr_ios_core.a \
              /tmp/csqttr-core/ios-core/target/aarch64-apple-ios/release/libcsqttr_ios_core.a \
              -output Frontend/ios/Core/libcsqttr_ios_core.a
          fi
          ls -la Frontend/ios/Core/libcsqttr_ios_core.a

      - name: Download PaperFlux iOS core
        run: |
          set -e
          mkdir -p Frontend/ios/Core/paperflux
          cd Frontend/ios/Core/paperflux
          curl -fL --retry 3 --retry-delay 2 -o paperflux-ios.zip "$PAPERFLUX_IOS_ZIP_URL"
          unzip -o paperflux-ios.zip
          ls -la
          # liboflux.a + liboflux.h должны быть здесь.

      - name: Generate Xcode project
        working-directory: Frontend/ios
        run: |
          set -e
          xcodegen generate
          PBX=Runner.xcodeproj/project.pbxproj
          if grep -q 'objectVersion = 77;' "$PBX"; then
            sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' "$PBX"
          fi
          grep -q 'Socks5Server.swift' "$PBX" || { echo "::error::Socks5Server.swift NOT in project"; exit 1; }

      - name: Archive (unsigned)
        working-directory: Frontend/ios
        run: |
          set -e
          xcodebuild archive \
            -project Runner.xcodeproj \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LaLune.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        working-directory: Frontend/ios
        run: |
          set -e
          APP="build/LaLune.xcarchive/Products/Applications/LaLune.app"
          [ -d "$APP" ] || { echo "::error::$APP missing"; exit 1; }
          rm -rf build/Payload build/LaLune.ipa
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/LaLune.app
          ( cd build && zip -qry LaLune.ipa Payload )
          ls -la build/LaLune.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-iOS-unsigned
          path: Frontend/ios/build/LaLune.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Frontend/ios/build/LaLune.ipa
          fail_on_unmatched_files: true
