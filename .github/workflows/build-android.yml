name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Download core binaries
        run: |
          mkdir -p Mobile/Android/app/src/main/jniLibs/arm64-v8a
          mkdir -p Mobile/Android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p Mobile/Android/app/src/main/jniLibs/x86_64

          echo "Downloading ARM64..."
          curl -L --fail --retry 3 --retry-delay 2 -o Mobile/Android/app/src/main/jniLibs/arm64-v8a/libclient-android-arm64-v8a.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-arm64-v8a.so

          echo "Downloading ARMv7..."
          curl -L --fail --retry 3 --retry-delay 2 -o Mobile/Android/app/src/main/jniLibs/armeabi-v7a/libclient-android-armeabi-v7a.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-armeabi-v7a.so

          echo "Downloading x86_64..."
          curl -L --fail --retry 3 --retry-delay 2 -o Mobile/Android/app/src/main/jniLibs/x86_64/libclient-android-x86_64.so \
            https://github.com/Endlad2/csqtt-core/releases/latest/download/libclient-android-x86_64.so

          echo "Downloaded files:"
          ls -la Mobile/Android/app/src/main/jniLibs/arm64-v8a/
          ls -la Mobile/Android/app/src/main/jniLibs/armeabi-v7a/
          ls -la Mobile/Android/app/src/main/jniLibs/x86_64/

      - name: Build APK
        run: |
          cd Mobile/Android
          gradle assembleRelease --no-daemon

      - name: Sign APK (debug key)
        run: |
          cd Mobile/Android
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          
          # Создаём debug keystore если нет
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # Подписываем
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Android-Universal
          path: Mobile/Android/app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: LaLune Android v${{ github.run_number }}
          files: Mobile/Android/app/build/outputs/apk/release/app-release-signed.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
