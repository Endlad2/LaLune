name: Build LaLune (Android, native UI)

# Native Flutter Android app + Rust Backend (Backend/) cross-compiled for Android ABIs.
# Replaces the legacy build-android.yml.new which targeted the removed Mobile/Android layout.

on:
  push:
    branches:
      - main
      - release
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FLUTTER_CHANNEL: stable

jobs:
  android:
    name: Android APK (arm64 + armv7)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Build Rust Backend for Android ABIs
        working-directory: Backend
        run: |
          set -eux
          # aarch64 (arm64-v8a)
          export CC_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang
          export AR_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          cargo build --release --target aarch64-linux-android
          # armv7 (armeabi-v7a)
          export CC_armv7_linux_androideabi=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang
          export AR_armv7_linux_androideabi=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          cargo build --release --target armv7-linux-androideabi
          # x86_64
          export CC_x86_64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang
          export AR_x86_64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          cargo build --release --target x86_64-linux-android
          ls -la target/*/release/liblalune_backend.so

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Place Rust libs into Android jniLibs
        run: |
          set -eux
          AND=Frontend/Core/android/app/src/main/jniLibs
          mkdir -p $AND/arm64-v8a $AND/armeabi-v7a $AND/x86_64
          cp Backend/target/aarch64-linux-android/release/liblalune_backend.so $AND/arm64-v8a/
          cp Backend/target/armv7-linux-androideabi/release/liblalune_backend.so $AND/armeabi-v7a/
          cp Backend/target/x86_64-linux-android/release/liblalune_backend.so $AND/x86_64/
          find $AND -type f

      - name: Flutter pub get
        working-directory: Frontend/Core
        run: flutter pub get

      - name: Flutter build APK
        working-directory: Frontend/Core
        run: flutter build apk --release

      - name: Rename artifact
        run: |
          cp Frontend/Core/build/app/outputs/flutter-apk/app-release.apk LaLune-Android.apk
          ls -la LaLune-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LaLune-Android
          path: LaLune-Android.apk
          if-no-files-found: error