[package]
name = "csqtt-link"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "CLI + library for parsing and decrypting csqtt:// links"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "csqtt_link"
path = "src/lib.rs"
# На non-Android: lib + staticlib (staticlib для iOS).
# cdylib (для Android libcsqtt_decode.so) добавляется через [target.'cfg(...)'].
crate-type = ["lib", "staticlib"]

[[bin]]
name = "csqtt-link"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
url = "2.5"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
hex = "0.4"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
