[package]
name = "deploy-manager"
version = "0.1.0"
edition = "2021"
description = "Cross-platform deployer for LaLune protocol cores (CSQTT/FreeTurn/OlcRTC/OpenFlux/ToTS) over SSH"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "deploy-manager"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true