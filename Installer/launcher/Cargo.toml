[package]
name = "lalune-installer"
version = "0.6.0"
edition = "2021"
description = "LaLune GUI Installer for Windows"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Endlad7373 <vladut7373@gmail.com>"]
build = "build.rs"

[[bin]]
name = "LaLune-Installer"
path = "src/main.rs"

[dependencies]
# GUI (лёгкий)
native-windows-gui = "1.0"

# Распаковка встроенных zip
zip = { version = "2.1", default-features = false, features = ["deflate"] }

# Прочее
anyhow = "1"
tempfile = "3"

[build-dependencies]
# Скачивание во время сборки
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "2.1", default-features = false, features = ["deflate"] }
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
