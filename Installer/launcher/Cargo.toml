[package]
name = "lalune-installer"
version = "0.6.0"
edition = "2021"
description = "LaLune GUI Installer for Windows"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Endlad7373 <vladut7373@gmail.com>"]
build = "build.rs"

[[bin]]
name = "LaLune-Installer"
path = "src/main.rs"

[dependencies]
# GUI (лёгкий, без C++ toolchain — только WinAPI)
native-windows-gui = "1.0"

# Распаковка встроенных zip
zip = { version = "2.1", default-features = false, features = ["deflate"] }

# Прочее
anyhow = "1"
dirs = "5"

# Windows-specific: shell API для ярлыков (COM-обёртка)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }

[build-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "2.1", default-features = false, features = ["deflate"] }
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
