[package]
name = "la-lune-launcher"
version = "1.0.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Cross-platform launcher for LaLune application"
license = "MIT"

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "stream"] }
zip = "0.6"
dirs = "5.0"
which = "4.4"
whoami = "1.4"
tempfile = "3.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dialoguer = "0.11"
sysinfo = "0.29"
