[package]
name = "lalune-backend"
version = "0.6.0"
edition = "2021"
description = "LaLune backend daemon for Windows/Linux (axum + tun)"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Endlad7373 <vladut7373@gmail.com>"]

[[bin]]
name = "lalune-backend"
path = "src/main.rs"

[dependencies]
# Async runtime + HTTP
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
hostname = "0.4"
num_cpus = "1"

# Async
futures = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"

# Concurrency
parking_lot = "0.12"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# TUN
tun = "0.6"

# SQLite
rusqlite = { version = "0.31", features = ["bundled"] }

# Regex
regex = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
