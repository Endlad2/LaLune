name: lalune
description: LaLune — native Flutter client for CSQTT VPN
version: 0.6.0
publish_to: 'none'

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.2

  # State
  flutter_riverpod: ^2.5.1

  # Utils
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_lints: ^4.0.0

  # Генератор иконок для Android / iOS / macOS
  flutter_launcher_icons: ^0.13.1

# ============================================================
#  Генерация иконок приложений.
#
#  Запуск:
#    cd Frontend
#    flutter pub get
#    flutter pub run flutter_launcher_icons
#
#  Источник: Assets/icon.png (1024×1024, RGBA) в КОРНЕ репо.
#  Путь указывается как "../Assets/icon.png" относительно Frontend/.
#
#  Что будет перезаписано:
#    Frontend/android/app/src/main/res/mipmap-*/
#    Frontend/ios/Runner/Assets.xcassets/AppIcon.appiconset/*
#
#  Windows .ico и Assets/icon_foreground.png генерирует
#  make_icons.py (см. корень репо).
# ============================================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../Assets/icon.png"

  # Адаптивная иконка Android 8+
  adaptive_icon_background: "#0A0E2A"
  adaptive_icon_foreground: "../Assets/icon_foreground.png"

  # Убрать alpha у iOS (App Store не принимает прозрачность)
  remove_alpha_ios: true

  # macOS (если соберёшь)
  macos:
    generate: true
    image_path: "../Assets/icon.png"

flutter:
  uses-material-design: true

  # Сюда build.py копирует корневой Assets/.
  assets:
    - assets/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
