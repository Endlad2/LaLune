plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.lalune.app"
    compileSdk = 34

    // NDK 25.1.8937393 — требование path_provider_android и url_launcher_android.
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += [
            "-Xjvm-default=all",
            "-Xskip-metadata-version-check",
        ]
    }

    defaultConfig {
        applicationId = "com.lalune.app"
        minSdk = 24

        // targetSdk = 28 — legacy-режим, в котором SELinux разрешает
        // execve() из nativeLibraryDir. Именно так работал старый
        // рабочий проект. На targetSdk 29+ Android блокирует запуск
        // бинарников из /data/app/.../lib/, и наше ядро не стартует.
        targetSdk = 28

        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false

            // debuggable=true — второй рубеж: даже если прошивка
            // игнорирует legacy-режим targetSdk, debuggable-приложениям
            // SELinux разрешает execve из app_data_file/apk_data_file.
            debuggable = true
        }
        debug {
            debuggable = true
        }
    }

    packagingOptions {
        jniLibs {
            // Соответствует android:extractNativeLibs="true".
            // .so распаковываются в nativeLibraryDir при установке,
            // откуда их и запускает CoreManager.
            useLegacyPackaging = true
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // AppCompat — нужен для Theme.AppCompat.NoActionBar в styles.xml.
    implementation "androidx.appcompat:appcompat:1.7.0"

    // Стандартные androidx-зависимости Flutter-проекта.
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.annotation:annotation:1.9.1"

    // Kotlin stdlib — явно, чтобы Gradle не тащил 1.9.x из транзитивных
    // зависимостей в обход KGP.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"

    // Coroutines — нужны для withContext(Dispatchers.IO) в CoreManager
    // и lifecycleScope.launch в MainActivity.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // Lua 5.1 рантайм для SmartTunnelManager.kt.
    // Содержит org.luaj.vm2.* (Globals, LuaValue, LuaError, LuaTable,
    // Varargs, VarArgFunction) и org.luaj.vm2.lib.jse.JsePlatform.
    // Без этой зависимости SmartTunnelManager.kt не компилируется —
    // сотни ошибок "Unresolved reference: luaj".
    implementation "org.luaj:luaj-jse:3.0.1"
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24"
    }
}
