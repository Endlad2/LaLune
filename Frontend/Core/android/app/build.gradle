plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.lalune.app"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        // Подавляем предупреждения о metadata-version, если какая-то
        // транзитивная зависимость окажется собрана Kotlin 2.0.
        freeCompilerArgs += [
            "-Xjvm-default=all",
            "-Xskip-metadata-version-check",
        ]
    }

    defaultConfig {
        applicationId = "com.lalune.app"
        minSdk = 24
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        ndk {
            // Под наши нативные ядра
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Kotlin stdlib — явно, чтобы Gradle не тащил 1.9.24 из транзитивных
    // зависимостей в обход KGP.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // Lua 5.1 рантайм для SmartTunnel
    implementation "org.luaj:luaj-jse:3.0.1"
}

// Форсируем одну версию kotlin-stdlib во всём дереве, чтобы избежать
// конфликта metadata 1.7.1 vs 1.9.0.
configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24"
    }
}
