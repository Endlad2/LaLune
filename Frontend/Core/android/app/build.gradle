plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.lalune.app"
    compileSdk = 34

    // NDK 25.1.8937393 — требование path_provider_android и url_launcher_android.
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += [
            "-Xjvm-default=all",
            "-Xskip-metadata-version-check",
        ]
    }

    defaultConfig {
        applicationId = "com.lalune.app"
        minSdk = 24

        // targetSdk = 28 — legacy-режим, в котором SELinux разрешает
        // execve() из nativeLibraryDir.
        targetSdk = 28

        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false

            // debuggable=true — второй рубеж: даже если прошивка
            // игнорирует legacy-режим targetSdk, debuggable-приложениям
            // SELinux разрешает execve из app_data_file/apk_data_file.
            debuggable = true
        }
        debug {
            debuggable = true
        }
    }

    // ВАЖНО: useLegacyPackaging НЕ задаём. Он конфликтует с
    // flutter-gradle-plugin и Gradle складывает APK в
    // build/app/outputs/apk/release/ вместо build/app/outputs/flutter-apk/,
    // из-за чего Flutter пишет "Gradle build failed to produce an .apk file".
    //
    // extractNativeLibs="true" в AndroidManifest.xml уже обеспечивает
    // распаковку .so в nativeLibraryDir — этого достаточно.
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // Lua 5.1 рантайм для SmartTunnelManager.kt.
    // Без него — сотни "Unresolved reference: luaj".
    implementation "org.luaj:luaj-jse:3.0.1"
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24"
    }
}
