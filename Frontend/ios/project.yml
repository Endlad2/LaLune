name: Runner
options:
  bundleIdPrefix: com.lalune
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.4"
  objectVersion: 56

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:

  # ──────────────────────────────────────────────────────────
  #  Основное приложение
  # ──────────────────────────────────────────────────────────
  Runner:
    type: application
    platform: iOS
    sources:
      - path: Runner
        excludes:
          - "Info.plist"
      - path: Entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lalune.lalune
        PRODUCT_NAME: LaLune
        INFOPLIST_FILE: Runner/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Entitlements/Runner.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Runner/Runner-Bridging-Header.h
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "NetworkExtension"
          - "-framework"
          - "WebKit"
          - "-framework"
          - "AuthenticationServices"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - target: LaLuneTunnel
        embed: true
        codeSign: true

  # ──────────────────────────────────────────────────────────
  #  Network Extension (Packet Tunnel)
  # ──────────────────────────────────────────────────────────
  LaLuneTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
        excludes:
          - "Info.plist"
      - path: Entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lalune.lalune.tunnel
        PRODUCT_NAME: LaLuneTunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Entitlements/LaLuneTunnel.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Tunnel/LaLune-Bridging-Header.h
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Core"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lcsqtt_ios_core"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        SKIP_INSTALL: YES

schemes:
  Runner:
    build:
      targets:
        Runner: all
        LaLuneTunnel: all
    run:
      config: Debug
    archive:
      config: Release
