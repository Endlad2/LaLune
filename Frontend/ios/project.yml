name: Runner
options:
  bundleIdPrefix: com.lalune
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.4"
  objectVersion: 56

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    TARGETED_DEVICE_FAMILY: "1,2"

targets:

  # ──────────────────────────────────────────────────────────
  #  Основное приложение (Flutter runner)
  # ──────────────────────────────────────────────────────────
  Runner:
    type: application
    platform: iOS
    sources:
      - path: Runner
        excludes:
          - "Info.plist"
      - path: Entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lalune.lalune
        PRODUCT_NAME: LaLune
        INFOPLIST_FILE: Runner/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Entitlements/Runner.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Runner/Runner-Bridging-Header.h

        # Flutter framework'и, сгенерированные `flutter build ios-framework --release`.
        # Путь: Flutter/Release/*.xcframework
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Flutter/Release"

        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Flutter"
          - "-framework"
          - "App"
          - "-framework"
          - "FlutterPluginRegistrant"
          - "-framework"
          - "shared_preferences_foundation"
          - "-framework"
          - "NetworkExtension"
          - "-framework"
          - "WebKit"
          - "-framework"
          - "AuthenticationServices"

        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

    # НЕТ preBuildScripts — framework'и уже готовы на момент архивации.

    # Embed Flutter.framework и plugin-фреймворки в .app/Frameworks/
    postCompileScripts:
      - name: "Embed Flutter Frameworks"
        basedOnDependencyAnalysis: false
        script: |
          set -e

          FW_DST="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          mkdir -p "$FW_DST"

          for fw in Flutter App FlutterPluginRegistrant shared_preferences_foundation; do
            SRC="${SRCROOT}/Flutter/Release/${fw}.xcframework/ios-arm64/${fw}.framework"
            if [ -d "$SRC" ]; then
              rm -rf "$FW_DST/${fw}.framework"
              cp -R "$SRC" "$FW_DST/"
              echo "Embedded: ${fw}.framework"
            else
              echo "WARNING: not found ${SRC}"
            fi
          done

    postBuildScripts:
      - name: "Copy Flutter Assets"
        basedOnDependencyAnalysis: false
        script: |
          set -e

          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$DST"

          # flutter_assets лежат внутри App.framework
          SRC="${SRCROOT}/Flutter/Release/App.xcframework/ios-arm64/App.framework/flutter_assets"
          if [ -d "$SRC" ]; then
            rm -rf "$DST/flutter_assets"
            cp -R "$SRC" "$DST/"
            echo "Copied flutter_assets"
          else
            echo "WARNING: flutter_assets not found at $SRC"
            # Fallback: возможно, flutter_assets лежат рядом с App.framework
            ALT="${SRCROOT}/Flutter/Release/App.xcframework/ios-arm64/flutter_assets"
            if [ -d "$ALT" ]; then
              cp -R "$ALT" "$DST/"
              echo "Copied flutter_assets (fallback)"
            fi
          fi

    dependencies:
      - target: LaLuneTunnel
        embed: true
        codeSign: true

  # ──────────────────────────────────────────────────────────
  #  Network Extension (Packet Tunnel)
  # ──────────────────────────────────────────────────────────
  LaLuneTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
        excludes:
          - "Info.plist"
      - path: Entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lalune.lalune.tunnel
        PRODUCT_NAME: LaLuneTunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Entitlements/LaLuneTunnel.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Tunnel/LaLune-Bridging-Header.h
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Core"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lcsqtt_ios_core"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        SKIP_INSTALL: YES

schemes:
  Runner:
    build:
      targets:
        Runner: all
        LaLuneTunnel: all
    run:
      config: Debug
    archive:
      config: Release
