<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaLune</title>
    <link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Overpass Mono', monospace; }
        body { background: radial-gradient(ellipse at 20% 30%, #1a2a6c, #0a0e2a 60%, #04060f); height: 100vh; overflow: hidden; display: flex; flex-direction: column; color: #ffffff; }
        .stars { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; }
        .app { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; max-width: 820px; margin: 0 auto; width: 100%; height: 100vh; padding: 0 20px; }
        .header { display: flex; justify-content: flex-end; padding: 16px 8px 0 0; flex-shrink: 0; }
        .btn-plus { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: white; cursor: pointer; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .btn-plus:hover { background: rgba(255,255,255,0.15); }
        .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 0 20px 0; overflow: hidden; }
        .moon-container { position: relative; margin-bottom: 24px; }
        .moon-btn { background: none; border: none; cursor: pointer; padding: 0; display: block; transition: transform 0.2s; position: relative; }
        .moon-btn:hover { transform: scale(1.03); }
        .moon-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .moon-btn svg { display: block; width: 130px; height: 130px; }
        .moon-stars { position: absolute; top: 50%; left: 50%; width: 200px; height: 200px; transform: translate(-50%, -50%); pointer-events: none; opacity: 0; transition: opacity 0.6s; }
        .moon-stars.active { opacity: 1; }
        .moon-star { position: absolute; background: #f7e84e; border-radius: 50%; animation: twinkle 0.8s ease-in-out infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.2; transform: scale(0.6); } 100% { opacity: 1; transform: scale(1.2); } }
        .status-text { font-size: 18px; color: rgba(255,255,255,0.6); margin-bottom: 20px; letter-spacing: 0.5px; }
        .config-selector { width: 100%; max-width: 420px; position: relative; }
        .config-selector-header { background: rgba(255,255,255,0.08); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
        .config-selector-header:hover { background: rgba(255,255,255,0.14); }
        .config-selector-header span { font-size: 17px; color: rgba(255,255,255,0.85); }
        .config-selector-header svg { transition: transform 0.25s; }
        .config-selector-header.open svg { transform: rotate(180deg); }
        .config-dropdown { position: absolute; bottom: calc(100% + 6px); left: 0; right: 0; background: rgba(18, 22, 45, 0.96); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease, opacity 0.25s ease, transform 0.25s ease; opacity: 0; transform: translateY(8px); pointer-events: none; }
        .config-dropdown.open { max-height: 320px; overflow-y: auto; opacity: 1; transform: translateY(0); pointer-events: auto; }
        .config-dropdown::-webkit-scrollbar { width: 4px; }
        .config-dropdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        .config-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; position: relative; cursor: pointer; }
        .config-item:hover { background: rgba(255,255,255,0.08); }
        .config-item .protocol-badge { font-size: 12px; font-weight: 600; text-transform: uppercase; color: #4a6cf7; background: rgba(74,108,247,0.15); padding: 2px 10px; border-radius: 20px; margin-right: 14px; flex-shrink: 0; }
        .config-item .config-name { flex: 1; font-size: 15px; color: rgba(255,255,255,0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .config-item .delete-btn { background: none; border: none; padding: 4px; cursor: pointer; opacity: 0; transition: opacity 0.15s; flex-shrink: 0; }
        .config-item:hover .delete-btn { opacity: 1; }
        .config-item.selected { background: rgba(74,108,247,0.15); border-left: 3px solid #4a6cf7; }
        .bottom-nav { display: flex; justify-content: space-around; padding: 10px 8px 16px 8px; flex-shrink: 0; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.15); }
        .nav-btn { background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 18px; border-radius: 10px; transition: color 0.2s, background 0.2s; font-size: 13px; font-weight: 600; }
        .nav-btn:hover { color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.05); }
        .nav-btn.active { color: #f7e84e; background: rgba(247,232,78,0.08); }
        .logs-container { flex: 1; background: rgba(0,0,0,0.35); border-radius: 12px; padding: 12px 16px; font-size: 14px; color: rgba(255,255,255,0.8); overflow-y: auto; min-height: 200px; max-height: 400px; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
        .logs-container::-webkit-scrollbar { width: 4px; }
        .logs-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
        .logs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .logs-header h3 { font-weight: 600; font-size: 18px; color: rgba(255,255,255,0.7); }
        .btn-clear { background: none; border: none; cursor: pointer; padding: 4px; opacity: 0.5; transition: opacity 0.2s; }
        .btn-clear:hover { opacity: 1; }
        .settings-group { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.06); }
        .settings-group .group-title { font-weight: 600; font-size: 17px; color: rgba(255,255,255,0.85); margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .settings-group .group-title .arrow { transition: transform 0.25s; font-size: 14px; }
        .settings-group .group-title.open .arrow { transform: rotate(180deg); }
        .settings-group .group-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .settings-group .group-body.open { max-height: 600px; overflow-y: auto; }
        .settings-row { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
        .settings-row label { font-size: 15px; color: rgba(255,255,255,0.7); min-width: 110px; }
        .settings-row input[type="range"] { flex: 1; accent-color: #4a6cf7; height: 4px; background: rgba(255,255,255,0.15); border-radius: 4px; }
        .settings-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #4a6cf7; cursor: pointer; }
        .settings-row input[type="number"], .settings-row input[type="text"], .settings-row input[type="password"], .settings-row select { width: 70px; padding: 6px 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; font-size: 15px; text-align: center; }
        .settings-row input[type="text"], .settings-row input[type="password"] { width: auto; flex: 1; text-align: left; min-width: 120px; }
        .settings-row select { width: auto; min-width: 100px; text-align: left; appearance: auto; cursor: pointer; }
        .settings-row input:focus, .settings-row select:focus { outline: none; border-color: #4a6cf7; }
        .settings-row textarea { flex: 1; padding: 8px 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: white; font-size: 15px; resize: vertical; min-height: 60px; }
        .settings-row textarea:focus { outline: none; border-color: #4a6cf7; }
        .settings-row .hint { font-size: 12px; color: rgba(255,255,255,0.35); }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; }
        .settings-grid .settings-row { margin-bottom: 6px; }
        .settings-grid .settings-row label { min-width: 80px; font-size: 14px; }
        .info-title { font-size: 28px; font-weight: 700; color: #f7e84e; margin-bottom: 8px; }
        .info-sub { font-size: 16px; color: rgba(255,255,255,0.5); margin-bottom: 18px; }
        .info-block { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 16px 24px; margin-bottom: 10px; width: 100%; max-width: 380px; border: 1px solid rgba(255,255,255,0.06); }
        .info-block .label { font-size: 13px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.5px; }
        .info-block .value { font-size: 16px; color: rgba(255,255,255,0.85); margin-top: 2px; }
        .info-block .value a { color: #4a6cf7; text-decoration: none; }
        .info-block .value a:hover { text-decoration: underline; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-overlay.open { display: flex; }
        .modal { background: radial-gradient(ellipse at 20% 30%, #1a2a6c, #0f1540); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 28px 32px; max-width: 520px; width: 92%; box-shadow: 0 25px 60px rgba(0,0,0,0.6); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { font-size: 22px; font-weight: 700; }
        .modal-close { background: none; border: none; color: rgba(255,255,255,0.4); font-size: 28px; cursor: pointer; padding: 0 4px; }
        .modal-close:hover { color: white; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 15px; color: rgba(255,255,255,0.6); margin-bottom: 6px; }
        .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: white; font-size: 16px; }
        .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #4a6cf7; }
        .form-group textarea { resize: vertical; min-height: 70px; }
        .import-buttons { display: flex; gap: 8px; }
        .import-btn { flex: 1; padding: 8px 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; color: rgba(255,255,255,0.5); cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .import-btn.active { background: rgba(74,108,247,0.15); border-color: #4a6cf7; color: white; }
        .import-btn:hover { background: rgba(255,255,255,0.08); }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-secondary { padding: 10px 22px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 15px; transition: background 0.2s; }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        .btn-primary { padding: 10px 28px; background: #4a6cf7; border: none; border-radius: 10px; color: white; cursor: pointer; font-size: 15px; font-weight: 700; transition: background 0.2s; }
        .btn-primary:hover { background: #3a5cd7; }
        .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); padding: 12px 28px; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); border-radius: 12px; font-size: 16px; color: white; opacity: 0; transition: opacity 0.35s; pointer-events: none; z-index: 50; }
        .toast.show { opacity: 1; }
        .settings-scroll { max-height: 500px; overflow-y: auto; padding-right: 4px; }
        .settings-scroll::-webkit-scrollbar { width: 4px; }
        .settings-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
        .settings-row .toggle-label { display: flex; align-items: center; gap: 10px; cursor: pointer; min-width: auto; }
        .settings-row .toggle-label input[type="checkbox"] { width: 18px; height: 18px; accent-color: #4a6cf7; cursor: pointer; }
        .update-banner { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(247,232,78,0.15); border: 1px solid #f7e84e; border-radius: 12px; padding: 10px 20px; z-index: 200; display: none; align-items: center; gap: 12px; font-size: 14px; color: #f7e84e; backdrop-filter: blur(8px); }
        .update-banner.show { display: flex; }
        .update-banner button { background: #f7e84e; border: none; border-radius: 8px; padding: 6px 16px; cursor: pointer; font-weight: 700; color: #0a0e2a; }
        @media (max-width: 600px) { .settings-grid { grid-template-columns: 1fr; } .settings-row { flex-wrap: wrap; } .settings-row label { min-width: 70px; font-size: 14px; } .modal { padding: 20px; } }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="app" id="app">
        <div class="header">
            <button class="btn-plus" onclick="showAddModal()">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </button>
        </div>
        <div class="content" id="content"></div>
        <div class="bottom-nav">
            <button class="nav-btn active" data-tab="connection" onclick="switchTab('connection')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <span>Подключение</span>
            </button>
            <button class="nav-btn" data-tab="settings" onclick="switchTab('settings')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                <span>Настройки</span>
            </button>
            <button class="nav-btn" data-tab="info" onclick="switchTab('info')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="16" x2="12" y2="12"/>
                    <line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
                <span>Информация</span>
            </button>
            <button class="nav-btn" data-tab="logs" onclick="switchTab('logs')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="9" y1="9" x2="15" y2="9"/>
                    <line x1="9" y1="15" x2="15" y2="15"/>
                    <line x1="9" y1="12" x2="15" y2="12"/>
                </svg>
                <span>Логи</span>
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Добавить конфиг</h2>
                <button class="modal-close" onclick="closeAddModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Протокол</label>
                    <select id="protocolSelect"><option value="csqtt">CSQTT</option></select>
                </div>
                <div class="form-group">
                    <label>Способ импорта</label>
                    <div class="import-buttons">
                        <button class="import-btn active" onclick="setImportMethod('manual')">Ручной ввод</button>
                        <button class="import-btn" onclick="setImportMethod('clipboard')">Буфер обмена</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Ссылка подключения</label>
                    <textarea id="configInput" rows="3" placeholder="csqtt://connect?v=2&host=..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeAddModal()">Отмена</button>
                <button class="btn-primary" onclick="saveConfig()">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="update-banner" id="updateBanner"></div>

    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
        var api = null;
        var selectedConfigId = null;
        var isConnected = false;
        var configs = [];
        var importMethod = 'manual';
        var settings = { peer: '', vkHashes: '', turnHost: '', turnPort: '', workersPerHash: 9, obfs: 'video', fingerprint: 'firefox', clientIds: '8202606,6287487', vkAuthMode: 'vkcalls', captchaMode: 'auto', deviceId: '', autoConnect: false };

        function generateStars() {
            var container = document.getElementById('stars');
            for (var i = 0; i < 80; i++) {
                var star = document.createElement('div');
                star.className = 'star';
                var size = 0.5 + Math.random() * 1.8;
                star.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' + (Math.random()*100) + '%;top:' + (Math.random()*100) + '%;opacity:' + (0.2+Math.random()*0.7) + ';animation:twinkle ' + (1.5+Math.random()*2) + 's ease-in-out infinite alternate';
                container.appendChild(star);
            }
        }

        function generateMoonStars() {
            var container = document.getElementById('moonStars');
            if (!container) return;
            container.innerHTML = '';
            for (var i = 0; i < 16; i++) {
                var star = document.createElement('div');
                star.className = 'moon-star';
                var angle = Math.random() * 2 * Math.PI;
                var dist = 40 + Math.random() * 60;
                star.style.cssText = 'left:' + (50+Math.cos(angle)*dist) + '%;top:' + (50+Math.sin(angle)*dist) + '%;width:' + (2+Math.random()*4) + 'px;height:' + (2+Math.random()*4) + 'px;animation-delay:' + (Math.random()*0.6) + 's;animation-duration:' + (0.5+Math.random()*0.5) + 's';
                container.appendChild(star);
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
            var navBtn = document.querySelector('.nav-btn[data-tab="' + tab + '"]');
            if (navBtn) navBtn.classList.add('active');
            var content = document.getElementById('content');
            var pages = { connection: getConnectionPageHTML(), settings: getSettingsPageHTML(), info: getInfoPageHTML(), logs: getLogsPageHTML() };
            content.innerHTML = pages[tab];
            if (tab === 'connection') {
                generateMoonStars();
                updateConfigList();
                updateSelectedConfigDisplay();
                updateMoonState();
                var btn = document.getElementById('moonBtn');
                if (btn) btn.disabled = !selectedConfigId && !isConnected;
            }
            if (tab === 'settings') loadSettings();
            if (tab === 'logs') {
                var container = document.getElementById('logsContainer');
                if (container && window._logBuffer) {
                    container.textContent = window._logBuffer || '';
                    container.scrollTop = container.scrollHeight;
                }
            }
        }

        function getConnectionPageHTML() {
            var html = '<div class="moon-container">';
            html += '<button class="moon-btn" id="moonBtn" onclick="toggleConnect()">';
            html += '<svg viewBox="0 0 100 100" width="130" height="130"><circle cx="50" cy="50" r="48" fill="#1a1a3e" stroke="#4a6cf7" stroke-width="2"/><path d="M60 18 A28 28 0 1 0 82 58 A34 34 0 1 1 60 18 Z" fill="#f7e84e" stroke="#d4c42a" stroke-width="1.5"/><circle cx="28" cy="30" r="2" fill="#4a6cf7" opacity="0.35"/><circle cx="74" cy="26" r="1.5" fill="#4a6cf7" opacity="0.25"/><circle cx="22" cy="70" r="1.8" fill="#4a6cf7" opacity="0.3"/><circle cx="78" cy="68" r="1.2" fill="#4a6cf7" opacity="0.2"/><circle cx="34" cy="76" r="1.5" fill="#4a6cf7" opacity="0.25"/></svg>';
            html += '</button><div class="moon-stars" id="moonStars"></div></div>';
            html += '<div id="statusText" class="status-text">' + (isConnected ? 'Подключено' : (selectedConfigId ? 'Готов к подключению' : 'Выберите конфиг')) + '</div>';
            html += '<div class="config-selector" id="configSelector">';
            html += '<div class="config-selector-header" onclick="toggleConfigDropdown()"><span id="selectedConfigName">' + getSelectedConfigName() + '</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>';
            html += '<div class="config-dropdown" id="configDropdown"><div id="configList"></div></div></div>';
            return html;
        }

        function getSettingsPageHTML() {
            var html = '<div style="width:100%;max-width:550px;margin:0 auto;"><div class="settings-scroll">';
            html += '<div class="settings-group"><div class="group-title open" onclick="toggleSettingsGroup(this)">Основные параметры<span class="arrow">v</span></div>';
            html += '<div class="group-body open">';
            html += '<div class="settings-row"><label>Peer</label><input type="text" id="peerInput" placeholder="203.0.113.10:46000" value="' + settings.peer + '"></div>';
            html += '<div class="settings-row"><label>Пароль</label><input type="password" id="passwordInput" style="flex:1;"></div>';
            html += '<div class="settings-row"><label>VK хеши</label><textarea id="hashesInput" rows="2">' + settings.vkHashes + '</textarea></div>';
            html += '<div class="settings-row"><label>Воркеров на хеш</label><input type="range" id="workersSlider" min="9" max="27" step="9" value="' + settings.workersPerHash + '" oninput="updateWorkers(this.value)"><input type="number" id="workersInput" min="9" max="27" step="9" value="' + settings.workersPerHash + '" onchange="updateWorkersFromInput(this.value)"><span class="hint">(кратно 9)</span></div>';
            html += '</div></div>';
            html += '<div class="settings-group"><div class="group-title" onclick="toggleSettingsGroup(this)">Дополнительные настройки<span class="arrow">v</span></div>';
            html += '<div class="group-body"><div class="settings-grid">';
            html += '<div class="settings-row"><label>TURN host</label><input type="text" id="turnHostInput" value="' + settings.turnHost + '"></div>';
            html += '<div class="settings-row"><label>TURN port</label><input type="text" id="turnPortInput" value="' + settings.turnPort + '"></div>';
            html += '<div class="settings-row"><label>Обфускация</label><select id="obfsSelect"><option value="video"' + (settings.obfs==='video'?' selected':'') + '>video</option><option value="audio"' + (settings.obfs==='audio'?' selected':'') + '>audio</option></select></div>';
            html += '<div class="settings-row"><label>TLS fingerprint</label><select id="fingerprintSelect"><option value="firefox"' + (settings.fingerprint==='firefox'?' selected':'') + '>firefox</option><option value="chrome"' + (settings.fingerprint==='chrome'?' selected':'') + '>chrome</option><option value="edge"' + (settings.fingerprint==='edge'?' selected':'') + '>edge</option><option value="safari"' + (settings.fingerprint==='safari'?' selected':'') + '>safari</option><option value="opera"' + (settings.fingerprint==='opera'?' selected':'') + '>opera</option></select></div>';
            html += '<div class="settings-row"><label>Client IDs</label><input type="text" id="clientIdsInput" value="' + settings.clientIds + '"></div>';
            html += '<div class="settings-row"><label>VK auth</label><select id="vkAuthSelect"><option value="vkcalls"' + (settings.vkAuthMode==='vkcalls'?' selected':'') + '>vkcalls</option><option value="legacy"' + (settings.vkAuthMode==='legacy'?' selected':'') + '>legacy</option></select></div>';
            html += '<div class="settings-row"><label>Captcha</label><select id="captchaSelect"><option value="auto"' + (settings.captchaMode==='auto'?' selected':'') + '>auto</option><option value="manual"' + (settings.captchaMode==='manual'?' selected':'') + '>manual</option></select></div>';
            html += '</div></div></div>';
            html += '<div class="settings-group"><div class="group-title" onclick="toggleSettingsGroup(this)">Системные<span class="arrow">v</span></div>';
            html += '<div class="group-body">';
            html += '<div class="settings-row"><label>Device ID</label><input type="text" id="deviceIdInput" value="' + (settings.deviceId||'') + '" style="flex:1;"><button class="btn-secondary" onclick="document.getElementById(\'deviceIdInput\').value=generateDeviceId();" style="padding:4px 12px;font-size:13px;">Сгенерировать</button></div>';
            html += '<div class="settings-row"><label class="toggle-label"><input type="checkbox" id="autoConnectCheck"' + (settings.autoConnect?' checked':'') + ' onchange="saveSettings()">Автоподключение при запуске</label></div>';
            html += '</div></div>';
            html += '<button class="btn-primary" onclick="saveSettings()" style="width:100%;margin-top:8px;">Сохранить настройки</button>';
            html += '</div></div>';
            return html;
        }

        function getInfoPageHTML() {
            return '<div class="info-title">LaLune</div><div class="info-sub">Кроссплатформенный клиент CSQTT</div>' +
                '<div class="info-block"><div class="label">Разработчики</div><div class="value">CSQTT - amurcanov</div><div class="value" style="margin-top:4px;">LaLune - Endlad7373</div></div>' +
                '<div class="info-block"><div class="label">Поддержать CSQTT</div><div class="value"><a href="https://yoomoney.ru/to/4100119505530465/100" target="_blank">YooMoney</a></div></div>' +
                '<div class="info-block"><div class="label">Поддержать LaLune</div><div class="value">2202208453630882 (Сбер)</div></div>' +
                '<div class="info-block"><div class="label">Версии</div><div class="value">CSQTT 2.0.5 - LaLune 0.4</div></div>';
        }

        function getLogsPageHTML() {
            return '<div class="logs-header"><h3>Журнал</h3><button class="btn-clear" onclick="clearLogs()"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18v2H3z" fill="#E67E22"/><path d="M5 8h14v1H5z" fill="#E67E22"/><path d="M8 3c0-1.5 8-1.5 8 0v2h-2V3.5c0-0.5-6-0.5-6 0V5H8z" fill="#E67E22"/><path d="M6 8l1.5 13h9L18 8H6z" fill="#F39C12" stroke="#E67E22" stroke-width="1"/><path d="M6 8l1.5 13h4V8H6z" fill="#E67E22" opacity="0.3"/><line x1="8" y1="12" x2="16" y2="12" stroke="#E67E22" stroke-width="0.8"/><line x1="8.5" y1="16" x2="15.5" y2="16" stroke="#E67E22" stroke-width="0.8"/></svg></button></div>' +
                '<div class="logs-container" id="logsContainer"></div>';
        }

        function getSelectedConfigName() {
            if (!selectedConfigId) return 'Нет конфига';
            for (var i = 0; i < configs.length; i++) {
                if (configs[i].id === selectedConfigId) return configs[i].name || configs[i].peer;
            }
            return 'Нет конфига';
        }

        function updateSelectedConfigDisplay() {
            var el = document.getElementById('selectedConfigName');
            if (el) el.textContent = getSelectedConfigName();
        }

        function toggleConfigDropdown() {
            var dd = document.getElementById('configDropdown');
            var h = document.querySelector('.config-selector-header');
            if (dd) { dd.classList.toggle('open'); if (h) h.classList.toggle('open'); }
        }

        function updateConfigList() {
            var container = document.getElementById('configList');
            if (!container) return;
            if (!configs || configs.length === 0) {
                container.innerHTML = '<div style="padding:16px;text-align:center;color:rgba(255,255,255,0.3);font-size:16px;">Нет сохранённых конфигов</div>';
                return;
            }
            var html = '';
            for (var i = 0; i < configs.length; i++) {
                var c = configs[i];
                var name = c.name || c.peer;
                html += '<div class="config-item' + (selectedConfigId===c.id?' selected':'') + '" onclick="selectConfig(' + c.id + ')">';
                html += '<span class="protocol-badge">' + c.protocol + '</span>';
                html += '<span class="config-name">' + name + '</span>';
                html += '<button class="delete-btn" onclick="event.stopPropagation();deleteConfig(' + c.id + ')">';
                html += '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18v2H3z" fill="#E67E22"/><path d="M5 8h14v1H5z" fill="#E67E22"/><path d="M8 3c0-1.5 8-1.5 8 0v2h-2V3.5c0-0.5-6-0.5-6 0V5H8z" fill="#E67E22"/><path d="M6 8l1.5 13h9L18 8H6z" fill="#F39C12" stroke="#E67E22" stroke-width="1"/><path d="M6 8l1.5 13h4V8H6z" fill="#E67E22" opacity="0.3"/><line x1="8" y1="12" x2="16" y2="12" stroke="#E67E22" stroke-width="0.8"/><line x1="8.5" y1="16" x2="15.5" y2="16" stroke="#E67E22" stroke-width="0.8"/></svg>';
                html += '</button></div>';
            }
            container.innerHTML = html;
        }

        function selectConfig(id) {
            selectedConfigId = id;
            updateConfigList();
            updateSelectedConfigDisplay();
            toggleConfigDropdown();
            updateMoonState();
        }

        function updateMoonState() {
            var btn = document.getElementById('moonBtn');
            var status = document.getElementById('statusText');
            if (btn) btn.disabled = !selectedConfigId && !isConnected;
            if (status) {
                if (isConnected) status.textContent = 'Подключено';
                else if (selectedConfigId) {
                    var name = 'Готов к подключению';
                    for (var i = 0; i < configs.length; i++) {
                        if (configs[i].id === selectedConfigId) name = 'Готов к подключению: ' + (configs[i].name || configs[i].peer);
                    }
                    status.textContent = name;
                } else status.textContent = 'Выберите конфиг';
            }
        }

        function toggleConnect() {
            if (!api) { showToast('API не подключен'); return; }
            if (isConnected) { api.disconnect(); return; }
            if (!selectedConfigId) { showToast('Выберите конфиг'); return; }
            api.connect(selectedConfigId);
        }

        function setConnected(state) {
            isConnected = state;
            updateMoonState();
            var stars = document.getElementById('moonStars');
            if (stars) stars.classList.toggle('active', state);
            var btn = document.getElementById('moonBtn');
            if (btn) btn.disabled = false;
            var status = document.getElementById('statusText');
            if (status) status.textContent = state ? 'Подключено' : (selectedConfigId ? 'Готов к подключению' : 'Выберите конфиг');
        }

        function showAddModal() {
            document.getElementById('addModal').classList.add('open');
            document.getElementById('configInput').value = '';
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('open');
        }

        function setImportMethod(method) {
            importMethod = method;
            document.querySelectorAll('.import-btn').forEach(function(b) { b.classList.remove('active'); });
            var btns = document.querySelectorAll('.import-btn');
            btns[method === 'manual' ? 0 : 1].classList.add('active');
            if (method === 'clipboard') {
                navigator.clipboard.readText().then(function(text) {
                    document.getElementById('configInput').value = text;
                }).catch(function() {
                    showToast('Не удалось прочитать буфер обмена');
                });
            }
        }

        function saveConfig() {
            var input = document.getElementById('configInput');
            var link = input.value.trim();
            if (!link) { showToast('Введите ссылку'); return; }
            if (link.indexOf('csqtt://') !== 0) { showToast('Неверный формат ссылки'); return; }
            if (!api) { showToast('API не подключен'); return; }
            api.saveConfig(link).then(function(result) {
                closeAddModal();
                if (result) {
                    showToast('Конфиг сохранён');
                } else {
                    showToast('Ошибка сохранения');
                }
            });
        }

        function deleteConfig(id) {
            if (!api) { showToast('API не подключен'); return; }
            if (!confirm('Удалить конфиг?')) return;
            api.deleteConfig(id);
        }

        function refreshConfigs(json) {
            try {
                configs = JSON.parse(json);
                updateConfigList();
                updateSelectedConfigDisplay();
                updateMoonState();
            } catch(e) {
                console.error('refreshConfigs error:', e);
            }
        }

        function refreshSettings(json) {
            try {
                settings = JSON.parse(json);
                var deviceInput = document.getElementById('deviceIdInput');
                if (deviceInput) deviceInput.value = settings.deviceId || '';
            } catch(e) {
                console.error('refreshSettings error:', e);
            }
        }

        function appendLog(line) {
            var container = document.getElementById('logsContainer');
            if (!container) { if (!window._logBuffer) window._logBuffer = ''; window._logBuffer += line + '\n'; return; }
            container.textContent += line + '\n';
            container.scrollTop = container.scrollHeight;
        }

        function clearLogs() {
            window._logBuffer = '';
            var container = document.getElementById('logsContainer');
            if (container) container.textContent = '';
            if (api) api.clearLogs();
        }

        function showToast(msg) {
            var el = document.getElementById('toast');
            if (!el) return;
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._timeout);
            el._timeout = setTimeout(function() { el.classList.remove('show'); }, 3000);
        }

        function toggleSettingsGroup(el) {
            var body = el.parentElement.querySelector('.group-body');
            if (body) { body.classList.toggle('open'); el.classList.toggle('open'); }
        }

        function loadSettings() {
            var fields = {
                peerInput: settings.peer,
                passwordInput: '',
                hashesInput: settings.vkHashes,
                workersSlider: settings.workersPerHash,
                workersInput: settings.workersPerHash,
                turnHostInput: settings.turnHost,
                turnPortInput: settings.turnPort,
                obfsSelect: settings.obfs,
                fingerprintSelect: settings.fingerprint,
                clientIdsInput: settings.clientIds,
                vkAuthSelect: settings.vkAuthMode,
                captchaSelect: settings.captchaMode,
                deviceIdInput: settings.deviceId || ''
            };
            for (var id in fields) {
                var el = document.getElementById(id);
                if (el) {
                    if (el.tagName === 'SELECT') {
                        for (var i = 0; i < el.options.length; i++) {
                            if (el.options[i].value === fields[id]) { el.options[i].selected = true; break; }
                        }
                    } else {
                        el.value = fields[id];
                    }
                }
            }
            var autoCheck = document.getElementById('autoConnectCheck');
            if (autoCheck) autoCheck.checked = settings.autoConnect || false;
        }

        function saveSettings() {
            if (!api) { showToast('API не подключен'); return; }
            var peer = document.getElementById('peerInput');
            var password = document.getElementById('passwordInput');
            var hashes = document.getElementById('hashesInput');
            var workers = document.getElementById('workersInput');
            var turnHost = document.getElementById('turnHostInput');
            var turnPort = document.getElementById('turnPortInput');
            var obfs = document.getElementById('obfsSelect');
            var fingerprint = document.getElementById('fingerprintSelect');
            var clientIds = document.getElementById('clientIdsInput');
            var vkAuth = document.getElementById('vkAuthSelect');
            var captcha = document.getElementById('captchaSelect');
            var deviceId = document.getElementById('deviceIdInput');
            var autoConnect = document.getElementById('autoConnectCheck');
            settings.peer = peer ? peer.value : '';
            settings.vkHashes = hashes ? hashes.value : '';
            settings.turnHost = turnHost ? turnHost.value : '';
            settings.turnPort = turnPort ? turnPort.value : '';
            settings.workersPerHash = workers ? parseInt(workers.value) || 9 : 9;
            settings.obfs = obfs ? obfs.value : 'video';
            settings.fingerprint = fingerprint ? fingerprint.value : 'firefox';
            settings.clientIds = clientIds ? clientIds.value : '8202606,6287487';
            settings.vkAuthMode = vkAuth ? vkAuth.value : 'vkcalls';
            settings.captchaMode = captcha ? captcha.value : 'auto';
            var deviceValue = deviceId ? deviceId.value.trim() : '';
            if (deviceValue && deviceValue !== 'auto') {
                settings.deviceId = deviceValue;
            }
            settings.autoConnect = autoConnect ? autoConnect.checked : false;
            if (password && password.value) api.savePassword(password.value);
            api.saveSettings(JSON.stringify(settings));
            showToast('Настройки сохранены');
        }

        function updateWorkers(val) {
            var input = document.getElementById('workersInput');
            if (input) input.value = val;
            settings.workersPerHash = parseInt(val);
        }

        function updateWorkersFromInput(val) {
            var v = parseInt(val);
            if (isNaN(v)) v = 9;
            v = Math.max(9, Math.min(27, v));
            v = Math.round(v/9)*9;
            if (v < 9) v = 9;
            var slider = document.getElementById('workersSlider');
            if (slider) slider.value = v;
            var input = document.getElementById('workersInput');
            if (input) input.value = v;
            settings.workersPerHash = v;
        }

        function generateDeviceId() {
            var id = 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'.replace(/x/g, function() {
                return Math.floor(Math.random()*16).toString(16);
            });
            var input = document.getElementById('deviceIdInput');
            if (input) input.value = id;
            settings.deviceId = id;
        }

        function showUpdateBanner(version) {
            var banner = document.getElementById('updateBanner');
            if (!banner) return;
            banner.innerHTML = '<span>Доступна новая версия ядра: ' + version + '</span><button onclick="updateCore()">Обновить</button>';
            banner.classList.add('show');
        }

        function updateCore() {
            if (!api) { showToast('API не подключен'); return; }
            if (isConnected) { showToast('Сначала отключитесь'); return; }
            api.updateCore();
            var banner = document.getElementById('updateBanner');
            if (banner) banner.classList.remove('show');
            showToast('Обновление запущено');
        }

        document.addEventListener('DOMContentLoaded', function() {
            generateStars();
            switchTab('connection');
            if (typeof qt !== 'undefined' && qt.webChannelTransport) {
                new QWebChannel(qt.webChannelTransport, function(channel) {
                    api = channel.objects.api;
                    api.getConfigsJson().then(function(configsJson) {
                        configs = JSON.parse(configsJson);
                        if (configs.length > 0) selectedConfigId = configs[0].id;
                        updateConfigList();
                        updateSelectedConfigDisplay();
                        updateMoonState();
                    }).catch(function(e) {
                        console.error('Init configs error:', e);
                    });
                    api.getSettingsJson().then(function(settingsJson) {
                        settings = JSON.parse(settingsJson);
                        var deviceInput = document.getElementById('deviceIdInput');
                        if (deviceInput) deviceInput.value = settings.deviceId || '';
                    }).catch(function(e) {
                        console.error('Init settings error:', e);
                    });
                });
            }
            document.addEventListener('click', function(e) {
                var sel = document.getElementById('configSelector');
                if (sel && !sel.contains(e.target)) {
                    var dd = document.getElementById('configDropdown');
                    var h = document.querySelector('.config-selector-header');
                    if (dd) dd.classList.remove('open');
                    if (h) h.classList.remove('open');
                }
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeAddModal();
            });
        });
    </script>
</body>
</html>
