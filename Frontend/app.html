<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaLune</title>
    <link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; font-family: 'Overpass Mono', monospace; }
        body { background: radial-gradient(ellipse at 20% 30%, #1a2a6c, #0a0e2a 60%, #04060f); height: 100vh; overflow: hidden; display: flex; flex-direction: column; color: #ffffff; }
        .stars { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; }
        .app { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; max-width: 820px; margin: 0 auto; width: 100%; height: 100vh; padding: 0 20px; }
        .header { display: flex; justify-content: flex-end; padding: 16px 8px 0 0; flex-shrink: 0; }
        .btn-plus { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: white; cursor: pointer; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .btn-plus:hover { background: rgba(255,255,255,0.15); }
        .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 0 20px 0; overflow: hidden; }
        .moon-container { position: relative; margin-bottom: 24px; display: block; }
        .moon-btn { background: none; border: none; cursor: pointer; padding: 0; display: block; transition: transform 0.2s; position: relative; }
        .moon-btn:hover { transform: scale(1.03); }
        .moon-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .moon-btn svg { display: block; width: 130px; height: 130px; }
        .moon-stars { position: absolute; top: 50%; left: 50%; width: 200px; height: 200px; transform: translate(-50%, -50%); pointer-events: none; opacity: 0; transition: opacity 0.6s; }
        .moon-stars.active { opacity: 1; }
        .moon-star { position: absolute; background: #f7e84e; border-radius: 50%; animation: twinkle 0.8s ease-in-out infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.2; transform: scale(0.6); } 100% { opacity: 1; transform: scale(1.2); } }
        .status-text { font-size: 18px; color: rgba(255,255,255,0.6); margin-bottom: 20px; letter-spacing: 0.5px; display: block; }
        .config-selector { width: 100%; max-width: 420px; position: relative; display: block; }
        .config-selector-header { background: rgba(255,255,255,0.08); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
        .config-selector-header:hover { background: rgba(255,255,255,0.14); }
        .config-selector-header span { font-size: 17px; color: rgba(255,255,255,0.85); }
        .config-selector-header svg { transition: transform 0.25s; }
        .config-selector-header.open svg { transform: rotate(180deg); }
        .config-dropdown { position: absolute; bottom: calc(100% + 6px); left: 0; right: 0; background: rgba(18, 22, 45, 0.96); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease, opacity 0.25s ease, transform 0.25s ease; opacity: 0; transform: translateY(8px); pointer-events: none; }
        .config-dropdown.open { max-height: 320px; overflow-y: auto; opacity: 1; transform: translateY(0); pointer-events: auto; }
        .config-dropdown::-webkit-scrollbar { width: 4px; }
        .config-dropdown::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        .config-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; position: relative; cursor: pointer; }
        .config-item:hover { background: rgba(255,255,255,0.08); }
        .config-item .protocol-badge { font-size: 12px; font-weight: 600; text-transform: uppercase; color: #4a6cf7; background: rgba(74,108,247,0.15); padding: 2px 10px; border-radius: 20px; margin-right: 14px; flex-shrink: 0; }
        .config-item .config-name { flex: 1; font-size: 15px; color: rgba(255,255,255,0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .config-item .delete-btn { background: none; border: none; padding: 4px; cursor: pointer; opacity: 0; transition: opacity 0.15s; flex-shrink: 0; }
        .config-item:hover .delete-btn { opacity: 1; }
        .config-item.selected { background: rgba(74,108,247,0.15); border-left: 3px solid #4a6cf7; }
        .bottom-nav { display: flex; justify-content: space-around; padding: 10px 8px 16px 8px; flex-shrink: 0; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.15); }
        .nav-btn { background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 18px; border-radius: 10px; transition: color 0.2s, background 0.2s; font-size: 13px; font-weight: 600; }
        .nav-btn:hover { color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.05); }
        .nav-btn.active { color: #f7e84e; background: rgba(247,232,78,0.08); }
        .logs-container { flex: 1; background: rgba(0,0,0,0.35); border-radius: 12px; padding: 12px 16px; font-size: 14px; color: rgba(255,255,255,0.8); overflow-y: auto; min-height: 200px; max-height: 400px; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
        .logs-container::-webkit-scrollbar { width: 4px; }
        .logs-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
        .logs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .logs-header h3 { font-weight: 600; font-size: 18px; color: rgba(255,255,255,0.7); }
        .btn-clear { background: none; border: none; cursor: pointer; padding: 4px; opacity: 0.5; transition: opacity 0.2s; }
        .btn-clear:hover { opacity: 1; }
        .settings-group { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.06); }
        .settings-group .group-title { font-weight: 600; font-size: 17px; color: rgba(255,255,255,0.85); margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .settings-group .group-title .arrow { transition: transform 0.25s; font-size: 14px; }
        .settings-group .group-title.open .arrow { transform: rotate(180deg); }
        .settings-group .group-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .settings-group .group-body.open { max-height: 600px; overflow-y: auto; }
        .settings-row { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
        .settings-row label { font-size: 15px; color: rgba(255,255,255,0.7); min-width: 110px; }
        .settings-row input[type="range"] { flex: 1; accent-color: #4a6cf7; height: 4px; background: rgba(255,255,255,0.15); border-radius: 4px; }
        .settings-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #4a6cf7; cursor: pointer; }
        .settings-row input[type="number"], .settings-row input[type="text"], .settings-row input[type="password"], .settings-row select { width: 70px; padding: 6px 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; font-size: 15px; text-align: center; }
        .settings-row input[type="text"], .settings-row input[type="password"] { width: auto; flex: 1; text-align: left; min-width: 120px; }
        .settings-row select { width: auto; min-width: 100px; text-align: left; appearance: auto; cursor: pointer; }
        .settings-row input:focus, .settings-row select:focus { outline: none; border-color: #4a6cf7; }
        .settings-row textarea { flex: 1; padding: 8px 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: white; font-size: 15px; resize: vertical; min-height: 60px; }
        .settings-row textarea:focus { outline: none; border-color: #4a6cf7; }
        .settings-row .hint { font-size: 12px; color: rgba(255,255,255,0.35); }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; }
        .settings-grid .settings-row { margin-bottom: 6px; }
        .settings-grid .settings-row label { min-width: 80px; font-size: 14px; }
        .info-title { font-size: 28px; font-weight: 700; color: #f7e84e; margin-bottom: 8px; }
        .info-sub { font-size: 16px; color: rgba(255,255,255,0.5); margin-bottom: 18px; }
        .info-block { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 16px 24px; margin-bottom: 10px; width: 100%; max-width: 380px; border: 1px solid rgba(255,255,255,0.06); }
        .info-block .label { font-size: 13px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.5px; }
        .info-block .value { font-size: 16px; color: rgba(255,255,255,0.85); margin-top: 2px; }
        .info-block .value a { color: #4a6cf7; text-decoration: none; }
        .info-block .value a:hover { text-decoration: underline; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-overlay.open { display: flex; }
        .modal { background: radial-gradient(ellipse at 20% 30%, #1a2a6c, #0f1540); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 28px 32px; max-width: 520px; width: 92%; box-shadow: 0 25px 60px rgba(0,0,0,0.6); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { font-size: 22px; font-weight: 700; }
        .modal-close { background: none; border: none; color: rgba(255,255,255,0.4); font-size: 28px; cursor: pointer; padding: 0 4px; }
        .modal-close:hover { color: white; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 15px; color: rgba(255,255,255,0.6); margin-bottom: 6px; }
        .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: white; font-size: 16px; }
        .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #4a6cf7; }
        .form-group textarea { resize: vertical; min-height: 70px; }
        .import-buttons { display: flex; gap: 8px; }
        .import-btn { flex: 1; padding: 8px 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; color: rgba(255,255,255,0.5); cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .import-btn.active { background: rgba(74,108,247,0.15); border-color: #4a6cf7; color: white; }
        .import-btn:hover { background: rgba(255,255,255,0.08); }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-secondary { padding: 10px 22px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 15px; transition: background 0.2s; }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        .btn-primary { padding: 10px 28px; background: #4a6cf7; border: none; border-radius: 10px; color: white; cursor: pointer; font-size: 15px; font-weight: 700; transition: background 0.2s; }
        .btn-primary:hover { background: #3a5cd7; }
        .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); padding: 12px 28px; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); border-radius: 12px; font-size: 16px; color: white; opacity: 0; transition: opacity 0.35s; pointer-events: none; z-index: 50; }
        .toast.show { opacity: 1; }
        .settings-scroll { max-height: 500px; overflow-y: auto; padding-right: 4px; }
        .settings-scroll::-webkit-scrollbar { width: 4px; }
        .settings-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
        .settings-row .toggle-label { display: flex; align-items: center; gap: 10px; cursor: pointer; min-width: auto; }
        .settings-row .toggle-label input[type="checkbox"] { width: 18px; height: 18px; accent-color: #4a6cf7; cursor: pointer; }
        .update-banner { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(247,232,78,0.15); border: 1px solid #f7e84e; border-radius: 12px; padding: 10px 20px; z-index: 200; display: none; align-items: center; gap: 12px; font-size: 14px; color: #f7e84e; backdrop-filter: blur(8px); }
        .update-banner.show { display: flex; }
        .update-banner button { background: #f7e84e; border: none; border-radius: 8px; padding: 6px 16px; cursor: pointer; font-weight: 700; color: #0a0e2a; }
        @media (max-width: 600px) { .settings-grid { grid-template-columns: 1fr; } .settings-row { flex-wrap: wrap; } .settings-row label { min-width: 70px; font-size: 14px; } .modal { padding: 20px; } }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="app" id="app">
        <div class="header">
            <button class="btn-plus" onclick="showAddModal()">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </button>
        </div>
        <div class="content" id="content">
            <!-- Луна -->
            <div class="moon-container" id="moonContainer">
                <button class="moon-btn" id="moonBtn" onclick="toggleConnect()">
                    <svg viewBox="0 0 100 100">
                        <defs>
                            <radialGradient id="moonGrad" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" style="stop-color:#ffffff"/>
                                <stop offset="100%" style="stop-color:#c0c8e0"/>
                            </radialGradient>
                        </defs>
                        <circle cx="50" cy="50" r="40" fill="url(#moonGrad)" stroke="#ffffff" stroke-width="2"/>
                        <circle cx="35" cy="35" r="6" fill="#d0d8e8" opacity="0.6"/>
                        <circle cx="60" cy="25" r="4" fill="#d0d8e8" opacity="0.5"/>
                        <circle cx="25" cy="55" r="5" fill="#d0d8e8" opacity="0.4"/>
                        <circle cx="65" cy="55" r="7" fill="#d0d8e8" opacity="0.5"/>
                        <circle cx="45" cy="70" r="4" fill="#d0d8e8" opacity="0.45"/>
                        <circle cx="70" cy="70" r="5" fill="#d0d8e8" opacity="0.4"/>
                    </svg>
                </button>
                <div class="moon-stars" id="moonStars">
                    <div class="moon-star" style="left:15%;top:10%;width:6px;height:6px;"></div>
                    <div class="moon-star" style="left:75%;top:25%;width:4px;height:4px;animation-delay:0.3s;"></div>
                    <div class="moon-star" style="left:20%;top:60%;width:5px;height:5px;animation-delay:0.5s;"></div>
                    <div class="moon-star" style="left:85%;top:65%;width:3px;height:3px;animation-delay:0.2s;"></div>
                    <div class="moon-star" style="left:50%;top:80%;width:7px;height:7px;animation-delay:0.6s;"></div>
                    <div class="moon-star" style="left:65%;top:5%;width:5px;height:5px;animation-delay:0.4s;"></div>
                </div>
            </div>
            
            <!-- Статус -->
            <div class="status-text" id="statusText">Отключено</div>
            
            <!-- Селектор конфигов -->
            <div class="config-selector">
                <div class="config-selector-header" onclick="toggleConfigDropdown()">
                    <span id="selectedConfigName">Выберите конфиг</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </div>
                <div class="config-dropdown" id="configDropdown"></div>
            </div>
        </div>
        <div class="bottom-nav">
            <button class="nav-btn active" data-tab="connection" onclick="switchTab('connection')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <span>Подключение</span>
            </button>
            <button class="nav-btn" data-tab="settings" onclick="switchTab('settings')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                <span>Настройки</span>
            </button>
            <button class="nav-btn" data-tab="info" onclick="switchTab('info')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="16" x2="12" y2="12"/>
                    <line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
                <span>Информация</span>
            </button>
            <button class="nav-btn" data-tab="logs" onclick="switchTab('logs')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="9" y1="9" x2="15" y2="9"/>
                    <line x1="9" y1="15" x2="15" y2="15"/>
                    <line x1="9" y1="12" x2="15" y2="12"/>
                </svg>
                <span>Логи</span>
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Добавить конфиг</h2>
                <button class="modal-close" onclick="closeAddModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Протокол</label>
                    <select id="protocolSelect"><option value="csqtt">CSQTT</option></select>
                </div>
                <div class="form-group">
                    <label>Способ импорта</label>
                    <div class="import-buttons">
                        <button class="import-btn active" onclick="setImportMethod('manual')">Ручной ввод</button>
                        <button class="import-btn" onclick="setImportMethod('clipboard')">Буфер обмена</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Ссылка подключения</label>
                    <textarea id="configInput" rows="3" placeholder="csqtt://connect?v=2&host=..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeAddModal()">Отмена</button>
                <button class="btn-primary" onclick="saveConfig()">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="update-banner" id="updateBanner"></div>

    <script src="{QTWEBCHANNEL_SCRIPT}"></script>
    <script src="{API_SCRIPT}"></script>
</body>
</html>
